<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heshy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111;
    --muted:#6E6E6E;
    --line:#DEDEDE;
    --line-strong:#B8B8B8;
    --paper:#FFFFFF;
    --bg:#FBFBFA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 24px 120px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:32px 0 40px;border-bottom:1px solid var(--line);margin-bottom:40px;
  }
  .brand{font-family:'Source Serif 4',serif;font-size:20px;font-weight:500;}
  .manage-link{
    font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;
    font-family:'Inter',sans-serif;padding:0;text-decoration:underline;text-underline-offset:3px;
  }
  .manage-link:hover{color:var(--ink);}

  .step-label{font-size:13px;color:var(--muted);margin-bottom:8px;}
  .step-line{height:2px;background:var(--line);margin-bottom:40px;position:relative;}
  .step-line::after{
    content:'';position:absolute;left:0;top:0;height:2px;background:var(--ink);
    width:var(--pct,0%);transition:width .3s ease;
  }

  h1{font-family:'Source Serif 4',serif;font-weight:500;font-size:26px;margin:0 0 28px;}
  .intro{font-size:15px;line-height:1.65;color:var(--ink);max-width:520px;margin:0 0 32px;}

  .type-toggle{display:flex;gap:8px;margin-bottom:24px;}
  .type-btn{
    flex:1;padding:13px 0;border:1px solid var(--line-strong);border-radius:6px;text-align:center;
    cursor:pointer;font-size:14px;font-weight:500;background:var(--paper);
  }
  .type-btn:hover{border-color:var(--ink);}
  .type-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .day-strip{display:flex;gap:8px;margin-bottom:24px;overflow-x:auto;padding-bottom:2px;}
  .day-cell{
    flex:0 0 auto;width:64px;padding:12px 0;border:1px solid var(--line-strong);border-radius:6px;
    text-align:center;cursor:pointer;background:var(--paper);
  }
  .day-cell:hover{border-color:var(--ink);}
  .day-cell.active{background:var(--ink);border-color:var(--ink);}
  .day-cell .dow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .day-cell.active .dow{color:#BEBEBE;}
  .day-cell .dnum{font-family:'Source Serif 4',serif;font-size:19px;margin-top:2px;}
  .day-cell.active .dnum{color:#fff;}
  .day-cell .dcount{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .day-cell.active .dcount{color:#BEBEBE;}
  .time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .time-cell{
    border:1px solid var(--line-strong);border-radius:6px;padding:12px 10px;cursor:pointer;text-align:center;
  }
  .time-cell:hover{border-color:var(--ink);}
  .time-cell.selected{background:var(--ink);border-color:var(--ink);}
  .time-cell .time{font-size:14px;font-weight:500;}
  .time-cell.selected .time{color:#fff;}
  .time-cell .format{font-size:11px;color:var(--muted);margin-top:2px;}
  .time-cell.selected .format{color:#BEBEBE;}

  .day-title{font-size:14px;font-weight:600;margin:24px 0 10px;}
  .day-title:first-child{margin-top:0;}
  .slot-list{border-top:1px solid var(--line);}
  .slot{
    display:flex;align-items:center;justify-content:space-between;padding:16px 4px;
    border-bottom:1px solid var(--line);cursor:pointer;
  }
  .slot:hover{background:#F4F4F2;}
  .slot.selected{background:#EFEFED;}
  .slot .time{font-size:15px;font-weight:500;}
  .slot .format{font-size:13px;color:var(--muted);}
  .slot .radio{
    width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-strong);flex-shrink:0;
  }
  .slot.selected .radio{border-color:var(--ink);background:var(--ink);box-shadow:inset 0 0 0 3px #fff;}
  .empty{color:var(--muted);font-size:14px;padding:24px 0;}

  label{display:block;font-size:13px;font-weight:600;margin:20px 0 6px;}
  .required-mark{color:#A5433A;}
  .optional-mark{color:var(--muted);font-weight:400;font-size:12px;margin-left:4px;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=email],input[type=tel]{
    width:100%;padding:11px 12px;border:1px solid var(--line-strong);border-radius:4px;font-size:14.5px;
    font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);
  }
  .stripe-el{
    padding:11px 12px;border:1px solid var(--line-strong);border-radius:4px;background:var(--paper);
  }
  .card-error{color:#A5433A;font-size:12.5px;margin-top:6px;min-height:16px;}
  input:focus{outline:none;border-color:var(--ink);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .form-section{border-top:1px solid var(--line);padding-top:18px;margin-top:24px;}
  .form-section.last{margin-bottom:8px;}
  .section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:14px;}

  .fact{border-top:1px solid var(--line);padding-top:4px;margin:24px 0 8px;}
  .fact-row{display:flex;justify-content:space-between;gap:16px;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line);}
  .fact-row:last-child{border-bottom:none;}
  .fact-row span:first-child{color:var(--muted);flex:0 0 auto;}
  .fact-row span:last-child{text-align:right;}

  button.primary{
    background:var(--ink);color:#fff;border:none;padding:14px 24px;font-size:14.5px;
    font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;border-radius:4px;
  }
  button.primary:hover{background:#2E2E2E;}
  button.primary:disabled{background:#C7C7C7;cursor:not-allowed;}
  button.ghost{
    background:none;border:1px solid var(--line-strong);padding:13px 20px;font-size:14px;
    cursor:pointer;color:var(--ink);font-family:'Inter',sans-serif;border-radius:4px;
  }
  button.ghost:hover{border-color:var(--ink);}
  button.ghost.danger-ghost{border-color:#D9A8A2;color:#8C2F27;}
  button.ghost.danger-ghost:hover{border-color:#8C2F27;}
  button.small{padding:7px 12px;font-size:12.5px;}
  .btn-row{display:flex;gap:10px;margin-top:28px;}

  .confirm{padding:56px 0 40px;}
  .confirm-mark{
    width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:20px;
  }
  .confirm h1{margin-bottom:8px;}
  .confirm p{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 32px;}
  .join-block{margin-top:24px;}
  .join-block .section-title{margin-bottom:8px;}
  .join-link{color:var(--ink);font-size:14.5px;text-decoration:underline;text-underline-offset:3px;word-break:break-all;}
  .location-text{font-size:14.5px;line-height:1.6;color:var(--ink);}

  /* Admin */
  h2.sect{font-family:'Source Serif 4',serif;font-weight:500;font-size:17px;margin:0 0 14px;}
  .admin-nav{display:flex;gap:4px;margin-bottom:36px;border-bottom:1px solid var(--line);}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-month-label{font-family:'Source Serif 4',serif;font-size:16px;font-weight:500;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:6px;}
  .cal-cell{
    aspect-ratio:1;border:1px solid var(--line);border-radius:6px;padding:6px;position:relative;
    cursor:pointer;display:flex;flex-direction:column;
  }
  .cal-cell:hover{border-color:var(--ink);}
  .cal-cell.empty{border:none;cursor:default;}
  .cal-cell.past{color:var(--line-strong);cursor:default;background:#FAFAF9;}
  .cal-cell.past:hover{border-color:var(--line);}
  .cal-cell.holiday{background:#F7F2E8;border-color:#E9D1A8;}
  .cal-cell.selected{border-color:var(--ink);border-width:2px;}
  .cal-cell.today .cal-daynum{text-decoration:underline;text-underline-offset:2px;}
  .cal-daynum{font-size:12.5px;}
  .cal-dot{width:5px;height:5px;border-radius:50%;background:var(--ink);position:absolute;bottom:6px;left:6px;}
  .cal-cell.past .cal-dot{background:var(--line-strong);}
  .cal-legend{display:flex;gap:20px;margin-top:14px;font-size:12px;color:var(--muted);}
  .cal-dot-legend,.cal-holiday-legend{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .cal-dot-legend{background:var(--ink);}
  .cal-holiday-legend{background:#F7F2E8;border:1px solid #E9D1A8;}
  .day-detail{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);}
  .day-detail-header{font-family:'Source Serif 4',serif;font-size:16px;font-weight:500;margin-bottom:10px;}
  .admin-nav-btn{
    background:none;border:none;padding:12px 4px;margin-right:24px;font-size:14px;font-weight:500;
    color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .admin-nav-btn:hover{color:var(--ink);}
  .admin-nav-btn.active{color:var(--ink);border-bottom-color:var(--ink);}
  .client-link{color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer;}
  .admin-block{margin-bottom:44px;padding-bottom:44px;border-bottom:1px solid var(--line);}
  .admin-block:last-child{border-bottom:none;}
  .dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;}
  .dash-stat{border:1px solid var(--line-strong);border-radius:8px;padding:16px 12px;text-align:center;cursor:pointer;transition:border-color 0.15s,background 0.15s;}
  .dash-stat:hover{border-color:var(--ink);}
  .dash-stat-active{border-color:var(--ink);border-width:2px;background:#F7F5F0;}
  .dash-stat-num{font-size:26px;font-weight:600;line-height:1;}
  .dash-stat-label{font-size:12px;color:var(--muted);margin-top:6px;}
  .dash-stat-alert{border-color:#C9A961;background:#FBF6EA;}
  .dash-stat-alert .dash-stat-num{color:#8A6D2F;}
  @media (max-width:640px){ .dash-stats{grid-template-columns:1fr 1fr;} }
  .admin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;}
  select{
    width:100%;padding:10px;border:1px solid var(--line-strong);border-radius:4px;font-size:14px;
    font-family:'Inter',sans-serif;background:var(--paper);
  }
  .row{
    display:flex;align-items:center;justify-content:space-between;padding:14px 0;
    border-bottom:1px solid var(--line);font-size:14px;
  }
  .slot-list-wrap{margin-top:24px;border-top:1px solid var(--line);}
  .slot-day-row{padding:12px 0;border-bottom:1px solid var(--line);}
  .slot-day-label{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:8px;}
  .slot-chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .slot-chip{
    display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:5px 8px;
    border:1px solid var(--line-strong);border-radius:14px;background:var(--paper);
  }
  .slot-chip.booked{color:var(--muted);background:#F4F4F2;}
  .chip-x{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;
    padding:0;margin-left:2px;
  }
  .chip-x:hover{color:#A5433A;}
  .charge-row{padding-top:4px;}
  .charge-row label:first-of-type{margin-top:0;}
  .day-toggle-row{display:flex;gap:6px;}
  .day-toggle{
    width:34px;height:34px;border:1px solid var(--line-strong);border-radius:6px;display:flex;
    align-items:center;justify-content:center;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .day-toggle:hover{border-color:var(--ink);}
  .day-toggle.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .row .main{font-weight:500;}
  .row .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--line-strong);border-radius:3px;padding:2px 7px;text-transform:capitalize;}
  .tag.status-scheduled{color:var(--muted);border-color:var(--line-strong);}
  .tag.status-completed{color:var(--ink);border-color:var(--ink);}
  .tag.status-charged{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tag.status-cancelled{color:#A5433A;border-color:#A5433A;}
  .session{border-bottom:1px solid var(--line);padding:20px 0;}
  .session:last-child{border-bottom:none;}
  .session-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .session-name{font-weight:600;font-size:14.5px;}
  .session-meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .session-time-big{font-size:22px;font-weight:600;font-family:Georgia,serif;margin-top:4px;line-height:1.2;}
  .session-format{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}
  .session-controls{margin-top:14px;padding:14px;background:#F7F7F5;border-radius:6px;}
  .session-controls label:first-of-type{margin-top:0;}
  .session-actions{margin-top:14px;}
  textarea{
    width:100%;padding:10px 11px;border:1px solid var(--line-strong);border-radius:4px;font-size:14px;
    font-family:'Inter',sans-serif;min-height:56px;resize:vertical;
  }
  .timer{font-family:'Source Serif 4',serif;font-size:20px;}
  .rec-indicator{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:0.04em;color:#A5433A;}
  .rec-dot{width:9px;height:9px;border-radius:50%;background:#D6473C;animation:rec-pulse 1.3s ease-in-out infinite;}
  @keyframes rec-pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}
  .notes-textarea{min-height:160px;}
  .note{font-size:12px;color:var(--muted);margin-top:6px;}
  .client-block{border-bottom:1px solid var(--line);padding:20px 0;}
  .client-block:last-child{border-bottom:none;}
  .client-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .client-name{font-weight:600;font-size:14.5px;}
  .client-total{font-size:12.5px;color:var(--muted);}
  .hist-line{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;color:var(--ink);}
  .hist-line span:last-child{color:var(--muted);}
  .hist-entry{padding:10px 0;border-bottom:1px solid var(--line);}
  .hist-entry:last-child{border-bottom:none;}
  .hist-notes{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5;}
  .wg-badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:0.03em;background:#FBF6EA;color:#8A6D2F;border:1px solid #C9A961;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;}
  .wg-badge-big{display:inline-block;font-size:14px;font-weight:700;letter-spacing:0.06em;background:#FBF6EA;color:#8A6D2F;border:1px solid #C9A961;border-radius:5px;padding:2px 8px;vertical-align:middle;}
  .q-block label:first-of-type{margin-top:14px;}
  .wg-block{border-top:1px solid var(--line);padding-top:18px;margin-top:24px;}
  .wg-block p{font-size:13.5px;line-height:1.6;color:var(--muted);margin:0 0 10px;}
  .wg-link{color:var(--ink);text-decoration:underline;text-underline-offset:3px;}
  input[type=file]{font-size:13px;margin-top:8px;}
  .file-name{font-size:12.5px;color:var(--muted);margin-top:6px;}
  .blocked-msg{background:#FBEAEA;border:1px solid #E3B3AC;border-radius:8px;padding:14px 16px;font-size:13.5px;color:#8C2F27;margin:20px 0;}
  .client-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .client-row:hover{background:#F7F7F5;}
  .client-row .main{font-weight:500;}
  .client-row .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .client-detail{padding:6px 0 24px;border-bottom:1px solid var(--line);}
  .client-detail .qa{font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line);}
  .client-detail .qa:last-child{border-bottom:none;}
  .client-detail .qa .q{color:var(--muted);margin-bottom:3px;}
  .tag.blocked{background:#8C2F27;color:#fff;border-color:#8C2F27;}
  .portal-box{max-width:400px;margin-top:60px;}
  .portal-session{border-bottom:1px solid var(--line);padding:16px 0;}
  .portal-session:last-child{border-bottom:none;}
  .portal-session .top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:500;}
  .portal-session .meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .portal-session .summary{font-size:13.5px;line-height:1.6;margin-top:8px;color:var(--ink);}
  .portal-summary-box{margin-top:12px;padding:14px 16px;background:#FAF9F6;border-left:3px solid #C9A961;border-radius:4px;font-size:13.5px;line-height:1.65;color:var(--ink);}
  .portal-summary-label{font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8A6D2F;margin-bottom:6px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://js.stripe.com/v3/"></script>
<script>
const STRIPE_PUBLISHABLE_KEY = 'pk_live_51TsrEPPAxQObgqV7mjxJ31V5JNhBanKcQK3mtnvWU8wnnCMrbXd9SlkpveW3jJPZFVjoqnlRuRZwppqYhhCkZkfv00kbDv2p2k';
const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
const elements = stripe.elements();
const cardElement = elements.create('card', {
  style: { base: { fontSize: '14.5px', fontFamily: 'Inter, sans-serif', color: '#111111' } }
});
let cardMounted = false;
let cardComplete = false;
let cardErrorMsg = '';
function isCurrentEmailBlocked(){
  return clientForm.checkedEmail === clientForm.email && !!clientForm.blocked;
}
function updateConfirmButtonState(){
  const btn = document.getElementById('confirmBtn');
  if(!btn) return;
  btn.disabled = !(clientForm.name && clientForm.email && clientForm.phone && cardComplete) || submitting || isCurrentEmailBlocked();
}
cardElement.on('change', (e)=>{
  cardComplete = e.complete;
  cardErrorMsg = e.error ? e.error.message : '';
  const errEl = document.getElementById('card-error');
  if(errEl) errEl.textContent = cardErrorMsg;
  updateConfirmButtonState();
});

let state = { bookings: [], clients: [], overrides: [], settings: { meetLink: '', location: '', durationOptions: [60], intakeQuestions: [
  "What's your name and what do you do?",
  "What's the main challenge or decision you're facing right now?",
  "What does success look like if this session goes well?",
  "How did you hear about Catalyst Consulting?",
  "What's your current role or business?",
  "Is this a personal, business, or career-related topic?",
  "Have you worked with a coach or consultant on this before?",
  "What's the timeline or urgency around this?",
  "Anything you'd rather I know going in that's hard to say out loud?",
  "Anything else I should know before we talk?"
] }, availability: {
  virtual: [
    { id:'r1', days:[1,2,3,4], start:'11:00', end:'13:00' },
    { id:'r2', days:[5], start:'10:30', end:'12:30' },
    { id:'r3', days:[0], start:'10:30', end:'11:30' }
  ],
  'in-person': [
    { id:'r4', days:[1,2,3,4], start:'11:00', end:'13:00' }
  ]
} };
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function timeToMin(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function pad2(n){ return String(n).padStart(2,'0'); }
function dateStr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
let adminToken = (typeof sessionStorage !== 'undefined' && sessionStorage.getItem('heshyAdminToken')) || '';
let adminUnlocked = !!adminToken;
let view = (() => {
  const h = location.hash.replace(/[^a-z]/gi, '');
  if(h.includes('manage')) return 'admin';
  if(h.includes('portal')) return 'portal';
  return 'client';
})();
let bookingStep = 1;
let selectedDuration = 60;
let selectedStartTime = null;
let selectedDay = null;
let selectedType = 'virtual';
let clientForm = { name:'', email:'', phone:'', intakeAnswers:[], wgPdfName:'', wgPdfData:'', checkedEmail:'', isNew:false, blocked:false, couponCode:'' };
let confirmedMeetLink = '';
let confirmedLocation = '';
let confirmedComped = false;
let submitting = false;
let portalEmail = '';
let portalPhone = '';
let portalClient = null;
let portalError = '';
let portalToken = (typeof localStorage !== 'undefined' && localStorage.getItem('heshyPortalToken')) || '';
let portalShowCardForm = false;
let portalCardError = '';
let portalCardSaving = false;
let expandedClientId = null;
let viewingClientId = null;
let clientSearch = '';

      adminUnlocked = false; adminToken = '';
      sessionStorage.removeItem('heshyAdminToken');
      return;
    }
    const data = await r.json();
    state = data;
    if(!state.settings) state.settings = { meetLink:'', location:'', intakeQuestions:[], durationOptions:[60] };

function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}
function fmtTime(t){
  const [h,m] = (t||'').split(':').map(Number);
  if(isNaN(h) || isNaN(m)) return t ? '(invalid time: ' + t + ')' : '(no time set)';
  const ampm = h>=12?'PM':'AM';
  const h12 = h%12===0?12:h%12;
  return h12+':'+String(m).padStart(2,'0')+' '+ampm;
}

let calendarConnected = false;
function slotOverlapsBusy(slot){
  const slotStart = new Date(slot.date+'T'+slot.time+':00');
  const slotEnd = new Date(slotStart.getTime() + slot.duration*60000);
  return calendarBusy.some(b=>{
    const bStart = new Date(b.start), bEnd = new Date(b.end);
    return slotStart < bEnd && slotEnd > bStart;
  });
}
async function loadCalendarBusy(){
  try{

    const later = new Date(); later.setDate(later.getDate()+60);
    const r = await fetch('/api/free-busy?timeMin='+today.toISOString()+'&timeMax='+later.toISOString());
    const data = await r.json();
    calendarConnected = !!data.connected;
    calendarBusy = data.busy || [];
  }catch(e){ calendarConnected = false; calendarBusy = []; }
}
function isFutureSlot(s){
  const now = new Date();
  const nowDs = dateStr(now);
  if(s.date > nowDs) return true;
  if(s.date < nowDs) return false;
  const nowTime = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  return s.time > nowTime;
}
function timeToMinC(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTimeC(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function dowOf(ds){ const [y,mo,d]=ds.split('-').map(Number); return new Date(y,mo-1,d).getDay(); }

// Free [startMin,endMin] ranges for a date+type: open windows (recurring weekly rules + one-off
// overrides for that exact date), minus already-booked times of the same type, minus real Google
// Calendar busy time. Two clients can book into the same window as long as their times don't overlap.
function computeFreeRanges(ds, type){
  const weekday = dowOf(ds);
  const windows = [];
  const isBlocked = (state.blockedDates||[]).some(bl=>bl.date===ds && bl.type===type);
  if(!isBlocked){
    (state.availability[type]||[]).filter(r=>r.days.includes(weekday)).forEach(r=>windows.push([timeToMinC(r.start), timeToMinC(r.end)]));
  }
  (state.overrides||[]).filter(o=>o.date===ds && o.type===type).forEach(o=>windows.push([timeToMinC(o.start), timeToMinC(o.end)]));
  if(windows.length===0) return [];
  windows.sort((a,b)=>a[0]-b[0]);
  const merged = [windows[0].slice()];
  for(let i=1;i<windows.length;i++){
    const last = merged[merged.length-1];
    if(windows[i][0] <= last[1]) last[1] = Math.max(last[1], windows[i][1]);
    else merged.push(windows[i].slice());
  }
  const busy = (state.bookings||[]).filter(b=>b.date===ds && b.type===type && !b.cancelled).map(b=>{
    const s = timeToMinC(b.time); return [s, s+(b.durationMin||60)];
  });
  calendarBusy.forEach(b=>{
    const bs = new Date(b.start), be = new Date(b.end);
    const dayStart = new Date(ds+'T00:00:00'), dayEnd = new Date(ds+'T23:59:59');
    if(be <= dayStart || bs >= dayEnd) return;
    busy.push([Math.max(0, Math.round((bs - dayStart)/60000)), Math.min(24*60, Math.round((be - dayStart)/60000))]);
  });
  let free = merged;
  busy.forEach(([bs,be])=>{
    const next = [];
    free.forEach(([fs,fe])=>{
      if(be<=fs || bs>=fe){ next.push([fs,fe]); return; }
      if(bs>fs) next.push([fs,bs]);
      if(be<fe) next.push([be,fe]);
    });
    free = next;
  });
  return free.filter(([s,e])=>e>s);
}
// Valid start times (15-min granularity) for a chosen duration on a given date, excluding past times.
function computeStartTimes(ds, type, durationMin){
  const ranges = computeFreeRanges(ds, type);
  const times = [];
  ranges.forEach(([s,e])=>{
    let cursor = s;
    while(cursor + durationMin <= e){
      const t = minToTimeC(cursor);
      if(isFutureSlot({date:ds, time:t})) times.push(t);
      cursor += durationMin;
    }
  });
  return times;
}
// Resolves which location applies for a given date+type: a one-off override for that exact date
// takes priority over the matching recurring weekly rule, so e.g. Mon-Thu can be one office and
// Friday another.
function resolveLocation(ds, type){
  if(type!=='in-person') return null;
  const override = (state.overrides||[]).find(o=>o.date===ds && o.type===type && (o.generalArea||o.address));
  if(override) return { generalArea: override.generalArea||'', address: override.address||'' };
  const weekday = dowOf(ds);
  const rule = (state.availability[type]||[]).find(r=>r.days.includes(weekday) && (r.generalArea||r.address));
  if(rule) return { generalArea: rule.generalArea||'', address: rule.address||'' };
  return { generalArea: '', address: state.settings.location||'' };
}

async function confirmBooking(){
  if(!clientForm.name || !clientForm.email || !clientForm.phone || !cardComplete || submitting) return;
  if(isCurrentEmailBlocked()) return;
  if(clientForm.isNew && !clientForm.wgPdfData){
    const proceed = confirm("You haven't attached your Working Genius results yet. It's not required, but it helps a lot before your first session.\n\nContinue booking without it?");
    if(!proceed) return;
  }
  submitting = true;
  const btn = document.getElementById('confirmBtn');
  const backBtn = document.getElementById('backTo1');
  if(btn){ btn.disabled = true; btn.textContent = 'Booking…'; }
  if(backBtn) backBtn.disabled = true;

  try{
    const setupRes = await fetch('/api/create-setup-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: clientForm.name, email: clientForm.email, phone: clientForm.phone })
    });
    const setupData = await setupRes.json();
    if(setupData.error){ throw new Error(setupData.error); }

    const result = await stripe.confirmCardSetup(setupData.clientSecret, {
      payment_method: {
        card: cardElement,
        billing_details: { name: clientForm.name, email: clientForm.email, phone: clientForm.phone }
      }
    });
    if(result.error){ throw new Error(result.error.message); }

    const bookingRes = await fetch('/api/create-booking', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        date: selectedDay, time: selectedStartTime, durationMin: selectedDuration, type: selectedType,
        name: clientForm.name, email: clientForm.email, phone: clientForm.phone,
        intakeAnswers: clientForm.intakeAnswers, wgPdfName: clientForm.wgPdfName, wgPdfData: clientForm.wgPdfData,
        stripeCustomerId: setupData.customerId, couponCode: clientForm.couponCode
      })
    });
    const bookingData = await bookingRes.json();
    if(bookingData.error){ throw new Error(bookingData.error); }
    if(bookingData.meetLink) confirmedMeetLink = bookingData.meetLink;
    if(bookingData.location) confirmedLocation = bookingData.location;
    confirmedComped = !!bookingData.comped;

    submitting = false;
    bookingStep = 3; render();
  }catch(err){
    submitting = false;
    cardErrorMsg = err.message || 'Something went wrong. Please try again.';
    const errEl = document.getElementById('card-error'); if(errEl) errEl.textContent = cardErrorMsg;
    const btn = document.getElementById('confirmBtn'); if(btn){ btn.textContent = 'Book session'; updateConfirmButtonState(); }
    const backBtn = document.getElementById('backTo1'); if(backBtn) backBtn.disabled = false;
  }
}

// --- Session recording (in-person: mic only; virtual: mic + tab audio mixed) ---
// Chunks upload every 60s so a single request never gets large, regardless of session length.
let activeRecordings = {}; // bookingId -> { recorder, chunkIndex, audioContext, stream }
let recordingStatus = {}; // bookingId -> 'recording' | 'processing' | 'done' | 'error'
let recordingSegmentStart = {}; // bookingId -> ISO timestamp of when the current segment started

function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function uploadRecordingChunk(bookingId, chunkIndex, blob, mimeType){
  try{
    const base64 = await blobToBase64(blob);
    await fetch('/api/admin-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
      body: JSON.stringify({ action: 'upload-recording-chunk', bookingId, chunkIndex, chunkBase64: base64, mimeType })
    });
  }catch(e){ console.error('chunk upload failed', e); }
}

let recordingError = {}; // bookingId -> human-readable reason, shown when status is 'error'

function pickSupportedMimeType(){
  const candidates = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4',
    'audio/mp4;codecs=mp4a.40.2',
    'audio/ogg;codecs=opus'
  ];
  for(const c of candidates){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return null; // let the browser pick its own default rather than force an unsupported one
}

async function startRecording(bookingId, type){
  try{
    if(!window.MediaRecorder){
      recordingError[bookingId] = 'This browser doesn\u2019t support recording.';
      recordingStatus[bookingId] = 'error'; render(); return;
    }
    const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    let finalStream = micStream;
    let audioContext = null;

    if(type === 'virtual'){
      // Capture the shared tab's audio (the other participant's voice) and mix it with the mic
      // (your own voice), since a tab's own audio output normally excludes your outgoing mic audio.
      try{
        const tabStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        const tabAudioTracks = tabStream.getAudioTracks();
        if(tabAudioTracks.length > 0){
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const dest = audioContext.createMediaStreamDestination();
          audioContext.createMediaStreamSource(micStream).connect(dest);
          audioContext.createMediaStreamSource(new MediaStream(tabAudioTracks)).connect(dest);
          finalStream = dest.stream;
        }
        tabStream.getVideoTracks().forEach(t=>t.stop()); // never need the video itself
      }catch(e){
        console.error('tab audio capture declined or failed, recording mic only', e);
      }
    }

    const mimeType = pickSupportedMimeType();
    const recorder = mimeType
      ? new MediaRecorder(finalStream, { mimeType, audioBitsPerSecond: 24000 })
      : new MediaRecorder(finalStream);
    let chunkIndex = 0;
    recorder.ondataavailable = (e)=>{
      if(e.data && e.data.size > 0){
        uploadRecordingChunk(bookingId, chunkIndex, e.data, recorder.mimeType);
        chunkIndex++;
      }
    };
    recorder.start(60000); // one chunk per minute
    activeRecordings[bookingId] = { recorder, stream: finalStream, micStream, audioContext };
    recordingSegmentStart[bookingId] = new Date().toISOString();
    delete recordingError[bookingId];
    recordingStatus[bookingId] = 'recording';
  }catch(e){
    console.error('could not start recording', e);
    recordingError[bookingId] = e.name === 'NotAllowedError' ? 'Microphone access was blocked \u2014 check your browser permissions.' : (e.message || 'Unknown error starting the recorder.');
    recordingStatus[bookingId] = 'error';
  }
  render();
}

async function stopRecording(bookingId){
  const rec = activeRecordings[bookingId];
  if(!rec) return;
  const segmentStart = recordingSegmentStart[bookingId] || new Date().toISOString();
  const segmentEnd = new Date().toISOString();
  rec.recorder.stop();
  rec.stream.getTracks().forEach(t=>t.stop());
  if(rec.micStream) rec.micStream.getTracks().forEach(t=>t.stop());
  if(rec.audioContext) rec.audioContext.close();
  delete activeRecordings[bookingId];
  delete recordingSegmentStart[bookingId];
  // Give the final ondataavailable chunk a moment to fire and upload before finalizing.
  recordingStatus[bookingId] = 'processing';
  render();
  await new Promise(r=>setTimeout(r, 1500));
  try{
    const res = await fetch('/api/admin-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
      body: JSON.stringify({ action: 'finalize-recording', bookingId, segmentStart, segmentEnd })
    });
    const data = await res.json();
    if(data.error){
      recordingStatus[bookingId] = 'error';
      recordingError[bookingId] = data.error;
      console.error('finalize recording failed', data.error);
    } else {
      recordingStatus[bookingId] = 'done';
      await loadAdminState();
    }
  }catch(e){
    recordingStatus[bookingId] = 'error';
    recordingError[bookingId] = e.message || 'Could not reach the server to process the recording.';
    console.error('finalize recording failed', e);
  }
  render();
}

function startTimer(id){
  if(runningTimer[id]) return;
  if(timerDisplay[id] === undefined){
    // First start after a page load — pick up where the last saved duration left off,
    // so a break that includes closing/reloading the page doesn't lose earlier time.
    const b = state.bookings.find(x=>x.id===id);
    timerDisplay[id] = (b && b.actualMinutes) ? b.actualMinutes * 60 : 0;
  }
  runningTimer[id] = setInterval(()=>{ timerDisplay[id]++; renderTimerOnly(id); }, 1000);
  render();
}
function stopTimer(id){
  clearInterval(runningTimer[id]); delete runningTimer[id];
  const mins = Math.max(1, Math.round((timerDisplay[id]||0)/60));
  updateBooking(id, { actualMinutes: mins });
}
function renderTimerOnly(id){
  const el = document.getElementById('timer-'+id);
  if(el){
    const s = timerDisplay[id]||0;
    el.textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  }
}
async function chargeAndReceipt(id){
  const btn = document.querySelector(`[data-charge="${id}"]`);
  const amountInput = document.querySelector(`[data-amount="${id}"]`);
  const hoursInput = document.querySelector(`[data-actual-hours="${id}"]`);
  const overrideAmount = amountInput ? parseFloat(amountInput.value) : null;
  const overrideHours = hoursInput ? parseFloat(hoursInput.value) : null;
  const overrideMinutes = (overrideHours!=null && !isNaN(overrideHours)) ? Math.round(overrideHours*60) : null;
  if(btn){ btn.disabled = true; btn.textContent = 'Charging…'; }
  try{
    const res = await fetch('/api/charge-booking', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
      body: JSON.stringify({
        bookingId: id,
        amount: (overrideAmount!=null && !isNaN(overrideAmount)) ? overrideAmount : undefined,
        actualMinutes: (overrideMinutes!=null && !isNaN(overrideMinutes)) ? overrideMinutes : undefined
      })
    });
    const data = await res.json();
    if(data.error){ alert('Charge failed: ' + data.error); if(btn){ btn.disabled=false; } return; }
    await loadAdminState();
    render();
  }catch(e){
    alert('Charge failed: ' + e.message);
    if(btn){ btn.disabled = false; }
  }
}
async function skipCharge(id){
  if(!confirm('Mark this session complete without charging the card?')) return;
  await updateBooking(id, { status:'charged', amount:0 });
}
async function markComplete(id){ await updateBooking(id, { status:'completed' }); }
async function cancelBooking(id){
  if(!confirm('Cancel this booking? This frees up the time slot and cannot be undone.')) return;
  try{
    const res = await fetch('/api/admin-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
      body: JSON.stringify({ action: 'cancel-booking', bookingId: id })
    });
    const data = await res.json();
    if(data.error){ alert('Cancel failed: ' + data.error); return; }
    if(data.warning){ alert(data.warning); }
    await loadAdminState();
    render();
  }catch(e){
    alert('Cancel failed: ' + e.message);
  }
}

async function checkPortal(){
  if(!portalPhone.trim()){ portalError = 'Enter your phone number too — needed to keep your info private.'; render(); return; }
  try{
    const r = await fetch('/api/portal-lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', email: portalEmail, phone: portalPhone })
    });
    const data = await r.json();
    if(data.error){ portalError = data.error; portalClient = null; render(); return; }
    if(!data.found){ portalError = "We couldn't find a match for that email and phone number."; portalClient = null; render(); return; }
    portalError = ''; portalClient = data;
    if(data.token){ portalToken = data.token; try{ localStorage.setItem('heshyPortalToken', data.token); }catch(e){} }
    render();
  }catch(e){
    portalError = "Something went wrong. Try again."; render();
  }
}
async function resumePortalSession(){
  if(!portalToken) return;
  try{
    const r = await fetch('/api/portal-lookup?action=session&token='+encodeURIComponent(portalToken));
    const data = await r.json();
    if(data.found){ portalClient = data; portalEmail = data.email || ''; render(); }
    else { portalToken = ''; try{ localStorage.removeItem('heshyPortalToken'); }catch(e){} }
  }catch(e){ /* if this fails, they just see the normal login form */ }
}

    recurringHtml = `
      <div class="row">
        <div><div class="main" style="color:var(--muted);">Not available this day</div><div class="sub">Your usual ${fmtTimeShort(recurring[0].start)}&ndash;${fmtTimeShort(recurring[0].end)} pattern is blocked just for ${fmtDate(ds)}</div></div>
        <button class="ghost small" data-unblock-date="${ds}">Undo</button>
      </div>`;
  }
  let overrideHtml = dayOverrides.length===0 ? '' : dayOverrides.map(o=>`
    <div class="row">
      <div><div class="main">${fmtTimeShort(o.start)} &ndash; ${fmtTimeShort(o.end)}</div><div class="sub">One-off, this date only${o.generalArea?' &middot; '+o.generalArea:''}</div></div>
      <button class="ghost small" data-remove-override="${o.id}">Remove</button>
    </div>`).join('');
  return `
    <div class="day-detail">
      <div class="day-detail-header">${fmtDate(ds)}</div>
      ${isHoliday ? `<div class="note">${jewishHolidayNames[ds]||'Jewish holiday'} &mdash; stays unavailable regardless of windows added here.</div>` : ''}
      ${recurringHtml || overrideHtml ? '' : `<div class="empty">No availability defined for this day.</div>`}
      ${recurringHtml}
      ${overrideHtml}
      ${!isHoliday ? `
      <div class="row2" style="margin-top:14px;">
        <div><label>Add one-off availability</label><input type="time" id="overrideStart" value="${overrideStart}" placeholder="Start"></div>
        <div><label>&nbsp;</label><input type="time" id="overrideEnd" value="${overrideEnd}" placeholder="End"></div>
      </div>
      ${adminType==='in-person' ? `
      <div style="margin-top:10px;"><label>General area <span class="note" style="display:inline;">(shown to clients before they book)</span></label><input type="text" id="overrideArea" value="${overrideArea}" placeholder="e.g. Boro Park"></div>
      <div style="margin-top:10px;"><label>Full address &amp; instructions <span class="note" style="display:inline;">(sent after booking)</span></label><textarea id="overrideAddress" placeholder="Address, parking, floor, buzzer code, etc.">${overrideAddress}</textarea></div>
      ` : ''}
      <div class="note" style="margin-top:6px;">Just for this date &mdash; doesn't change your regular weekly pattern.</div>
      <div style="margin-top:12px;"><button class="primary small" id="addOverrideBtn">Add for this date</button></div>
      ` : ''}
    </div>
  `;
}

function renderAdmin(){
  const todayDs = (()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();
  let rulesHtml = (state.availability[adminType]||[]).length===0 ? `<div class="empty">No weekly pattern set.</div>` : '';
  (state.availability[adminType]||[]).forEach(r=>{
    rulesHtml += `
      <div class="row">
        <div><div class="main">${daysLabel(r.days)}</div><div class="sub">${fmtTimeShort(r.start)} &ndash; ${fmtTimeShort(r.end)}${r.generalArea?' &middot; '+r.generalArea:''}</div></div>
        <button class="ghost small" data-remove-rule="${r.id}">Remove</button>
      </div>`;
  });
  const upcomingOverrides = (state.overrides||[]).filter(o=>o.type===adminType && o.date>=todayDs).sort((a,b)=>a.date.localeCompare(b.date));
  let overridesListHtml = upcomingOverrides.length===0 ? `<div class="empty">No one-off dates added.</div>` : '';
  upcomingOverrides.forEach(o=>{
    overridesListHtml += `
      <div class="row">
        <div><div class="main">${fmtDate(o.date)}</div><div class="sub">${fmtTimeShort(o.start)} &ndash; ${fmtTimeShort(o.end)}</div></div>
        <button class="ghost small" data-remove-override="${o.id}">Remove</button>
      </div>`;
  });

  const clientById = {};
  state.clients.forEach(c=>{ clientById[c.id] = c; });

  function sessionCardHtml(b){
    const running = !!runningTimer[b.id];
    const isRecording = recordingStatus[b.id]==='recording';
    const segments = b.recordingSegments || [];
    const totalSegMin = segments.reduce((sum,s)=>sum+s.minutes,0);
    const fmtClock = iso => new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
    const segmentLogHtml = (b.type==='in-person' && segments.length) ? `
      <div class="note" style="margin-top:2px;margin-bottom:8px;">
        ${segments.map((s,i)=>`Part ${i+1}: ${fmtClock(s.start)}&ndash;${fmtClock(s.end)} (${s.minutes} min)`).join(' &middot; ')}
        ${segments.length>1 ? ` &middot; <strong>Total: ${totalSegMin} min</strong>` : ''}
      </div>
    ` : '';
    const timerBlock = `
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:8px;">
        <span class="timer" id="timer-${b.id}">${String(Math.floor((timerDisplay[b.id]||0)/60)).padStart(2,'0')}:${String((timerDisplay[b.id]||0)%60).padStart(2,'0')}</span>
        ${running ? `<button class="ghost small" data-stop-timer="${b.id}">Stop</button>` : `<button class="${b.type==='in-person'?'primary':'ghost'} small" data-start-timer="${b.id}">Start</button>`}
        <span class="note" style="margin:0;">${b.type==='in-person' ? 'Tracks time & records using your mic' : 'Tracks time only'}</span>
        ${b.type==='in-person' && isRecording ? `<span class="rec-indicator" title="Recording"><span class="rec-dot"></span>REC</span>` : ''}
      </div>
      ${segmentLogHtml}
      ${b.type==='in-person' && recordingStatus[b.id] ? `<div class="note" style="margin-bottom:8px;color:${recordingStatus[b.id]==='error'?'#A5433A':(recordingStatus[b.id]==='done'?'#2E5B27':'var(--muted)')};">${
        recordingStatus[b.id]==='recording' ? 'Recording…' :
        recordingStatus[b.id]==='processing' ? 'Processing notes… this can take a minute for longer sessions.' :
        recordingStatus[b.id]==='done' ? 'Notes ready below.' :
        'Recording failed: ' + (recordingError[b.id] || 'unknown error') + '. You can still add notes manually below.'
      }</div>` : ''}`;
    // Virtual: plain Join Meeting (opens tab + starts timer only — no browser recording, since
    // Gemini (native to Meet, works from any device) is the note-taker for virtual calls.
    const meetBlock = (b.meetLink && b.type==='virtual') ? `
      <label>Google Meet link</label>
      <input type="text" value="${b.meetLink||''}" data-meet="${b.id}">
      ${!running ? `<button class="primary small" data-join-start="${b.id}" style="margin-top:10px;">Join meeting &amp; start timer</button>` : ''}
    ` : '';
    const controls = `
        <div class="session-controls">
          ${!b.cancelled ? timerBlock : ''}
          ${!b.cancelled ? meetBlock : ''}
          ${(!b.cancelled && b.type==='virtual' && (b.calendarEventId || b.meetLink)) ? `<button class="ghost small" data-fetch-gemini="${b.id}" style="margin-bottom:14px;">Fetch notes &amp; duration</button><span id="gemini-msg-${b.id}" style="font-size:12.5px;margin-left:10px;"></span>` : ''}
          <label>Internal notes <span class="note" style="display:inline;">(private &mdash; only you see this)</span></label>
          <textarea class="notes-textarea" data-summary="${b.id}">${b.summary||''}</textarea>
          <label style="margin-top:14px;display:block;">Client-facing summary <span class="note" style="display:inline;">(shown to the client in their portal)</span></label>
          <button class="ghost small" data-copy-to-client="${b.id}" style="margin-bottom:8px;">Copy internal notes here</button>
          <textarea class="notes-textarea" data-clientsummary="${b.id}">${b.clientSummary||''}</textarea>
        </div>
    `;
    let action = '';
    if(b.status!=='charged' && !b.cancelled){
      const actualMins = b.actualMinutes || b.durationMin;
      const basis = billingBasisChoice[b.id] || state.settings.billingMode || 'actual';
      const minsForBilling = basis==='minimum' ? b.durationMin : actualMins;
      const hours = Math.round((minsForBilling/60)*100)/100;
      const defaultAmt = Math.round(hours*500*100)/100;
      const amt = (b.amount!=null) ? b.amount : defaultAmt;
      action = `
        <div class="charge-row">
          <div class="note" style="margin-bottom:8px;">Actual time tracked: <strong>${actualMins} min</strong> &middot; Booked for: <strong>${b.durationMin} min</strong></div>
          <label>Bill for</label>
          <div class="type-toggle" style="margin-bottom:12px;">
            <div class="type-btn ${basis==='actual'?'active':''}" data-billing-basis="${b.id}" data-basis-value="actual">Actual time (${actualMins} min)</div>
            <div class="type-btn ${basis==='minimum'?'active':''}" data-billing-basis="${b.id}" data-basis-value="minimum">Full booked (${b.durationMin} min)</div>
          </div>
          <div class="row2">
            <div><label>Hours to bill</label><input type="text" value="${hours}" data-actual-hours="${b.id}"></div>
            <div><label>Amount to charge</label><input type="text" value="${amt.toFixed(2)}" data-amount="${b.id}"></div>
          </div>
          <div style="margin-top:12px;"><button class="primary small" data-charge="${b.id}">Charge and send receipt</button></div>
          <button class="ghost small danger-ghost" data-skip-charge="${b.id}" style="margin-top:8px;">Mark complete, don't charge</button>
        </div>`;
    }
    const isRescheduling = reschedulingId === b.id;
    const rescheduleBlock = isRescheduling ? `
      <div class="reschedule-form" style="margin-top:10px;padding:12px;border:1px solid var(--line-strong);border-radius:6px;">
        <div class="row2">
          <div><label>New date</label><input type="date" data-reschedule-date="${b.id}" value="${b.date}"></div>
          <div><label>New time</label><input type="time" data-reschedule-time="${b.id}" value="${b.time}"></div>
        </div>
        <label style="margin-top:10px;">Format</label>
        <div class="type-toggle" style="margin-top:4px;">
          <div class="type-btn ${(rescheduleType[b.id]||b.type)==='virtual'?'active':''}" data-reschedule-type="${b.id}" data-type-value="virtual">Online</div>
          <div class="type-btn ${(rescheduleType[b.id]||b.type)==='in-person'?'active':''}" data-reschedule-type="${b.id}" data-type-value="in-person">In person</div>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button class="primary small" data-save-reschedule="${b.id}">Save new time</button>
          <button class="ghost small" data-cancel-reschedule="${b.id}">Cancel</button>
        </div>
      </div>
    ` : '';
    return `
      <div class="session">
        <div class="session-top">
          <div>
            <div class="session-name">${b.clientId?`<a class="client-link" data-view-client="${b.clientId}">${b.clientName}</a>`:b.clientName}</div>
            <div class="session-time-big">${fmtTime(b.time)}</div>
            <div class="session-meta">${fmtDate(b.date)} &middot; ${b.durationMin} min scheduled${b.actualMinutes?', '+b.actualMinutes+' min actual':''}</div>
            <div class="session-format">${b.type==='virtual'?'Video call':'In person'}${b.comped?' &middot; comped ('+b.couponCode+')':''}</div>
          </div>
          <span class="tag status-${b.status}">${b.status}</span>${b.cancelled ? ` <span class="tag status-cancelled">cancelled</span>` : ''}
        </div>
        ${b.cancelled ? `<div class="note" style="margin-top:8px;">Cancelled${b.status==='charged' ? ' \u2014 this session was already charged, so it stays visible to the client and in your records.' : ' \u2014 the time was freed up. Any notes or billing from before cancelling are kept below for your records.'}</div>` : ''}
        ${controls}
        ${action?`<div class="session-actions">${action}</div>`:''}
        ${!b.cancelled ? `
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="ghost small" data-reschedule-toggle="${b.id}">${isRescheduling?'Close':'Reschedule'}</button>
          <button class="ghost small danger-ghost" data-cancel-booking="${b.id}">Cancel booking</button>
        </div>
        ${rescheduleBlock}
        ` : ''}
      </div>`;
  }

  const nav = `
    <div class="admin-nav">
      <button class="admin-nav-btn ${adminView==='dashboard'?'active':''}" data-admin-view="dashboard">Dashboard</button>
      <button class="admin-nav-btn ${adminView==='schedule'?'active':''}" data-admin-view="schedule">Schedule</button>
      <button class="admin-nav-btn ${(adminView==='clients'||adminView==='client-detail')?'active':''}" data-admin-view="clients">Clients</button>
      <button class="admin-nav-btn ${adminView==='settings'?'active':''}" data-admin-view="settings">Settings</button>
    </div>
  `;

  let body = '';

  if(adminView==='dashboard'){
    const todayDs = dateStr(new Date());
    if(!selectedDashboardDate) selectedDashboardDate = todayDs;
    const weekAheadDs = dateStr(new Date(Date.now() + 7*86400000));

    const todayBookings = state.bookings.filter(b=>b.date===todayDs && !b.cancelled).sort((a,b)=>a.time.localeCompare(b.time));
    const upcomingBookings = state.bookings.filter(b=>b.date>=todayDs && !b.cancelled).sort((a,b)=> a.date===b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date));
    const thisWeekBookings = state.bookings.filter(b=>b.date>=todayDs && b.date<=weekAheadDs && !b.cancelled).sort((a,b)=> a.date===b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date));
    const unbilledBookings = state.bookings.filter(b=>b.date<todayDs && b.status==='scheduled').sort((a,b)=> a.date===b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date));

    if(!dashboardStatFilter) dashboardStatFilter = 'today';

    const statsHtml = `
      <div class="dash-stats">
        <div class="dash-stat ${dashboardStatFilter==='today'?'dash-stat-active':''}" data-dash-filter="today">
          <div class="dash-stat-num">${todayBookings.length}</div>
          <div class="dash-stat-label">Today</div>
        </div>
        <div class="dash-stat ${dashboardStatFilter==='week'?'dash-stat-active':''}" data-dash-filter="week">
          <div class="dash-stat-num">${thisWeekBookings.length}</div>
          <div class="dash-stat-label">Next 7 days</div>
        </div>
        <div class="dash-stat ${unbilledBookings.length ? 'dash-stat-alert' : ''} ${dashboardStatFilter==='billing'?'dash-stat-active':''}" data-dash-filter="billing">
          <div class="dash-stat-num">${unbilledBookings.length}</div>
          <div class="dash-stat-label">Needs billing</div>
        </div>
        <div class="dash-stat ${dashboardStatFilter==='upcoming'?'dash-stat-active':''}" data-dash-filter="upcoming">
          <div class="dash-stat-num">${upcomingBookings.length}</div>
          <div class="dash-stat-label">Upcoming total</div>
        </div>
      </div>
    `;

    const filterMeta = {
      today:    { title: 'Today',          caption: '', list: todayBookings },
      week:     { title: 'Next 7 days',    caption: '', list: thisWeekBookings },
      billing:  { title: 'Needs billing',  caption: 'Sessions whose date has already passed, that you haven\u2019t charged or marked complete yet. Charging or comping a session removes it from this list.', list: unbilledBookings },
      upcoming: { title: 'Upcoming total', caption: 'Every session booked from today onward.', list: upcomingBookings }
    };
    const active = filterMeta[dashboardStatFilter];
    const filteredListHtml = active.list.length===0
      ? `<div class="empty">Nothing here.</div>`
      : active.list.map(b=>sessionCardHtml(b)).join('');

    const todayOnlyBookings = state.bookings.filter(b=>b.date===todayDs).sort((a,b)=>a.time.localeCompare(b.time));
    const todayOnlyHtml = todayOnlyBookings.length===0 ? `<div class="empty">No sessions today.</div>` : todayOnlyBookings.map(b=>sessionCardHtml(b)).join('');
    const fixedTodayBlock = `
      <div class="admin-block">
        <h2 class="sect">Today</h2>
        ${todayOnlyHtml}
      </div>
    `;

    const dayBookings = state.bookings.filter(b=>b.date===selectedDashboardDate).sort((a,b)=>a.time.localeCompare(b.time));
    let dayHtml = dayBookings.length===0 ? `<div class="empty">No sessions on this day.</div>` : '';
    dayBookings.forEach(b=>{
      dayHtml += sessionCardHtml(b);
    });
    const isSelectedToday = selectedDashboardDate === todayDs;
    const calendarBlock = `
      <div class="admin-block">
        <h2 class="sect">Calendar</h2>
        ${renderDashboardCalendar()}
      </div>
      <div class="admin-block">
        <h2 class="sect">${isSelectedToday ? 'Today' : fmtDate(selectedDashboardDate)}</h2>
        ${dayHtml}
      </div>
    `;
    const filteredBlock = `
      <div class="admin-block">
        <h2 class="sect">${active.title}</h2>
        ${active.caption ? `<div class="note" style="margin-bottom:16px;">${active.caption}</div>` : ''}
        ${filteredListHtml}
      </div>
    `;
    body = `
      <div class="admin-block">
        <h2 class="sect">Dashboard</h2>
        ${statsHtml}
      </div>
      ${dashboardStatFilter !== 'today' ? filteredBlock : ''}
      ${fixedTodayBlock}
      ${calendarBlock}
    `;
  }

  if(adminView==='schedule'){
    body = `
      <div class="admin-block">
        <h2 class="sect">Schedule</h2>
        <div class="type-toggle">
          <div class="type-btn ${adminType==='virtual'?'active':''}" data-admin-type="virtual">Online</div>
          <div class="type-btn ${adminType==='in-person'?'active':''}" data-admin-type="in-person">In person</div>
        </div>

        <div style="margin-top:24px;">
          ${renderScheduleCalendar()}
        </div>
        ${renderDayDetail()}

        <button class="ghost small" id="toggleScheduleEditor" style="margin-top:24px;">${showScheduleEditor?'Hide weekly pattern':'Edit weekly pattern'}</button>

        ${showScheduleEditor ? `
        <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--line);">
          <div class="section-title">Weekly pattern</div>
          <p class="note" style="margin:0 0 14px;">Open windows that repeat every week. Clients pick their own session length within whatever's open \u2014 set the session lengths you offer in Settings.</p>
          ${rulesHtml}
          <div class="day-toggle-row" style="margin-top:14px;">
            ${DOW.map((d,i)=>`<div class="day-toggle ${newRule.days.includes(i)?'active':''}" data-rule-day="${i}">${d[0]}</div>`).join('')}
          </div>
          <div class="row2" style="margin-top:12px;">
            <div><label>Start time</label><input type="time" id="nr-start" value="${newRule.start}"></div>
            <div><label>End time</label><input type="time" id="nr-end" value="${newRule.end}"></div>
          </div>
          ${adminType==='in-person' ? `
          <div style="margin-top:10px;"><label>General area <span class="note" style="display:inline;">(shown to clients before they book)</span></label><input type="text" id="nr-area" value="${newRule.generalArea}" placeholder="e.g. Boro Park"></div>
          <div style="margin-top:10px;"><label>Full address &amp; instructions <span class="note" style="display:inline;">(sent after booking)</span></label><textarea id="nr-address" placeholder="Address, parking, floor, buzzer code, etc.">${newRule.address}</textarea></div>
          ` : ''}
          <div style="margin-top:14px;"><button class="ghost small" id="addRuleBtn" ${(newRule.days.length && newRule.start && newRule.end) ? '' : 'disabled'}>Add pattern</button>${!newRule.days.length ? '<span class="note" style="margin-left:10px;">Pick at least one day above first</span>' : (!newRule.start || !newRule.end ? '<span class="note" style="margin-left:10px;">Set a start and end time</span>' : '')}</div>
        </div>
        <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--line);">
          <div class="section-title">Upcoming one-off dates</div>
          <p class="note" style="margin:0 0 14px;">Extra availability added for a specific date only. Click a date on the calendar above to add one.</p>
          ${overridesListHtml}
        </div>
        ` : ''}
      </div>
    `;
  }

  if(adminView==='clients'){
    const search = clientSearch.trim().toLowerCase();
    const clientsWithMeta = state.clients.map(c=>{
      const clientBookings = state.bookings.filter(b=>b.clientId===c.id);
      const sessionCount = clientBookings.length;
      const lastBooking = clientBookings.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))[0];
      return { c, sessionCount, lastDate: lastBooking ? lastBooking.date : null };
    }).filter(({c})=> !search || c.name.toLowerCase().includes(search) || (c.email||'').toLowerCase().includes(search));
    clientsWithMeta.sort((a,b)=>{
      const aKey = a.lastDate || '0';
      const bKey = b.lastDate || '0';
      if(aKey !== bKey) return bKey.localeCompare(aKey);
      return b.c.createdAt - a.c.createdAt;
    });

    let clientsHtml = clientsWithMeta.length===0 ? `<div class="empty">${search ? 'No clients match that search.' : 'No client profiles yet.'}</div>` : '';
    clientsWithMeta.forEach(({c, sessionCount, lastDate})=>{
      clientsHtml += `
        <div class="client-row" data-view-client-profile="${c.id}">
          <div>
            <div class="main">${c.name}${c.wgLetters ? ` <span class="wg-badge" title="Working Genius">${c.wgLetters.toUpperCase()}</span>` : (c.wgPdfData ? ' <span class="wg-badge" title="Working Genius PDF on file">WG</span>' : '')}</div>
            <div class="sub">${c.email} &middot; ${sessionCount} session${sessionCount!==1?'s':''}${lastDate ? ' &middot; last met ' + fmtDate(lastDate) : ''}</div>
          </div>
          ${c.blocked ? `<span class="tag blocked">blocked</span>` : ''}
        </div>`;
    });
    body = `
      <div class="admin-block">
        <h2 class="sect">Clients</h2>
        <input type="text" id="client-search" placeholder="Search by name or email" value="${clientSearch}" style="margin-bottom:16px;">
        ${clientsHtml}
      </div>
    `;
  }

  if(adminView==='client-detail'){
    const c = state.clients.find(x=>x.id===viewingClientId);
    if(!c){
      body = `<div class="admin-block"><button class="ghost small" data-back-to-clients="1">&larr; Back to clients</button><div class="empty" style="margin-top:16px;">Client not found.</div></div>`;
    } else {
      const clientBookings = state.bookings.filter(b=>b.clientId===c.id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
      const totalBilled = clientBookings.filter(b=>b.status==='charged').reduce((sum,b)=>sum+(b.amount||0),0);
      const nowDs = dateStr(new Date());
      const nowTimeStr = (()=>{ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); })();
      const pastBookings = clientBookings.filter(b=> b.date < nowDs || (b.date===nowDs && b.time <= nowTimeStr));
      const upcomingBookings = clientBookings.filter(b=> b.date > nowDs || (b.date===nowDs && b.time > nowTimeStr));
      const sessionCount = pastBookings.length;
      const firstBooking = pastBookings.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
      const lastBooking = pastBookings[0];

      let storyLine = '';
      if(sessionCount===0){
        storyLine = upcomingBookings.length
          ? `You haven\u2019t met with ${c.name.split(' ')[0]} yet \u2014 first session is ${fmtDate(upcomingBookings[upcomingBookings.length-1].date)}.`
          : `You haven\u2019t had a session with ${c.name.split(' ')[0]} yet.`;
      } else if(sessionCount===1){
        storyLine = `You\u2019ve met ${c.name.split(' ')[0]} once, on ${fmtDate(firstBooking.date)}.`;
      } else {
        storyLine = `You\u2019ve met with ${c.name.split(' ')[0]} ${sessionCount} times since ${fmtDate(firstBooking.date)}. Your most recent session was ${fmtDate(lastBooking.date)}.`;
      }
      if(upcomingBookings.length) storyLine += ` Next session: ${fmtDate(upcomingBookings[0].date)}.`;
      if(totalBilled>0) storyLine += ` ${money(totalBilled)} billed in total.`;

      const questions = state.settings.intakeQuestions || [];
      let qaHtml = '';
      questions.forEach((q,i)=>{
        if(c.intakeAnswers && c.intakeAnswers[i]){
          qaHtml += `<div class="qa"><div class="q">${q}</div><div>${c.intakeAnswers[i]}</div></div>`;

      });

      const wgLetters = (c.wgLetters||'').toUpperCase();

      body = `
        <div class="admin-block">
          <button class="ghost small" data-back-to-clients="1">&larr; Back to clients</button>

              <div style="font-size:26px;font-weight:600;font-family:Georgia,serif;">${c.name}${wgLetters ? ` <span class="wg-badge-big" title="Working Genius">${wgLetters}</span>` : ''}</div>
              <div class="sub" style="margin-top:4px;">${c.email}${c.phone ? ' &middot; <strong>' + c.phone + '</strong>' : ''}</div>
            </div>

          <div class="note" style="margin-top:16px;font-size:14.5px;line-height:1.6;">${storyLine}</div>
        </div>

        <div class="admin-block">
          <h2 class="sect">My notes</h2>
          <div class="note" style="margin-bottom:8px;">Private &mdash; only you see this. Never shown to the client.</div>
          <textarea id="client-notes-${c.id}" data-client-notes="${c.id}" placeholder="Anything you want to remember about this client&hellip;" style="min-height:100px;">${c.notes||''}</textarea>
          <div id="client-notes-saved-${c.id}" style="font-size:12px;color:var(--muted);margin-top:4px;"></div>
        </div>

        <div class="admin-block">
          <h2 class="sect">Working Genius</h2>
          <label style="font-weight:600;">Letters</label>
          <div class="note" style="margin-bottom:8px;">Type them directly once you know their results, e.g. <strong>WDTIEG</strong>.</div>
          <input type="text" id="client-wg-letters-${c.id}" data-client-wg-letters="${c.id}" value="${wgLetters}" placeholder="e.g. WDTIEG" style="max-width:220px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;">
          <div id="client-wg-letters-saved-${c.id}" style="font-size:12px;color:var(--muted);margin-top:4px;"></div>

          <label style="font-weight:600;margin-top:18px;display:block;">PDF report</label>
          ${c.wgPdfData
            ? `<div style="margin-bottom:8px;"><a class="wg-link" href="${c.wgPdfData}" download="${c.wgPdfName||'working-genius.pdf'}"><strong>${c.wgPdfName||'Download PDF'}</strong></a></div>`
            : `<div class="empty" style="margin-bottom:8px;">Not on file.</div>`}
          <input type="file" id="client-wg-file-${c.id}" data-client-wg-file="${c.id}" accept="application/pdf">
          <div id="client-wg-file-saved-${c.id}" style="font-size:12px;color:var(--muted);margin-top:4px;"></div>
        </div>


        <div class="admin-block">
          <h2 class="sect">Intake answers</h2>
          ${qaHtml || `<div class="empty">No intake answers on file.</div>`}
        </div>

        <div class="admin-block">
          <h2 class="sect">Session history</h2>
          ${sessHtml || `<div class="empty">No sessions yet.</div>`}
        </div>

        <div class="admin-block">
          ${c.blocked
            ? `<button class="ghost small" data-unblock-client="${c.id}">Unblock</button>`
            : `<button class="ghost small danger-ghost" data-block-client="${c.id}">Block from booking</button>`}
        </div>
      `;
    }
  }

  if(adminView==='settings'){
    body = `
      <div class="admin-block">
        <h2 class="sect">Settings</h2>
        <label>Google Calendar</label>
        <div style="display:flex;align-items:center;gap:14px;">
          <span class="tag ${calendarConnected?'status-completed':'status-scheduled'}">${calendarConnected?'connected':'not connected'}</span>
          <a class="wg-link" href="/api/google-auth-url?token=${encodeURIComponent(adminToken)}">${calendarConnected?'Reconnect':'Connect Google Calendar'}</a>
        </div>
        <div class="note">When connected, times that conflict with your personal calendar won't show as bookable, and booked sessions get added to your calendar automatically.</div>
        <label>Session lengths you offer</label>
        <div class="note" style="margin-bottom:8px;">Clients choose from these when booking, within whatever time you have open. 60 min is the standard, pre-selected option.</div>
        <div style="display:flex;gap:18px;">
          <label style="display:flex;align-items:center;gap:6px;font-weight:normal;"><input type="checkbox" id="dur-60" ${(state.settings.durationOptions||[60]).includes(60)?'checked':''}> 60 min</label>
          <label style="display:flex;align-items:center;gap:6px;font-weight:normal;"><input type="checkbox" id="dur-120" ${(state.settings.durationOptions||[60]).includes(120)?'checked':''}> 120 min (extended)</label>
        </div>
        <label>Default billing</label>
        <div class="note" style="margin-bottom:8px;">Actual time tracked is always shown, regardless of this setting \u2014 this only controls what a new charge defaults to. You can always switch it for one session when charging.</div>
        <div class="type-toggle" style="max-width:420px;">
          <div class="type-btn ${(state.settings.billingMode||'actual')==='actual'?'active':''}" id="billing-mode-actual">Actual time</div>
          <div class="type-btn ${state.settings.billingMode==='minimum'?'active':''}" id="billing-mode-minimum">Full booked length</div>
        </div>
        <label>Backup video call link</label>
        <div class="note" style="margin-bottom:8px;">Every booking gets its own unique Meet link automatically when Google Calendar is connected \u2014 this field is only used as a fallback for the rare case a booking happens while Calendar is disconnected.</div>
        <input type="text" id="set-meet" placeholder="https://meet.google.com/xxx-xxxx-xxx" value="${state.settings.meetLink}">
        <label>Default in-person location <span class="note" style="display:inline;">(fallback only)</span></label>
        <div class="note" style="margin-bottom:8px;">Set the actual location per day in Schedule \u2014 Mon-Thu can be a different address than Friday, for example. This is only used if a day's own location isn't set.</div>
        <textarea id="set-location" placeholder="Address, parking, floor, buzzer code, etc.">${state.settings.location}</textarea>
        <label>Intake questions (one per line, asked only on a client's first booking)</label>
        <textarea id="set-intake" style="min-height:140px;">${(state.settings.intakeQuestions||[]).join('\n')}</textarea>
        <div class="note">Sent automatically on every confirmation, based on which format the client picked.</div>
        <div style="margin-top:16px;">
          <button class="primary small" id="save-settings-btn">Save settings</button>
          <span id="settings-save-msg" style="font-size:13px;margin-left:12px;"></span>
        </div>
      </div>

      <div class="admin-block">
        <h2 class="sect">Coupon codes</h2>
        <p class="note" style="margin:0 0 14px;">A client can enter a code at booking to make that one session free. The card is still saved for no-show protection, but you won't be charged for it unless you choose to.</p>
        ${(state.settings.coupons||[]).length===0 ? `<div class="empty">No coupon codes yet.</div>` : ''}
        ${(state.settings.coupons||[]).map(c=>`
          <div class="row">
            <div><div class="main">${c.code}</div><div class="sub">${c.description||'No description'} &middot; ${c.maxUses ? (c.usedCount||0)+' of '+c.maxUses+' used' : 'Unlimited uses'}${c.usedCount>0?' &middot; used '+(c.usedCount||0)+' time'+(c.usedCount===1?'':'s'):''}</div></div>
            <button class="ghost small danger-ghost" data-remove-coupon="${c.code}">Remove</button>
          </div>
        `).join('')}
        <div class="admin-grid" style="margin-top:16px;">
          <div><label>Code</label><input type="text" id="coupon-code" placeholder="FRIEND2026" value="${newCoupon.code}"></div>
          <div><label>Description (optional)</label><input type="text" id="coupon-desc" placeholder="For referrals" value="${newCoupon.description}"></div>
          <div><label>Max uses</label><input type="text" id="coupon-max" placeholder="Blank = unlimited" value="${newCoupon.maxUses}"></div>
        </div>
        <div style="margin-top:14px;"><button class="ghost small" id="addCouponBtn">Add coupon</button></div>
      </div>
    `;
  }

  return `
    <div class="topbar"><div class="brand">Heshy — Manage</div><button class="manage-link" id="backToClientBtn">Back to booking</button></div>
    ${nav}
    ${body}
  `;
}

function mountCardElementIfNeeded(){
  const mount = document.getElementById('card-element');
  if(!mount || bookingStep !== 2) return;
  if(mount.childElementCount === 0){
    cardElement.mount('#card-element');
  }
  const errEl = document.getElementById('card-error');
  if(errEl) errEl.textContent = cardErrorMsg;
}

// Portal card update uses its own separate Elements group/card field (independent from the
// booking flow's), since they're mounted at different times into different DOM nodes.
let portalElements = null;
let portalCardElement = null;
function mountPortalCardElementIfNeeded(){
  const mount = document.getElementById('portal-card-element');
  if(!mount || !portalShowCardForm) return;
  if(mount.childElementCount === 0){
    portalElements = stripe.elements();
    portalCardElement = portalElements.create('card', { style: { base: { fontSize: '14.5px', fontFamily: 'Inter, sans-serif', color: '#111111' } } });
    portalCardElement.mount('#portal-card-element');
    portalCardElement.on('change', (e)=>{
      const errEl = document.getElementById('portal-card-error');
      if(errEl) errEl.textContent = e.error ? e.error.message : '';
    });
  }
}
async function savePortalCard(){
  if(!portalCardElement) return;
  portalCardSaving = true; portalCardError = ''; render();
  try{
    const setupRes = await fetch('/api/create-setup-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customerId: portalClient.stripeCustomerId })
    });
    const setupData = await setupRes.json();
    if(setupData.error){ portalCardError = setupData.error; portalCardSaving = false; render(); return; }
    const result = await stripe.confirmCardSetup(setupData.clientSecret, { payment_method: { card: portalCardElement } });
    if(result.error){ portalCardError = result.error.message; portalCardSaving = false; render(); return; }
    const confirmRes = await fetch('/api/portal-lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'confirm-card-update', token: portalToken, paymentMethodId: result.setupIntent.payment_method })
    });
    const confirmData = await confirmRes.json();
    if(confirmData.error){ portalCardError = confirmData.error; portalCardSaving = false; render(); return; }
    portalCardSaving = false; portalShowCardForm = false; portalCardError = '';
    render();
  }catch(e){
    portalCardError = 'Something went wrong. Please try again.';
    portalCardSaving = false; render();
  }
}

function attachHandlers(){
  const $ = id => document.getElementById(id);
  const backBtn = $('backToClientBtn'); if(backBtn) backBtn.onclick = backToClient;
  const loginBtn = $('admin-login-btn'); if(loginBtn) loginBtn.onclick = tryAdminLogin;
  const passInput = $('admin-pass');
  if(passInput) passInput.onkeydown = e=>{ if(e.key==='Enter') tryAdminLogin(); };
  const portalGoBtn = $('portal-go-btn'); if(portalGoBtn) portalGoBtn.onclick = checkPortal;
  const portalEmailInput = $('portal-email');
  if(portalEmailInput){
    portalEmailInput.oninput = e=> portalEmail = e.target.value;
    portalEmailInput.onkeydown = e=>{ if(e.key==='Enter') checkPortal(); };
  }
  const portalPhoneInput = $('portal-phone');
  if(portalPhoneInput){
    portalPhoneInput.oninput = e=> portalPhone = e.target.value;
