<!DOCTYPE html>
<html lang="en">
<head>

<title>Book a Clarity Session | Catalyst Consulting NYC</title>
<meta name="description" content="Book a clarity session with Heshy Perlstein — online or in person, in New York. Pick a time that works and you're booked in under a minute.">

<meta property="og:title" content="Book a Clarity Session with Heshy">
<meta property="og:description" content="Online or in person, in New York. Pick a time that works and you're booked in under a minute.">
<meta property="og:url" content="https://book.catalystconsultingnyc.com/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111111'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' fill='%23FBF6EA' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111;
    --muted:#6E6E6E;
    --line:#DEDEDE;
    --line-strong:#B8B8B8;
    --paper:#FFFFFF;
    --bg:#FBFBFA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 24px 120px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:32px 0 40px;border-bottom:1px solid var(--line);margin-bottom:40px;
  }
  .brand{font-family:'Source Serif 4',serif;font-size:20px;font-weight:500;}
  .manage-link{
    font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;
    font-family:'Inter',sans-serif;padding:0;text-decoration:underline;text-underline-offset:3px;
  }
  .manage-link:hover{color:var(--ink);}

  .step-label{font-size:13px;color:var(--muted);margin-bottom:8px;}
  .step-line{height:2px;background:var(--line);margin-bottom:40px;position:relative;}
  .step-line::after{
    content:'';position:absolute;left:0;top:0;height:2px;background:var(--ink);
    width:var(--pct,0%);transition:width .3s ease;
  }

  h1{font-family:'Source Serif 4',serif;font-weight:500;font-size:26px;margin:0 0 28px;}
  .intro{font-size:15px;line-height:1.65;color:var(--ink);max-width:520px;margin:0 0 32px;}

  .type-toggle{display:flex;gap:8px;margin-bottom:24px;}
  .type-btn{
    flex:1;padding:13px 0;border:1px solid var(--line-strong);border-radius:6px;text-align:center;
    cursor:pointer;font-size:14px;font-weight:500;background:var(--paper);
  }
  .type-btn:hover{border-color:var(--ink);}
  /* Format, duration, day and slot are clickable divs. They are given button semantics and
     keyboard focus in script; this is the focus ring that makes that usable. */
  [role="button"]:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .type-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .qci-card{
    border:1px solid #E9D1A8;background:#FAF7F0;border-radius:8px;padding:18px 20px;
    cursor:pointer;margin-top:6px;margin-bottom:24px;transition:border-color .15s;
  }
  .qci-card:hover{border-color:#C9A961;}
  .qci-card.active{border-color:#8A6D2F;background:#F3EBDA;}
  .qci-top{display:flex;align-items:center;justify-content:space-between;}
  .qci-title{font-size:14.5px;font-weight:600;color:#5C4A20;}
  .qci-badge{
    font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:#8A6D2F;border:1px solid #C9A961;border-radius:3px;padding:2px 7px;
  }
  .qci-sub{font-size:12.5px;color:#8A7550;margin-top:5px;line-height:1.5;}
  .qci-radio{width:16px;height:16px;border-radius:50%;border:1.5px solid #C9A961;flex-shrink:0;}
  .qci-card.active .qci-radio{border-color:#8A6D2F;background:#8A6D2F;box-shadow:inset 0 0 0 3px #F3EBDA;}
  .qci-row{display:flex;align-items:center;gap:12px;}
  .divider-label{
    display:flex;align-items:center;gap:12px;margin:26px 0 6px;color:var(--muted);font-size:11.5px;
    text-transform:uppercase;letter-spacing:.05em;
  }
  .divider-label::before,.divider-label::after{content:'';flex:1;height:1px;background:var(--line);}
  .qci-notice{
    background:#FAF7F0;border-left:3px solid #C9A961;border-radius:4px;padding:13px 16px;
    font-size:13px;line-height:1.6;color:#5C4A20;margin-top:-8px;margin-bottom:20px;
  }

  .day-strip{display:flex;gap:8px;margin-bottom:24px;overflow-x:auto;padding-bottom:2px;}
  .day-cell{
    flex:0 0 auto;width:64px;padding:12px 0;border:1px solid var(--line-strong);border-radius:6px;
    text-align:center;cursor:pointer;background:var(--paper);
  }
  .day-cell:hover{border-color:var(--ink);}
  .day-cell.active{background:var(--ink);border-color:var(--ink);}
  .day-cell .dow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .day-cell.active .dow{color:#BEBEBE;}
  .day-cell .dnum{font-family:'Source Serif 4',serif;font-size:19px;margin-top:2px;}
  .day-cell.active .dnum{color:#fff;}
  .day-cell .dcount{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .day-cell.active .dcount{color:#BEBEBE;}
  .time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .google-btn{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    font:inherit;font-size:14px;font-weight:500;background:var(--paper);color:var(--ink);
    border:1px solid var(--line-strong);border-radius:6px;padding:12px 0;cursor:pointer;
  }
  .google-btn:hover{border-color:var(--ink);}
  .qci-line{
    margin:20px 0 22px;font-size:13px;color:var(--muted);
  }
  .qci-link{
    font:inherit;font-size:13px;background:none;border:none;padding:0;cursor:pointer;
    color:var(--ink);text-decoration:underline;text-underline-offset:3px;
  }
  .qci-link:hover{color:#8A6D2F;}
  .slot-day-label{
    font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
    font-weight:600;margin:16px 0 8px;
  }
  /* Deliberately quiet: it's a clarification, not part of the time. */
  .time-cell .tz{
    font-size:9.5px;letter-spacing:.06em;color:var(--muted);margin-left:3px;
    vertical-align:baseline;font-weight:500;
  }
  .time-cell.selected .tz{color:inherit;opacity:.65;}
  .time-cell{
    border:1px solid var(--line-strong);border-radius:6px;padding:12px 10px;cursor:pointer;text-align:center;
  }
  .time-cell:hover{border-color:var(--ink);}
  .time-cell.selected{background:var(--ink);border-color:var(--ink);}
  .time-cell .time{font-size:14px;font-weight:500;}
  .time-cell.selected .time{color:#fff;}
  .time-cell .format{font-size:11px;color:var(--muted);margin-top:2px;}
  .time-cell.selected .format{color:#BEBEBE;}

  .day-title{font-size:14px;font-weight:600;margin:24px 0 10px;}
  .day-title:first-child{margin-top:0;}
  .slot-list{border-top:1px solid var(--line);}
  .slot{
    display:flex;align-items:center;justify-content:space-between;padding:16px 4px;
    border-bottom:1px solid var(--line);cursor:pointer;
  }
  .slot:hover{background:#F4F4F2;}
  .slot.selected{background:#EFEFED;}
  .slot .time{font-size:15px;font-weight:500;}
  .slot .format{font-size:13px;color:var(--muted);}
  .slot .radio{
    width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-strong);flex-shrink:0;
  }
  .slot.selected .radio{border-color:var(--ink);background:var(--ink);box-shadow:inset 0 0 0 3px #fff;}
  .empty{color:var(--muted);font-size:14px;padding:24px 0;}

  label{display:block;font-size:13px;font-weight:600;margin:20px 0 6px;}
  .required-mark{color:#A5433A;}
  .optional-mark{color:var(--muted);font-weight:400;font-size:12px;margin-left:4px;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=email],input[type=tel],input[type=password]{
    width:100%;padding:11px 12px;border:1px solid var(--line-strong);border-radius:4px;font-size:14.5px;
    font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);
  }
  .stripe-el{
    padding:11px 12px;border:1px solid var(--line-strong);border-radius:4px;background:var(--paper);
  }
  .card-error{color:#A5433A;font-size:12.5px;margin-top:6px;min-height:16px;}
  input:focus{outline:none;border-color:var(--ink);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .form-section{border-top:1px solid var(--line);padding-top:18px;margin-top:24px;}
  .form-section.last{margin-bottom:8px;}
  .section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:14px;}

  .fact{border-top:1px solid var(--line);padding-top:4px;margin:24px 0 8px;}
  .fact-row{display:flex;justify-content:space-between;gap:16px;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line);}
  .fact-row:last-child{border-bottom:none;}
  .fact-row span:first-child{color:var(--muted);flex:0 0 auto;}
  .fact-row span:last-child{text-align:right;}

  button.primary{
    background:var(--ink);color:#fff;border:none;padding:14px 24px;font-size:14.5px;
    font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;border-radius:4px;
  }
  button.primary:hover{background:#2E2E2E;}
  button.primary:disabled{background:#C7C7C7;cursor:not-allowed;}
  button.ghost{
    background:none;border:1px solid var(--line-strong);padding:13px 20px;font-size:14px;
    cursor:pointer;color:var(--ink);font-family:'Inter',sans-serif;border-radius:4px;
  }
  button.ghost:hover{border-color:var(--ink);}
  button.ghost.danger-ghost{border-color:#D9A8A2;color:#8C2F27;}
  button.ghost.danger-ghost:hover{border-color:#8C2F27;}
  button.small{padding:7px 12px;font-size:12.5px;}
  .btn-row{display:flex;gap:10px;margin-top:28px;}

  .confirm{padding:56px 0 40px;}
  .confirm-mark{
    width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:20px;
  }
  .confirm h1{margin-bottom:8px;}
  .confirm p{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 32px;}
  .join-block{margin-top:24px;}
  .join-block .section-title{margin-bottom:8px;}
  .join-link{color:var(--ink);font-size:14.5px;text-decoration:underline;text-underline-offset:3px;word-break:break-all;}
  .location-text{font-size:14.5px;line-height:1.6;color:var(--ink);}

  /* Admin */
  h2.sect{font-family:'Source Serif 4',serif;font-weight:500;font-size:17px;margin:0 0 14px;}
  .admin-nav{display:flex;gap:4px;margin-bottom:36px;border-bottom:1px solid var(--line);}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-month-label{font-family:'Source Serif 4',serif;font-size:16px;font-weight:500;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:6px;}
  .cal-cell{
    aspect-ratio:1;border:1px solid var(--line);border-radius:6px;padding:6px;position:relative;
    cursor:pointer;display:flex;flex-direction:column;
  }
  .cal-cell:hover{border-color:var(--ink);}
  .cal-cell.empty{border:none;cursor:default;}
  .cal-cell.past{color:var(--line-strong);cursor:default;background:#FAFAF9;}
  .cal-cell.past:hover{border-color:var(--line);}
  .cal-cell.holiday{background:#F7F2E8;border-color:#E9D1A8;}
  .cal-cell.selected{border-color:var(--ink);border-width:2px;}
  .cal-cell.today .cal-daynum{text-decoration:underline;text-underline-offset:2px;}
  .cal-daynum{font-size:12.5px;}
  .cal-dot{width:5px;height:5px;border-radius:50%;background:var(--ink);position:absolute;bottom:6px;left:6px;}
  .cal-cell.past .cal-dot{background:var(--line-strong);}
  .cal-slot-count{font-size:10px;color:var(--muted);margin-top:2px;}
  .cal-legend{display:flex;gap:20px;margin-top:14px;font-size:12px;color:var(--muted);}
  .cal-dot-legend,.cal-holiday-legend{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .cal-dot-legend{background:var(--ink);}
  .cal-holiday-legend{background:#F7F2E8;border:1px solid #E9D1A8;}
  .cal-grid-sm{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px;}
  .cal-dow-sm{text-align:center;font-size:10px;color:var(--muted);font-weight:600;padding-bottom:4px;}
  .cal-cell-sm{
    aspect-ratio:1;border:1px solid var(--line);border-radius:5px;position:relative;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:12px;min-height:36px;
  }
  .cal-cell-sm:hover{border-color:var(--ink);}
  .cal-cell-sm.empty{border:none;cursor:default;}
  .cal-cell-sm.past{color:var(--line-strong);cursor:default;background:#FAFAF9;border-color:var(--line);}
  .cal-cell-sm.selected{background:var(--ink);border-color:var(--ink);color:#fff;}
  .cal-cell-sm.today:not(.selected) .cal-daynum-sm{text-decoration:underline;text-underline-offset:2px;}
  .cal-daynum-sm{font-size:12px;line-height:1.1;}
  .cal-cell-sm .cal-slot-count{font-size:8.5px;margin-top:1px;white-space:nowrap;}
  .cal-cell-sm.selected .cal-slot-count{color:#fff;opacity:0.8;}
  .day-detail{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);}
  .day-detail-header{font-family:'Source Serif 4',serif;font-size:16px;font-weight:500;margin-bottom:10px;}
  .admin-nav-btn{
    background:none;border:none;padding:12px 4px;margin-right:24px;font-size:14px;font-weight:500;
    color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .admin-nav-btn:hover{color:var(--ink);}
  .admin-nav-btn.active{color:var(--ink);border-bottom-color:var(--ink);}
  .client-link{color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer;}
  .admin-block{margin-bottom:44px;padding-bottom:44px;border-bottom:1px solid var(--line);}
  .admin-block:last-child{border-bottom:none;}
  .dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;}
  .dash-stat{border:1px solid var(--line-strong);border-radius:8px;padding:16px 12px;text-align:center;cursor:pointer;transition:border-color 0.15s,background 0.15s;}
  .dash-stat:hover{border-color:var(--ink);}
  .dash-stat-active{border-color:var(--ink);border-width:2px;background:#F7F5F0;}
  .dash-stat-num{font-size:26px;font-weight:600;line-height:1;}
  .dash-stat-label{font-size:12px;color:var(--muted);margin-top:6px;}
  .dash-stat-alert{border-color:#C9A961;background:#FBF6EA;}
  .dash-stat-alert .dash-stat-num{color:#8A6D2F;}
  @media (max-width:640px){ .dash-stats{grid-template-columns:1fr 1fr;} }
  .admin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;}
  select{
    width:100%;padding:10px;border:1px solid var(--line-strong);border-radius:4px;font-size:14px;
    font-family:'Inter',sans-serif;background:var(--paper);
  }
  .row{
    display:flex;align-items:center;justify-content:space-between;padding:14px 0;
    border-bottom:1px solid var(--line);font-size:14px;
  }
  .slot-list-wrap{margin-top:24px;border-top:1px solid var(--line);}
  .slot-day-row{padding:12px 0;border-bottom:1px solid var(--line);}
  .google-btn{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    font:inherit;font-size:14px;font-weight:500;background:var(--paper);color:var(--ink);
    border:1px solid var(--line-strong);border-radius:6px;padding:12px 0;cursor:pointer;
  }
  .google-btn:hover{border-color:var(--ink);}
  .qci-line{
    margin:20px 0 22px;font-size:13px;color:var(--muted);
  }
  .qci-link{
    font:inherit;font-size:13px;background:none;border:none;padding:0;cursor:pointer;
    color:var(--ink);text-decoration:underline;text-underline-offset:3px;
  }
  .qci-link:hover{color:#8A6D2F;}
  .slot-day-label{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:8px;}
  .slot-chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .slot-chip{
    display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:5px 8px;
    border:1px solid var(--line-strong);border-radius:14px;background:var(--paper);
  }
  .slot-chip.booked{color:var(--muted);background:#F4F4F2;}
  .chip-x{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;
    padding:0;margin-left:2px;
  }
  .chip-x:hover{color:#A5433A;}
  .charge-row{padding-top:4px;}
  .charge-row label:first-of-type{margin-top:0;}
  .day-toggle-row{display:flex;gap:6px;}
  .day-toggle{
    width:34px;height:34px;border:1px solid var(--line-strong);border-radius:6px;display:flex;
    align-items:center;justify-content:center;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .day-toggle:hover{border-color:var(--ink);}
  .day-toggle.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .row .main{font-weight:500;}
  .row .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--line-strong);border-radius:3px;padding:2px 7px;text-transform:capitalize;}
  .tag.status-scheduled{color:var(--muted);border-color:var(--line-strong);}
  .tag.status-completed{color:var(--ink);border-color:var(--ink);}
  .tag.status-charged{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tag.status-cancelled{color:#A5433A;border-color:#A5433A;}
  .session{border-bottom:1px solid var(--line);padding:20px 0;}
  .session:last-child{border-bottom:none;}
  .session-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .session-name{font-weight:600;font-size:14.5px;}
  .session-meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .session-time-big{font-size:22px;font-weight:600;font-family:Georgia,serif;margin-top:4px;line-height:1.2;}
  .session-format{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}
  .session-controls{margin-top:14px;padding:14px;background:#F7F7F5;border-radius:6px;}
  .session-controls label:first-of-type{margin-top:0;}
  .session-actions{margin-top:14px;}
  textarea{
    width:100%;padding:10px 11px;border:1px solid var(--line-strong);border-radius:4px;font-size:14px;
    font-family:'Inter',sans-serif;min-height:56px;resize:vertical;
  }
  .timer{font-family:'Source Serif 4',serif;font-size:20px;}
  .rec-indicator{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:0.04em;color:#A5433A;}
  .rec-dot{width:9px;height:9px;border-radius:50%;background:#D6473C;animation:rec-pulse 1.3s ease-in-out infinite;}
  @keyframes rec-pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}
  .notes-textarea{min-height:160px;}
  .note{font-size:12px;color:var(--muted);margin-top:6px;}
  .client-block{border-bottom:1px solid var(--line);padding:20px 0;}
  .client-block:last-child{border-bottom:none;}
  .client-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .client-name{font-weight:600;font-size:14.5px;}
  .client-total{font-size:12.5px;color:var(--muted);}
  .hist-line{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;color:var(--ink);}
  .hist-line span:last-child{color:var(--muted);}
  .hist-entry{padding:10px 0;border-bottom:1px solid var(--line);}

}

// Ids for rules, one-off dates and coupons. Was an 8-character Math.random() value, which can
// collide; two records sharing an id looks exactly like one of them having vanished.
function uid(){
  try{ if(crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  // Older browsers: still 128 bits of real randomness, just assembled by hand.
  try{
    const b = new Uint8Array(16); crypto.getRandomValues(b);
    return Array.from(b, x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){}
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);
}

// --- Eastern-time helpers -------------------------------------------------
// Every time in this app is an Eastern wall-clock time. Parsing "2027-01-20T11:00" with
// new Date() uses *the viewer's* timezone, so a client in Chicago or Israel would see
// availability shifted by hours. These mirror api/_lib/time.js — keep the two in step.
// Uses only long-supported Intl options (no shortOffset, no hourCycle) so this can't throw on
// an older phone browser. hour12:false reports midnight as "24" on some engines, hence the % 24.
const APP_TZ = 'America/New_York';
function etFieldsAtC(instant){
  const parts = new Intl.DateTimeFormat('en-CA',{
    timeZone:APP_TZ, year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
  }).formatToParts(instant);
  const p={}; for(const part of parts) p[part.type]=part.value;
  return { year:Number(p.year), month:Number(p.month), day:Number(p.day),
           hour:Number(p.hour)%24, minute:Number(p.minute), second:Number(p.second) };
}
function etOffsetMinutesAtC(instant){
  const f = etFieldsAtC(instant);
  const asUtc = Date.UTC(f.year, f.month-1, f.day, f.hour, f.minute, f.second);
  return Math.round((asUtc - instant.getTime())/60000);
}
function etToUtcC(date, time){
  const [y,mo,d] = date.split('-').map(Number);
  const [h,mi] = time.split(':').map(Number);
  const asIfUtc = Date.UTC(y,mo-1,d,h,mi);
  let offset = etOffsetMinutesAtC(new Date(date+'T12:00:00Z'));
  let instant = new Date(asIfUtc - offset*60000);
  const refined = etOffsetMinutesAtC(instant);
  if(refined !== offset) instant = new Date(asIfUtc - refined*60000);
  return instant;
}
function etPartsOfC(instant){
  const f = etFieldsAtC(instant);
  const pad = n => String(n).padStart(2,'0');
  return { date:`${f.year}-${pad(f.month)}-${pad(f.day)}`, minutes:f.hour*60+f.minute };
}
function busyRangesForDateC(busy, targetDate){
  const ranges = [];
  for(const b of busy||[]){
    const start = new Date(b.start), end = new Date(b.end);
    if(isNaN(start) || isNaN(end) || end <= start) continue;
    const s = etPartsOfC(start), e = etPartsOfC(end);
    if(e.date < targetDate || s.date > targetDate) continue;
    if(e.date === targetDate && e.minutes === 0) continue;
    const startMin = s.date < targetDate ? 0 : s.minutes;
    const endMin = e.date > targetDate ? 24*60 : e.minutes;
    if(endMin > startMin) ranges.push([startMin, endMin]);
  }
  return ranges;
}
// Today's date on the Eastern calendar, regardless of where the viewer is.
function etTodayC(){ return etPartsOfC(new Date()).date; }

function slotOverlapsBusy(slot){
  const slotStart = etToUtcC(slot.date, slot.time);
  const slotEnd = new Date(slotStart.getTime() + slot.duration*60000);
  return calendarBusy.some(b=>{
    const bStart = new Date(b.start), bEnd = new Date(b.end);
    return slotStart < bEnd && slotEnd > bStart;
  });
}

function isFutureSlot(s){
  const minLeadHours = (state.settings.minLeadHours != null) ? state.settings.minLeadHours : 12;
  const slotDateTime = etToUtcC(s.date, s.time);
  const cutoff = new Date(Date.now() + minLeadHours * 60 * 60 * 1000);
  return slotDateTime >= cutoff;
}
function timeToMinC(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTimeC(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function dowOf(ds){ const [y,mo,d]=ds.split('-').map(Number); return new Date(y,mo-1,d).getDay(); }

// Free [startMin,endMin] ranges for a date+type: open windows (recurring weekly rules + one-off
// overrides for that exact date), minus already-booked times of the same type, minus real Google
// Calendar busy time. Two clients can book into the same window as long as their times don't overlap.
function computeFreeRanges(ds, type){
  const weekday = dowOf(ds);
  const windows = [];
  const isBlocked = (state.blockedDates||[]).some(bl=>bl.date===ds && bl.type===type);
  if(!isBlocked){
    (state.availability[type]||[]).filter(r=>r.days.includes(weekday)).forEach(r=>windows.push([timeToMinC(r.start), timeToMinC(r.end)]));
  }
  (state.overrides||[]).filter(o=>o.date===ds && o.type===type).forEach(o=>windows.push([timeToMinC(o.start), timeToMinC(o.end)]));
  if(windows.length===0) return [];
  windows.sort((a,b)=>a[0]-b[0]);
  const merged = [windows[0].slice()];
  for(let i=1;i<windows.length;i++){
    const last = merged[merged.length-1];
    if(windows[i][0] <= last[1]) last[1] = Math.max(last[1], windows[i][1]);
    else merged.push(windows[i].slice());
  }
  // Every active booking blocks, whatever its format — Heshy can't take a video call and an
  // in-person session at the same time. This used to filter on b.type===type, so an online
  // session and an in-person one could be offered in the same hour.
  const busy = (state.bookings||[]).filter(b=>b.date===ds && !b.cancelled).map(b=>{
    const s = timeToMinC(b.time); return [s, s+(b.durationMin||60)];
  });
  busyRangesForDateC(calendarBusy, ds).forEach(r => busy.push(r));
  let free = merged;
  busy.forEach(([bs,be])=>{
    const next = [];
    free.forEach(([fs,fe])=>{
      if(be<=fs || bs>=fe){ next.push([fs,fe]); return; }
      if(bs>fs) next.push([fs,bs]);
      if(be<fe) next.push([be,fe]);
    });
    free = next;
  });
  return free.filter(([s,e])=>e>s);
}
// Valid start times for a chosen duration on a given date, excluding past times. For every
// duration, only the two edges of each open window are offered — never a middle position.
// Booking from an edge always leaves ONE clean remaining block behind; booking from the middle
// would split the window into two smaller, less useful pieces for whatever gets booked next.
function computeStartTimes(ds, type, durationMin){
  const ranges = computeFreeRanges(ds, type);
  const times = [];
  ranges.forEach(([s,e])=>{
    if(s + durationMin <= e){
      const startT = minToTimeC(s);
      if(isFutureSlot({date:ds, time:startT})) times.push(startT);
      const lateStart = e - durationMin;
      if(lateStart !== s){
        const endT = minToTimeC(lateStart);
        if(isFutureSlot({date:ds, time:endT})) times.push(endT);
      }
    }
  });
  return times.sort();
}
// Resolves which location applies for a given date+type: a one-off override for that exact date
// takes priority over the matching recurring weekly rule, so e.g. Mon-Thu can be one office and
// Friday another.
function resolveLocation(ds, type){
  if(type!=='in-person') return null;
  const override = (state.overrides||[]).find(o=>o.date===ds && o.type===type && (o.generalArea||o.address));
  if(override) return { generalArea: override.generalArea||'', address: override.address||'' };
  const weekday = dowOf(ds);
  const rule = (state.availability[type]||[]).find(r=>r.days.includes(weekday) && (r.generalArea||r.address));
  if(rule) return { generalArea: rule.generalArea||'', address: rule.address||'' };
  return { generalArea: '', address: state.settings.location||'' };
}

async function confirmBooking(){
  if(!clientForm.name || !clientForm.email || !clientForm.phone || !cardComplete || submitting) return;
  if(isCurrentEmailBlocked()) return;
  submitting = true;
  const btn = document.getElementById('confirmBtn');
  const backBtn = document.getElementById('backTo1');
  if(btn){ btn.disabled = true; btn.textContent = 'Booking…'; }
  if(backBtn) backBtn.disabled = true;

  try{
    const setupRes = await fetch('/api/create-setup-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: clientForm.name, email: clientForm.email, phone: clientForm.phone })
    });
    const setupData = await setupRes.json();
    if(setupData.error){ throw new Error(setupData.error); }

    const result = await stripe.confirmCardSetup(setupData.clientSecret, {
      payment_method: {
        card: cardElement,
        billing_details: { name: clientForm.name, email: clientForm.email, phone: clientForm.phone }
      }
    });
    if(result.error){ throw new Error(result.error.message); }

    const bookingRes = await fetch('/api/create-booking', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        date: selectedDay, time: selectedStartTime, durationMin: selectedDuration, type: selectedType,
        name: clientForm.name, email: clientForm.email, phone: clientForm.phone,
        intakeAnswers: clientForm.intakeAnswers,
        setupToken: setupData.setupToken, couponCode: clientForm.couponCode
      })
    });
    const bookingData = await bookingRes.json();
    // A code that was fine while they were typing can be used up before they finish. The booking
    // is stopped rather than quietly going through at full price, and the code is cleared so
    // pressing Book again is a deliberate choice to pay full price.
    if(bookingData.couponRejected){
      clientForm.couponCode = '';
      couponCheckState = { status:'invalid', message: bookingData.error };
      submitting = false;
      cardErrorMsg = bookingData.error + ' Your card has not been charged and the session is not booked — press Book session again to continue at the full rate.';
      render();
      const errEl = document.getElementById('card-error'); if(errEl) errEl.textContent = cardErrorMsg;
      return;
    }
    if(bookingData.error){ throw new Error(bookingData.error); }
    strengthsInviteToken = bookingData.strengthsToken || null;
    confirmationSent = bookingData.confirmationSent !== false;
    if(bookingData.meetLink) confirmedMeetLink = bookingData.meetLink;
    if(bookingData.location) confirmedLocation = bookingData.location;
    confirmedComped = !!bookingData.comped;
    confirmedCouponCode = bookingData.couponCode || '';
    confirmedCouponDiscount = bookingData.couponDiscount || null;

// --- Session recording (in-person: mic only; virtual: mic + tab audio mixed) ---
// Chunks upload every 60s so a single request never gets large, regardless of session length.
let activeRecordings = {}; // bookingId -> { recorder, chunkIndex, audioContext, stream }
let recordingStatus = {}; // bookingId -> 'recording' | 'processing' | 'done' | 'error'
let recordingSegmentStart = {}; // bookingId -> ISO timestamp of when the current segment started

function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function uploadRecordingChunk(bookingId, chunkIndex, blob, mimeType){
  try{
    const base64 = await blobToBase64(blob);
    await fetch('/api/admin-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
      body: JSON.stringify({ action: 'upload-recording-chunk', bookingId, chunkIndex, chunkBase64: base64, mimeType })
    });
  }catch(e){ console.error('chunk upload failed', e); }
}

let recordingError = {}; // bookingId -> human-readable reason, shown when status is 'error'

function pickSupportedMimeType(){
  const candidates = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4',
    'audio/mp4;codecs=mp4a.40.2',
    'audio/ogg;codecs=opus'
  ];
  for(const c of candidates){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return null; // let the browser pick its own default rather than force an unsupported one
}

async function startRecording(bookingId, type){
  // Recording someone without telling them is the kind of thing that is easy to do by accident
  // and hard to undo. This is the prompt that makes it deliberate.
  if(!confirm('Has the client been told this session is being recorded, and agreed?\n\nThey can say no \u2014 the session goes ahead either way.')) return;
  try{
    if(!window.MediaRecorder){
      recordingError[bookingId] = 'This browser doesn\u2019t support recording.';
      recordingStatus[bookingId] = 'error'; render(); return;
    }
    const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    let finalStream = micStream;
    let audioContext = null;

    if(type === 'virtual'){
      // Capture the shared tab's audio (the other participant's voice) and mix it with the mic
      // (your own voice), since a tab's own audio output normally excludes your outgoing mic audio.
      try{
        const tabStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        const tabAudioTracks = tabStream.getAudioTracks();
        if(tabAudioTracks.length > 0){
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const dest = audioContext.createMediaStreamDestination();
          audioContext.createMediaStreamSource(micStream).connect(dest);
          audioContext.createMediaStreamSource(new MediaStream(tabAudioTracks)).connect(dest);
          finalStream = dest.stream;
        }
        tabStream.getVideoTracks().forEach(t=>t.stop()); // never need the video itself
      }catch(e){
        console.error('tab audio capture declined or failed, recording mic only', e);
      }
    }

    const mimeType = pickSupportedMimeType();
    const recorder = mimeType
      ? new MediaRecorder(finalStream, { mimeType, audioBitsPerSecond: 24000 })
      : new MediaRecorder(finalStream);
    let chunkIndex = 0;
    recorder.ondataavailable = (e)=>{
      if(e.data && e.data.size > 0){
        uploadRecordingChunk(bookingId, chunkIndex, e.data, recorder.mimeType);
        chunkIndex++;
      }
    };
    recorder.start(60000); // one chunk per minute
    activeRecordings[bookingId] = { recorder, stream: finalStream, micStream, audioContext };
    recordingSegmentStart[bookingId] = new Date().toISOString();
    delete recordingError[bookingId];
    recordingStatus[bookingId] = 'recording';
  }catch(e){
    console.error('could not start recording', e);
    recordingError[bookingId] = e.name === 'NotAllowedError' ? 'Microphone access was blocked \u2014 check your browser permissions.' : (e.message || 'Unknown error starting the recorder.');
    recordingStatus[bookingId] = 'error';
  }
  render();
}

async function stopRecording(bookingId){
  const rec = activeRecordings[bookingId];
  if(!rec) return;
  const segmentStart = recordingSegmentStart[bookingId] || new Date().toISOString();
  const segmentEnd = new Date().toISOString();
  rec.recorder.stop();
  rec.stream.getTracks().forEach(t=>t.stop());
  if(rec.micStream) rec.micStream.getTracks().forEach(t=>t.stop());
  if(rec.audioContext) rec.audioContext.close();
  delete activeRecordings[bookingId];
  delete recordingSegmentStart[bookingId];
  // Give the final ondataavailable chunk a moment to fire and upload before finalizing.
  recordingStatus[bookingId] = 'processing';
  render();
  await new Promise(r=>setTimeout(r, 1500));
  try{
    const res = await fetch('/api/admin-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
      body: JSON.stringify({ action: 'finalize-recording', bookingId, segmentStart, segmentEnd })
    });
    const data = await res.json();
    if(data.error){
      recordingStatus[bookingId] = 'error';
      recordingError[bookingId] = data.error;
      console.error('finalize recording failed', data.error);
    } else {
      recordingStatus[bookingId] = 'done';
      await loadAdminState();
    }
  }catch(e){
    recordingStatus[bookingId] = 'error';
    recordingError[bookingId] = e.message || 'Could not reach the server to process the recording.';
    console.error('finalize recording failed', e);
  }
  render();
}

// Hours as a person would write them: "1.5", "1:30", "90m", or "2h15". Returns decimal hours,
// or null if it isn't a number at all. An hour and a half is written both ways by the same
// person on the same day, and guessing wrong on a bill is not a small mistake.
function parseHours(raw){
  const s = String(raw == null ? '' : raw).trim().toLowerCase();
  if(!s) return null;
  let m = s.match(/^(\d+)\s*:\s*([0-5]?\d)$/);                 // 1:30
  if(m) return Number(m[1]) + Number(m[2])/60;
  m = s.match(/^(\d+)\s*h\s*(\d+)?\s*m?$/);                    // 2h15, 2h
  if(m) return Number(m[1]) + (m[2] ? Number(m[2])/60 : 0);
  m = s.match(/^(\d+(?:\.\d+)?)\s*m(?:in)?$/);                 // 90m
  if(m) return Number(m[1])/60;
  m = s.match(/^(\d+(?:\.\d+)?)\s*h?$/);                       // 1.5, 1.5h
  if(m) return Number(m[1]);
  return null;
}

// Minutes written back the way a person would type them, so reopening the box shows what was
// entered rather than a decimal to re-interpret.
function minutesToHm(mins){
  const m = Math.max(0, Math.round(Number(mins) || 0));
  if(m % 60 === 0) return String(m / 60);
  return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
}

  if(!el) return;
  const raw = el.value.trim();
  const hours = parseHours(raw);
  if(hours == null){
    actualEntryError = { id, message: `"${raw}" isn't a length I can read. Try 1:30, 90m or 1.5.` };
    render(); return;
  }
  const mins = Math.round(hours * 60);
  if(mins <= 0){
    actualEntryError = { id, message: 'That would be no time at all. Use Clear to remove it instead.' };
    render(); return;
  }
  editingActualId = null; actualEntryError = null;
  // The billing box derives from this, so a figure typed there earlier is now stale.
  delete billedHoursDraft[id];
  await updateBooking(id, { actualMinutes: mins });
}

async function chargeAndReceipt(id){
  const btn = document.querySelector(`[data-charge="${id}"]`);
  const amountInput = document.querySelector(`[data-amount="${id}"]`);
  const hoursInput = document.querySelector(`[data-actual-hours="${id}"]`);
  const overrideAmount = amountInput ? parseFloat(amountInput.value) : null;
  const overrideHours = hoursInput ? parseHours(hoursInput.value) : null;
  const overrideMinutes = (overrideHours!=null) ? Math.round(overrideHours*60) : null;
  // A number that can't be read is not the same as no number: charging the default when Heshy
  // meant to type a length would bill the wrong amount silently.
  if(hoursInput && hoursInput.value.trim() && overrideHours==null){
    chargeProblem = { id, message: `"${hoursInput.value.trim()}" isn't a length I can read.`, next: 'Try 1.5, or 1:30, or 90m.', retryable: true };
    render(); return;
  }
  // The label has to be put back on every exit path, not just the happy one. It used to be left
  // reading "Charging…" after a decline, so a button that was perfectly usable looked dead.
  const wasLabelled = btn ? btn.textContent : '';
  const restore = () => { if(btn){ btn.disabled = false; btn.textContent = wasLabelled; } };
  if(btn){ btn.disabled = true; btn.textContent = 'Charging…'; }
  chargeProblem = null;
  try{
    const res = await fetch('/api/charge-booking', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
      body: JSON.stringify({
        bookingId: id,
        amount: (overrideAmount!=null && !isNaN(overrideAmount)) ? overrideAmount : undefined,
        actualMinutes: (overrideMinutes!=null && !isNaN(overrideMinutes)) ? overrideMinutes : undefined
      })
    });
    const data = await res.json();
    if(data.error){
      // Shown on the booking itself and left there, rather than in an alert box that vanishes
      // the moment it's dismissed and takes the reason with it.
      chargeProblem = { id, message: data.error, next: data.next || '', retryable: data.retryable !== false, emailed: data.clientEmailed };
      restore(); render(); return;
    }
    // Only once it has actually been charged is the typed length no longer needed.
    delete billedHoursDraft[id];
    await loadAdminState();
    render();
  }catch(e){
    chargeProblem = { id, message: 'Could not reach the server: ' + e.message, next: 'Check your connection and try again. Nothing was charged.', retryable: true };
    restore(); render();
  }
}

    const row = k => `<div style="background:var(--paper);border:1px solid var(--line);border-left:3px solid ${k===prof.primary[0]||k===prof.primary[1]?'#8A6D2F':(k===prof.secondary[0]||k===prof.secondary[1]?'var(--line-strong)':'var(--line)')};border-radius:6px;padding:12px 14px;">

    const band = (title, ks) => `<div style="margin-bottom:22px;">
        <div style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;font-weight:600;">${title}</div>
        <div style="display:flex;flex-direction:column;gap:8px;">${ks.map(row).join('')}</div></div>`;
    inner = `
      <div class="step-label">Your result</div>
      ${t ? `<div style="border:1.5px solid #C9A961;background:#FBF6EA;border-radius:8px;padding:22px;margin-bottom:18px;">
        <div style="font-family:'Source Serif 4',serif;font-size:26px;font-weight:500;color:#8A6D2F;margin-bottom:6px;">${esc(t.name)}</div>
        <div>${esc(t.line)}</div></div>` : ''}
      ${near ? `<div style="border:1.5px dashed #C9A961;border-radius:8px;padding:12px 14px;margin-bottom:18px;color:var(--muted);font-size:14.5px;"><strong style="color:var(--ink);">A close call.</strong> ${esc(A.TRAITS[near[0]].label)} and ${esc(A.TRAITS[near[1]].label)} came out almost even for you. Both are real &mdash; we'll talk it through.</div>` : ''}
      ${t ? `<p style="color:var(--muted);margin-bottom:26px;">You're wired for <strong style="color:var(--ink);">${esc(t.wiredFor[0])}</strong>, <strong style="color:var(--ink);">${esc(t.wiredFor[1])}</strong> and <strong style="color:var(--ink);">${esc(t.wiredFor[2])}</strong>.</p>` : ''}

      ${band('You can do well', prof.secondary)}
      ${band('Wears you down', prof.draining)}
      <div style="border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:14px;">
        Thank you &mdash; this is genuinely useful to me. We'll go through it together in your session: what it means day to day, and where it's costing you.
        <div style="font-family:'Source Serif 4',serif;letter-spacing:.24em;margin-top:8px;">${esc(prof.letters)}</div>
      </div>
      <div class="btn-row" style="margin-top:24px;"><span></span><button class="primary" id="strengths-close">Done</button></div>`;
  }

  return `
    <div class="topbar"><div class="brand">Strengths assessment</div></div>
    <div class="step-line" style="--pct:${pct}%;"></div>
    ${strengthsError ? `<div class="card-error" style="margin-bottom:14px;">${esc(strengthsError)}</div>` : ''}
    ${inner}`;
}

function attachStrengthsHandlers(){
  const A = window.ASSESSMENT;
  const close = document.getElementById('strengths-close');
  if(close) close.onclick = ()=>{ view = strengthsFrom; window.scrollTo(0,0); render(); };

  const start = document.getElementById('strengths-start');
  if(start) start.onclick = ()=>{ strengthsStage='part'; strengthsIdx=0; window.scrollTo(0,0); render(); };

  const go = document.getElementById('strengths-go');
  if(go) go.onclick = ()=>{ strengthsStage='q'; window.scrollTo(0,0); render(); };

  const back = document.getElementById('strengths-back');
  if(back) back.onclick = ()=>{
    if(strengthsStage==='part'){
      if(strengthsIdx===0) strengthsStage='intro';
      else { strengthsIdx--; strengthsStage='q'; }
    } else if(strengthsStage==='q'){
      if(strengthsIdx >= A.ITEMS.length){
        // Backups depend on the answers before them, so stepping back undoes the last one.
        const last = strengthsAnswers.extra.pop();
        delete strengthsAnswers.items[last];
        strengthsIdx--;
      } else if(strengthsIdx % 6 === 0) strengthsStage='part';
      else strengthsIdx--;
    }
    window.scrollTo(0,0); render();
  };

  document.querySelectorAll('[data-sv]').forEach(el=>{ el.onclick = ()=>{
    const q = strengthsList()[strengthsIdx];
    strengthsAnswers.items[q.id] = Number(el.getAttribute('data-sv'));
    document.querySelectorAll('[data-sv]').forEach(x=>x.classList.toggle('active', x===el));
    setTimeout(advanceStrengths, 220);
  };});
}

function advanceStrengths(){
  const A = window.ASSESSMENT;
  strengthsIdx++;
  window.scrollTo(0,0);
  if(strengthsIdx < A.ITEMS.length){ if(strengthsIdx % 6 === 0) strengthsStage='part'; return render(); }
  if(strengthsIdx < strengthsList().length) return render();
  const next = A.nextExtra(strengthsAnswers);
  if(next){
    const first = strengthsAnswers.extra.length === 0;
    strengthsAnswers.extra.push(next);
    strengthsStage = first ? 'more' : 'q';
    return render();
  }
  submitStrengths();
}

async function submitStrengths(){
  strengthsStage='saving'; strengthsError=''; render();
  try{
    const body = { action:'save-strengths', answers: strengthsAnswers };
    if(strengthsInviteToken) body.strengthsToken = strengthsInviteToken;
    if(portalToken) body.token = portalToken;
    const r = await fetch('/api/portal-lookup', {
      method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body)
    });
    const d = await r.json();
    if(d.error){ throw new Error(d.error); }
    strengthsResult = d.result;
    strengthsStage='done';
    if(portalToken) resumePortalSession();
  }catch(err){
    // Their answers aren't lost — show the result from the same scoring the server uses, and
    // say plainly that it didn't save.
    strengthsResult = window.ASSESSMENT.score(strengthsAnswers);
    strengthsStage='done';
    strengthsError = (err.message || 'We could not save your answers.') + ' Your result is below, but it has not been saved — please mention it to Heshy.';
  }
  window.scrollTo(0,0); render();
}

      </div>
      <div class="sess-step">2. What time on ${fmtDate(activeDay)}?</div>

      </div>

  `;

  const prof = portalClient.strengths ? window.ASSESSMENT.profileOf(portalClient.strengths.letters) : null;
  // Someone who has already done this should be shown their result, not sold the assessment a
  // second time. Retaking stays possible, but as a quiet line underneath rather than a button
  // competing with the result itself.
  const strengthsSectionHtml = (prof && prof.complete) ? `
    <div class="section-title" style="margin-top:36px;">Your strengths</div>

      ${prof.type ? `<div class="strengths-type">${esc(prof.type.name)}</div>

      <div class="strengths-pair">
        <div class="strengths-pair-label">Comes naturally</div>
        <div class="strengths-pair-value">${prof.primary.map(k=>esc(window.ASSESSMENT.TRAITS[k].label)).join(' &amp; ')}</div>

      <div class="strengths-letters">${esc(prof.letters)}</div>
    </div>
    <div class="note" style="margin-top:10px;">Heshy has this, so your sessions start from it.
      <button class="manage-link" id="portal-retake-strengths">Take it again</button></div>
  ` : `
    <div class="section-title" style="margin-top:36px;">Strengths assessment</div>
    <div class="wg-block" style="border:1.5px solid #C9A961;background:#FBF6EA;border-radius:8px;padding:16px 18px;">
      <p style="margin:0 0 12px;">Ten minutes, and it changes our session &mdash; it tells me how you're wired so we start at the real conversation. Included, no charge.</p>
      <button class="primary small" id="portal-start-strengths">Take the assessment</button>
    </div>
  `;

  const cardSectionHtml = portalClient.hasCard ? `
    <div class="section-title" style="margin-top:32px;">Payment method</div>
    ${!portalShowCardForm ? `
      <div class="note" style="margin-bottom:10px;">A card is on file.</div>
      <button class="ghost small" id="portal-update-card-btn">Update card</button>
    ` : `
      <div id="portal-card-element" style="padding:12px;border:1px solid var(--line-strong);border-radius:6px;"></div>
      <div class="card-error" id="portal-card-error">${portalCardError}</div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="primary small" id="portal-save-card-btn" ${portalCardSaving?'disabled':''}>${portalCardSaving?'Saving…':'Save new card'}</button>
        <button class="ghost small" id="portal-cancel-card-btn">Cancel</button>
      </div>
    `}
  ` : '';
  return `
    <div class="topbar">
      <div class="brand" id="brand-home-link" style="cursor:pointer;">Clarity Session w/ Heshy</div>
      <a href="#portal" class="manage-link" data-go-portal="1">My sessions</a>
    </div>
    <h1>Hi ${esc(portalClient.name.split(' ')[0])}</h1>
    ${portalMoveNotice ? `<div class="portal-flash">${esc(portalMoveNotice)}</div>` : ''}
    <div class="section-title">${upcoming.length === 1 ? 'Your next session' : 'Your upcoming sessions'}</div>
    ${upHtml}
    <div class="btn-row" style="margin-top:18px;margin-bottom:0;"><button class="ghost small" id="portal-book-again">Book another session</button></div>
    <div class="section-title" style="margin-top:36px;">Past sessions</div>

    ${strengthsSectionHtml}
    ${cardSectionHtml}

}

function renderClient(){
  const pct = bookingStep===1 ? 10 : bookingStep===2 ? 55 : 100;
  const durationOptions = (state.settings.durationOptions && state.settings.durationOptions.length) ? state.settings.durationOptions : [60];
  if(!durationOptions.includes(selectedDuration) && selectedDuration !== 15) selectedDuration = durationOptions[0];

  let inner = '';
  if(bookingStep===1){
    inner += `<h1>Book a session</h1>`;
    // The way back in used to be only this line, on step 1, gone as soon as a date was picked.
    // A client who booked weeks ago and wants to cancel had to land here and spot it. It's now a
    // "My sessions" link in the header of every client screen instead.
    inner += `<div class="type-toggle">
      <div class="type-btn ${selectedType==='virtual'?'active':''}" data-type="virtual">Online</div>
      <div class="type-btn ${selectedType==='in-person'?'active':''}" data-type="in-person">In person</div>
    </div>`;
    if(durationOptions.length > 1){
      inner += `<div class="section-title" style="margin-top:20px;">Session length</div>`;
      inner += `<div class="type-toggle">`;
      durationOptions.slice().sort((a,b)=>a-b).forEach(d=>{
        const label = d===60 ? '60 min <span class="std-mark">(standard)</span>' : d===120 ? '120 min <span class="std-mark">(extended)</span>' : `${d} min`;
        inner += `<div class="type-btn ${selectedDuration===d?'active':''}" data-duration="${d}">${label}</div>`;
      });
      inner += `</div>`;
      const longestOffered = Math.max(...durationOptions);
      inner += `<div style="margin-top:10px;margin-bottom:24px;font-size:12.5px;color:var(--muted);font-style:italic;">Need more than ${longestOffered} min? Book the ${longestOffered}-min session &mdash; we'll sort out the rest together once we're talking.</div>`;
    }
    if(selectedType==='virtual'){
      // This used to sit here as a full gold card for every visitor, including first-timers who
      // aren't eligible for it — the most prominent thing on the page after the title. It's now
      // a quiet line that opens into the card when someone says it applies to them.
      const qciOpen = qciExpanded || selectedDuration===15;
      if(!qciOpen){
        inner += `<div class="qci-line">Worked with Heshy before? <button class="qci-link" id="qciShow">Book a 15-min check-in instead</button></div>`;
      } else {
        inner += `<div class="divider-label">For returning clients</div>`;
        inner += `<div class="qci-card ${selectedDuration===15?'active':''}" data-duration="15">
          <div class="qci-top">
            <div class="qci-row">
              <div class="qci-radio"></div>
              <div>
                <div class="qci-title">Quick Check-in</div>
                <div class="qci-sub">15-min phone call &middot; for clients who've worked with Heshy before</div>
              </div>
            </div>
            <div class="qci-badge">15 min</div>
          </div>
        </div>`;
      }
    }
    // Find the next ~56 days that have at least one valid start time for the chosen type+duration.
    const candidateDates = [];
    const [cy, cmo, cd] = etTodayC().split('-').map(Number);
    for(let i=0;i<56;i++){
      const d = new Date(cy, cmo - 1, cd); d.setDate(d.getDate()+i);
      const ds = dateStr(d);
      if(jewishHolidayDates.has(ds)) continue;
      const times = computeStartTimes(ds, selectedType, selectedDuration);
      if(times.length>0) candidateDates.push({ date: ds, times });
    }
    if(candidateDates.length===0){
      inner += `<div class="empty">No open ${selectedType==='virtual'?'online':'in-person'} times right now for a ${selectedDuration}-min session.</div>`;
    } else {
      if(!selectedDay || !candidateDates.some(c=>c.date===selectedDay)){
        selectedDay = candidateDates[0].date;
        const today0 = new Date(); today0.setHours(0,0,0,0);
        const daysOut = Math.round((new Date(selectedDay+'T00:00:00') - today0) / 86400000);
        const weeksNeeded = Math.ceil((daysOut+1)/7);
        if(weeksNeeded > clientCalWeeksShown) clientCalWeeksShown = weeksNeeded;
      }
      inner += renderClientCalendar(candidateDates);
      if(selectedType==='in-person'){
        const loc = resolveLocation(selectedDay, 'in-person');
        if(loc && loc.generalArea){
          inner += `<div style="margin-bottom:14px;padding:10px 14px;border:1px solid #C9A961;background:#FBF6EA;border-radius:6px;font-size:13.5px;">In-person sessions this day: <strong>${loc.generalArea}</strong>. Exact address sent once you book.</div>`;
        }
      }
      const dayTimes = (candidateDates.find(c=>c.date===selectedDay) || {times:[]}).times;
      if(selectedDay && dayTimes.length){
        // Say which day these times belong to. There was nothing connecting them to the calendar.
        inner += `<div class="slot-day-label">${fmtDate(selectedDay)}</div>`;
      }
      inner += `<div class="time-grid">`;
      dayTimes.forEach(t=>{
        const sel = selectedStartTime===t ? 'selected' : '';
        inner += `<div class="time-cell ${sel}" data-start-time="${t}">
          <div class="time">${fmtTime(t)}${VIEWER_IN_ET ? '' : '<span class="tz">ET</span>'}</div>
          <div class="format">${selectedDuration} min</div>
        </div>`;
      });
      inner += `</div>`;
      inner += renderCalendarNav();
      inner += `<div class="btn-row"><button class="primary" id="toStep2" ${selectedStartTime?'':'disabled'}>Continue</button></div>`;
    }
  } else if(bookingStep===2){
    inner += `<h1>Your details</h1>`;
    const isMinimumBilling = state.settings.billingMode === 'minimum';
    const isQuickCheckin = selectedDuration === 15;
    inner += `
      <div class="fact">
        <div class="fact-row"><span>Time</span><span>${fmtDate(selectedDay)}, ${fmtTime(selectedStartTime)}${etSuffix()}</span></div>
        <div class="fact-row"><span>Length</span><span>${selectedDuration} min</span></div>
        <div class="fact-row"><span>Format</span><span>${isQuickCheckin ? 'Phone call' : (selectedType==='virtual'?'Video call':'In person')}</span></div>
        <div class="fact-row"><span>Rate</span><span>$${state.settings.hourlyRate||500}/hour</span></div>
        <div class="fact-row"><span>Charged</span><span>${isMinimumBilling ? `After the session, for at least the ${selectedDuration} min booked` : 'After the session, for actual time used'}</span></div>
        <div class="fact-row"><span>Receipt</span><span>Emailed automatically once charged</span></div>
      </div>
      ${isMinimumBilling ? `<div class="note" style="margin-top:-10px;margin-bottom:20px;">If the session runs shorter than ${selectedDuration} min, you're still billed for the full ${selectedDuration} min booked \u2014 sessions running longer are billed for the actual time.</div>` : ''}
      ${isQuickCheckin ? `<div class="qci-notice">You don't need to call in &mdash; Heshy will call you directly at ${fmtTime(selectedStartTime)}. If he can't reach you, he'll try again about a minute later. If there's still no answer and the session hasn't been cancelled ahead of time, it will still be billed for the ${selectedDuration} minutes reserved.</div>` : ''}
      <div class="form-section">
        <div class="section-title">Contact</div>
        <div class="note" style="margin-top:-4px;margin-bottom:12px;">
          ${clientForm.isNew === false
            ? 'Welcome back &mdash; just confirm these and you\'re done.'
            : 'Three details and your card. If this is your first session, two short questions follow.'}
        </div>
        <label>Name <span class="required-mark">*</span></label>
        <input type="text" id="f-name" value="${esc(clientForm.name)}">
        <label>Email <span class="required-mark">*</span></label>
        <input type="email" id="f-email" value="${esc(clientForm.email)}">
        <label>Phone <span class="required-mark">*</span></label>
        <input type="tel" id="f-phone" value="${esc(clientForm.phone)}">
      </div>
      <div id="intake-region">${intakeRegionHtml()}</div>
      <div class="form-section">
        <div class="section-title">Coupon code <span class="optional-mark">(optional)</span></div>
        <input type="text" id="f-coupon" placeholder="Have a code? Enter it here" value="${esc(clientForm.couponCode)}">
        <div id="coupon-status" style="font-size:12.5px;margin-top:6px;min-height:16px;${couponCheckState.status==='valid'?'color:#2E5B27;':couponCheckState.status==='invalid'?'color:#A5433A;':'color:var(--muted);'}">
          ${couponCheckState.status==='checking' ? 'Checking…' : couponCheckState.status==='valid' ? '\u2713 Code applied \u2014 ' + couponDiscountLabel(couponCheckState) : couponCheckState.status==='invalid' ? couponCheckState.message : ''}
        </div>
      </div>
      <div class="form-section last">
        <div class="section-title">Payment</div>
        <label>Card</label>
        <div id="card-element" class="stripe-el"></div>
        <div id="card-error" class="card-error"></div>
      </div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.6;">
        Sessions are sometimes recorded so Heshy can focus on the conversation and send you a written recap &mdash;
        he'll always tell you first, and you can say no.
        <a href="/privacy.html" target="_blank" rel="noopener" style="color:var(--ink);">How your information is handled</a>.
      </div>
      <div class="btn-row">
        <button class="ghost" id="backTo1" ${submitting?'disabled':''}>Back</button>
        <button class="primary" id="confirmBtn" ${(clientForm.name && clientForm.email && clientForm.phone && cardComplete && !submitting && !isCurrentEmailBlocked()) ? '' : 'disabled'}>${submitting?'Booking…':'Book session'}</button>
      </div>
    `;
  } else {
    inner += `
      <div class="confirm">
        <div class="confirm-mark">&#10003;</div>
        <h1>Booked.</h1>
        <p>${confirmationSent === false
             ? 'Your session is booked. We couldn\'t send the confirmation email just now &mdash; your booking is safe, and the details are below.'
             : 'A confirmation is on its way to your email.'}</p>
        <div class="fact">
          <div class="fact-row"><span>Time</span><span>${fmtDate(selectedDay)}, ${fmtTime(selectedStartTime)}${etSuffix()}</span></div>
          <div class="fact-row"><span>Length</span><span>${selectedDuration} min</span></div>
          <div class="fact-row"><span>Format</span><span>${selectedDuration===15 ? 'Phone call' : (selectedType==='virtual'?'Video call':'In person')}</span></div>
          <div class="fact-row"><span>Rate</span><span>${confirmedComped ? 'Complimentary — no charge' : confirmedCouponDiscount ? `$${state.settings.hourlyRate||500}/hour (${confirmedCouponDiscount.type==='percent' ? confirmedCouponDiscount.value+'% off applied' : money(confirmedCouponDiscount.value)+' off applied'})` : `$${state.settings.hourlyRate||500}/hour`}</span></div>
          ${confirmedCouponCode ? `<div class="fact-row"><span>Coupon</span><span>${confirmedCouponCode}</span></div>` : ''}
        </div>
        ${selectedDuration===15 ? `<div class="qci-notice" style="margin-top:20px;">You don't need to call in &mdash; Heshy will call you directly at ${fmtTime(selectedStartTime)}. If he can't reach you, he'll try again about a minute later. If there's still no answer and the session hasn't been cancelled ahead of time, it will still be billed for the ${selectedDuration} minutes reserved.</div>` : ''}
        ${selectedType==='virtual'
          ? `<div class="join-block"><div class="section-title">Join link</div><a href="${confirmedMeetLink||'#'}" class="join-link">${confirmedMeetLink||'Link will be sent before the session'}</a></div>`
          : `<div class="join-block"><div class="section-title">Location</div><div class="location-text">${(confirmedLocation||'Address will be sent before the session').replace(/\n/g,'<br>')}</div></div>`}
        <div style="margin-top:22px;font-size:13.5px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;">
          ${(()=>{ const l = calendarAddLink(selectedDay, selectedStartTime, selectedDuration, selectedType, confirmedMeetLink||confirmedLocation);
             return l ? `<a href="${l}" target="_blank" rel="noopener" style="color:var(--ink);">Add to calendar</a>` : ''; })()}
          <a href="#portal" id="confirm-portal-link" style="color:var(--ink);">View or cancel this session</a>
