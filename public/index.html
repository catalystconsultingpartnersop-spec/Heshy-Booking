        <div style="margin-top:12px;font-size:12.5px;color:var(--muted);">
          Need to move it? Cancel in your portal and book again, or just email Heshy.
        </div>
        ${strengthsInviteToken ? `
        <div class="wg-block" style="border:1.5px solid #C9A961;background:#FBF6EA;border-radius:8px;padding:18px;margin-top:24px;text-align:left;">
          <div class="section-title" style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:16px;">&#9733;</span> One more thing, and it matters to me
          </div>
          <p style="margin:0 0 14px;">Ten minutes now and our session starts at the real conversation instead of me working out how you're wired. It's included &mdash; no charge.</p>
          <button class="primary" id="confirm-start-strengths">Take the assessment</button>
          <div style="font-size:12.5px;color:var(--muted);margin-top:10px;">Or do it later &mdash; the link is in your confirmation email.</div>
        </div>` : ''}
      </div>
    `;
  }

  return `
    <div class="topbar">
      <div class="brand" id="brand-home-link" style="cursor:pointer;">Clarity Session w/ Heshy</div>
      <a href="#portal" class="manage-link" data-go-portal="1">My sessions</a>
    </div>
    <div class="step-label">Step ${bookingStep} of 3</div>
    <div class="step-line" style="--pct:${pct}%"></div>
    ${inner}
  `;
}

function renderDashboardCalendar(){
  const monthStart = new Date(dashboardCalMonth.getFullYear(), dashboardCalMonth.getMonth(), 1);
  const monthLabel = monthStart.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  const firstDow = monthStart.getDay();
  const daysInMonth = new Date(monthStart.getFullYear(), monthStart.getMonth()+1, 0).getDate();
  const todayDs = dateStr(new Date());

  const countsByDate = {};
  state.bookings.forEach(b=>{ if(!b.cancelled) countsByDate[b.date] = (countsByDate[b.date]||0)+1; });

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(monthStart.getFullYear(), monthStart.getMonth(), day);
    const ds = dateStr(d);
    const isHoliday = jewishHolidayDates.has(ds);
    const hasBookings = !!countsByDate[ds];
    const isSelected = selectedDashboardDate === ds;
    const isToday = ds === todayDs;
    cells += `<div class="cal-cell ${isHoliday?'holiday':''} ${isSelected?'selected':''} ${isToday?'today':''}" data-dash-day="${ds}" ${isHoliday?`title="${jewishHolidayNames[ds]||'Jewish holiday'}"`:''}>
      <div class="cal-daynum">${day}</div>
      ${hasBookings ? `<div class="cal-dot"></div>` : ''}
    </div>`;
  }

  return `
    <div class="cal-header">
      <button class="ghost small" id="dashCalPrevMonth">&larr;</button>
      <div class="cal-month-label">${monthLabel}</div>
      <button class="ghost small" id="dashCalNextMonth">&rarr;</button>
    </div>
    <div class="cal-grid">
      ${['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="cal-legend">
      <span><span class="cal-dot-legend"></span> has sessions</span>
    </div>
  `;
}

// Client-facing calendar for picking a day to book — a compact, rolling window starting from
// today (never shows the past), 2 weeks by default with a button to reveal more as needed.
function renderClientCalendar(candidateDates){
  const countsByDate = {};
  candidateDates.forEach(c=>{ countsByDate[c.date] = c.times.length; });
  // Anchor the grid to today in Eastern time, not the viewer's timezone, so a client booking
  // from another timezone sees the same days Heshy does.
  const todayDs = etTodayC();
  const [ty, tmo, td] = todayDs.split('-').map(Number);
  const today = new Date(ty, tmo - 1, td);
  const todayDow = today.getDay();

  const totalCells = clientCalWeeksShown * 7;
  let cells = '';
  for(let i=0;i<todayDow;i++) cells += `<div class="cal-cell-sm empty"></div>`;
  for(let i=0;i<totalCells-todayDow;i++){
    const d = new Date(today); d.setDate(d.getDate()+i);
    const ds = dateStr(d);
    const isHoliday = jewishHolidayDates.has(ds);
    const count = countsByDate[ds] || 0;
    const isAvailable = count > 0;
    const isSelected = selectedDay === ds;
    const isToday = ds === todayDs;
    cells += `<div class="cal-cell-sm ${!isAvailable?'past':''} ${isSelected?'selected':''} ${isToday?'today':''}" ${isAvailable?`data-day="${ds}"`:''} ${isHoliday?`title="${jewishHolidayNames[ds]||'Jewish holiday'}"`:''}>
      <div class="cal-daynum-sm">${d.getDate()}</div>
      ${isAvailable ? `<div class="cal-slot-count">${count} open</div>` : ''}
    </div>`;
  }

  // Grid only. "Show more dates" used to be appended here, which put it between the calendar
  // and the times — so the one thing a client needs to do next sat below a secondary button.
  // The caller places renderCalendarNav() after the times instead.
  return `
    <div class="cal-grid-sm">
      ${['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dow-sm">${d}</div>`).join('')}
      ${cells}
    </div>
  `;
}

function renderCalendarNav(){
  return `
    <div style="display:flex;gap:14px;align-items:center;margin-top:16px;">
      <button class="ghost small" id="clientCalShowMore">Show more dates</button>
      ${clientCalWeeksShown > 2 ? `<button class="ghost small" id="clientCalShowFewer">Show fewer dates</button>` : ''}
    </div>
  `;
}

function renderScheduleCalendar(){
  const monthStart = new Date(scheduleCalMonth.getFullYear(), scheduleCalMonth.getMonth(), 1);
  const monthLabel = monthStart.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  const firstDow = monthStart.getDay();
  const daysInMonth = new Date(monthStart.getFullYear(), monthStart.getMonth()+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const todayDs = dateStr(today);

  const countsForType = {};
  const today0 = new Date(); today0.setHours(0,0,0,0);
  for(let i=0;i<60;i++){
    const d = new Date(today0); d.setDate(d.getDate()+i);
    const ds = dateStr(d);
    const weekday = d.getDay();
    const isBlocked = (state.blockedDates||[]).some(bl=>bl.date===ds && bl.type===adminType);
    const hasRule = !isBlocked && (state.availability[adminType]||[]).some(r=>r.days.includes(weekday));
    const hasOverride = (state.overrides||[]).some(o=>o.date===ds && o.type===adminType);
    if(hasRule || hasOverride) countsForType[ds] = true;
  }

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(monthStart.getFullYear(), monthStart.getMonth(), day);
    const ds = dateStr(d);
    const isPast = ds < todayDs;
    const isHoliday = jewishHolidayDates.has(ds);
    const hasSlots = !!countsForType[ds];
    const isSelected = selectedScheduleDate === ds;
    const isToday = ds === todayDs;
    cells += `<div class="cal-cell ${isPast?'past':''} ${isHoliday?'holiday':''} ${isSelected?'selected':''} ${isToday?'today':''}" ${isPast?'':`data-cal-day="${ds}"`} ${isHoliday?`title="${jewishHolidayNames[ds]||'Jewish holiday'}"`:''}>
      <div class="cal-daynum">${day}</div>
      ${hasSlots ? `<div class="cal-dot"></div>` : ''}
    </div>`;
  }

  return `
    <div class="cal-header">
      <button class="ghost small" id="calPrevMonth">&larr;</button>
      <div class="cal-month-label">${monthLabel}</div>
      <button class="ghost small" id="calNextMonth">&rarr;</button>
    </div>
    <div class="cal-grid">
      ${['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="cal-legend">
      <span><span class="cal-dot-legend"></span> has open times</span>
      <span><span class="cal-holiday-legend"></span> Jewish holiday, unavailable</span>
    </div>
  `;
}

function renderDayDetail(){
  if(!selectedScheduleDate) return '';
  const ds = selectedScheduleDate;
  const isHoliday = jewishHolidayDates.has(ds);
  const weekday = dowOf(ds);
  const isBlocked = (state.blockedDates||[]).some(bl=>bl.date===ds && bl.type===adminType);
  const recurring = (state.availability[adminType]||[]).filter(r=>r.days.includes(weekday));
  const dayOverrides = (state.overrides||[]).filter(o=>o.date===ds && o.type===adminType);
  let recurringHtml = '';
  if(recurring.length && !isBlocked){
    recurringHtml = recurring.map(r=>`
      <div class="row">
        <div><div class="main">${fmtTimeShort(r.start)} &ndash; ${fmtTimeShort(r.end)}</div><div class="sub">From your weekly pattern${r.generalArea?' &middot; '+r.generalArea:''}</div></div>
        <button class="chip-x" data-block-date="${ds}" title="Not available this day">&times;</button>
      </div>`).join('');
  } else if(recurring.length && isBlocked){
    recurringHtml = `
      <div class="row">
        <div><div class="main" style="color:var(--muted);">Not available this day</div><div class="sub">Your usual ${fmtTimeShort(recurring[0].start)}&ndash;${fmtTimeShort(recurring[0].end)} pattern is blocked just for ${fmtDate(ds)}</div></div>
        <button class="ghost small" data-unblock-date="${ds}">Undo</button>
      </div>`;
  }
  let overrideHtml = dayOverrides.length===0 ? '' : dayOverrides.map(o=>`
    <div class="row">
      <div><div class="main">${fmtTimeShort(o.start)} &ndash; ${fmtTimeShort(o.end)}</div><div class="sub">One-off, this date only${o.generalArea?' &middot; '+o.generalArea:''}</div></div>
      <button class="ghost small" data-remove-override="${o.id}">Remove</button>
    </div>`).join('');
  return `
    <div class="day-detail">
      <div class="day-detail-header">${fmtDate(ds)}</div>
      ${isHoliday ? `<div class="note">${jewishHolidayNames[ds]||'Jewish holiday'} &mdash; stays unavailable regardless of windows added here.</div>` : ''}
      ${recurringHtml || overrideHtml ? '' : `<div class="empty">No availability defined for this day.</div>`}
      ${recurringHtml}
      ${overrideHtml}
      ${!isHoliday ? `
      <div class="row2" style="margin-top:14px;">
        <div><label>Add one-off availability</label><input type="time" id="overrideStart" value="${overrideStart}" placeholder="Start"></div>
        <div><label>&nbsp;</label><input type="time" id="overrideEnd" value="${overrideEnd}" placeholder="End"></div>
      </div>
      ${adminType==='in-person' ? `
      <div style="margin-top:10px;"><label>General area <span class="note" style="display:inline;">(shown to clients before they book)</span></label><input type="text" id="overrideArea" value="${overrideArea}" placeholder="e.g. Boro Park"></div>
      <div style="margin-top:10px;"><label>Full address &amp; instructions <span class="note" style="display:inline;">(sent after booking)</span></label><textarea id="overrideAddress" placeholder="Address, parking, floor, buzzer code, etc.">${overrideAddress}</textarea></div>
      ` : ''}
      <div class="note" style="margin-top:6px;">Just for this date &mdash; doesn't change your regular weekly pattern.</div>
      <div style="margin-top:12px;"><button class="primary small" id="addOverrideBtn">Add for this date</button></div>
      ` : ''}
    </div>
  `;
}

function renderAdmin(){
  const todayDs = (()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();
  let rulesHtml = (state.availability[adminType]||[]).length===0 ? `<div class="empty">No weekly pattern set.</div>` : '';
  (state.availability[adminType]||[]).forEach(r=>{
    const beingEdited = editingRuleId === r.id;
    rulesHtml += `
      <div class="row"${beingEdited?' style="background:#FBF6EA;border-radius:6px;padding-left:10px;padding-right:10px;"':''}>
        <div><div class="main">${daysLabel(r.days)}</div><div class="sub">${fmtTimeShort(r.start)} &ndash; ${fmtTimeShort(r.end)}${r.generalArea?' &middot; '+r.generalArea:''}${beingEdited?' &middot; editing below':''}</div></div>
        <div style="display:flex;gap:8px;">
          <button class="ghost small" data-edit-rule="${r.id}">${beingEdited?'Cancel':'Edit'}</button>
          <button class="ghost small" data-remove-rule="${r.id}">Remove</button>
        </div>
      </div>`;
  });
  const upcomingOverrides = (state.overrides||[]).filter(o=>o.type===adminType && o.date>=todayDs).sort((a,b)=>a.date.localeCompare(b.date));
  let overridesListHtml = upcomingOverrides.length===0 ? `<div class="empty">No one-off dates added.</div>` : '';
  upcomingOverrides.forEach(o=>{
    overridesListHtml += `
      <div class="row">
        <div><div class="main">${fmtDate(o.date)}</div><div class="sub">${fmtTimeShort(o.start)} &ndash; ${fmtTimeShort(o.end)}</div></div>
        <button class="ghost small" data-remove-override="${o.id}">Remove</button>
      </div>`;
  });

  const clientById = {};
  state.clients.forEach(c=>{ clientById[c.id] = c; });

  // What became of the decline email. Shown on the session itself and kept there, because the
  // question "did he actually get it?" is asked hours later, long after the red banner from the
  // failed charge is gone. A bounce is the one that matters: it means nobody ever saw it, and
  // without this nothing in the app would ever say so.
  function emailStatusHtml(b){
    const e = b.declineEmail;
    if(!e) return '';
    const clock = ms => ms ? new Date(ms).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : '';
    const when = e.rank > 1 && e.statusAt ? ` at ${clock(e.statusAt)}` : '';
    return `
      <div class="email-status${e.problem?' bad':''}">
        <div class="email-status-label">Payment email</div>
        <div>Sent to ${esc(e.to||'')}${e.sentAt?` at ${clock(e.sentAt)}`:''}</div>
        <div class="email-status-state">${esc(e.status || 'Sent')}${when}</div>
        ${e.detail ? `<div style="margin-top:3px;">${esc(e.detail)}</div>` : ''}
        ${e.rank === 1 ? `<div class="note" style="margin-top:4px;">Delivery hasn't been reported back yet.</div>` : ''}
      </div>`;
  }

  function sessionCardHtml(b){
    const running = !!runningTimer[b.id];
    const isRecording = recordingStatus[b.id]==='recording';
    const segments = b.recordingSegments || [];
    const totalSegMin = segments.reduce((sum,s)=>sum+s.minutes,0);
    const fmtClock = iso => new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
    const segmentLogHtml = (b.type==='in-person' && segments.length) ? `
      <div class="note" style="margin-top:2px;margin-bottom:8px;">
        ${segments.map((s,i)=>`Part ${i+1}: ${fmtClock(s.start)}&ndash;${fmtClock(s.end)} (${s.minutes} min)`).join(' &middot; ')}
        ${segments.length>1 ? ` &middot; <strong>Total: ${totalSegMin} min</strong>` : ''}
      </div>
    ` : '';
    // Typing the length in belongs here, next to the timer, because this is where the length
    // lives. The timer is no use for a meeting held away from the laptop, and until now the only
    // way to correct it was the billing box further down — which Heshy reasonably didn't expect
    // to be editable.
    const editingTime = editingActualId === b.id;
    const timerBlock = `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap;">
        <span class="timer" id="timer-${b.id}">${String(Math.floor((timerDisplay[b.id]||0)/60)).padStart(2,'0')}:${String((timerDisplay[b.id]||0)%60).padStart(2,'0')}</span>
        ${running ? `<button class="ghost small" data-stop-timer="${b.id}">Stop</button>` : `<button class="${b.type==='in-person'?'primary':'ghost'} small" data-start-timer="${b.id}">Start</button>`}
        ${running ? '' : `<button class="ghost small" data-edit-actual="${b.id}">${editingTime?'Cancel':'Enter manually'}</button>`}
        <span class="note" style="margin:0;">${b.type==='in-person' ? 'Tracks time & records using your mic' : 'Tracks time only'}</span>
        ${b.type==='in-person' && isRecording ? `<span class="rec-indicator" title="Recording"><span class="rec-dot"></span>REC</span>` : ''}
      </div>
      ${editingTime ? `
      <div class="actual-entry">
        <label>How long did it actually run?</label>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <input type="text" data-actual-input="${b.id}" value="${b.actualMinutes ? esc(minutesToHm(b.actualMinutes)) : ''}" placeholder="1:30, 90m or 1.5" style="max-width:150px;">
          <button class="primary small" data-save-actual="${b.id}">Save</button>
          ${b.actualMinutes ? `<button class="ghost small" data-clear-actual="${b.id}">Clear</button>` : ''}
        </div>
        ${actualEntryError && actualEntryError.id===b.id ? `<div class="card-error">${esc(actualEntryError.message)}</div>` : `<div class="note" style="margin-top:6px;">Hours and minutes, however you like to write it.</div>`}
      </div>` : ''}
      ${segmentLogHtml}
      ${b.type==='in-person' && recordingStatus[b.id] ? `<div class="note" style="margin-bottom:8px;color:${recordingStatus[b.id]==='error'?'#A5433A':(recordingStatus[b.id]==='done'?'#2E5B27':'var(--muted)')};">${
        recordingStatus[b.id]==='recording' ? 'Recording…' :
        recordingStatus[b.id]==='processing' ? 'Processing notes… this can take a minute for longer sessions.' :
        recordingStatus[b.id]==='done' ? 'Notes ready below.' :
        'Recording failed: ' + (recordingError[b.id] || 'unknown error') + '. You can still add notes manually below.'
      }</div>` : ''}`;
    // Virtual: Join Meeting (video, opens tab + starts timer, notes via Gemini) or Call (phone,
    // opens your phone's own dialer + starts timer only — no notes possible over a real call).
    const meetBlock = b.type==='virtual' ? `
      ${b.meetLink ? `<label>Google Meet link</label><input type="text" value="${b.meetLink||''}" data-meet="${b.id}">` : ''}
      ${!running ? `<div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">
        ${b.meetLink ? `<button class="primary small" data-join-start="${b.id}">Join meeting &amp; start timer</button>` : ''}
        ${b.clientPhone ? `<button class="ghost small" data-call-start="${b.id}">Call ${esc(b.clientPhone)} &amp; start timer</button>` : ''}
      </div>` : ''}
    ` : '';
    const controls = `
        <div class="session-controls">
          ${!b.cancelled ? timerBlock : ''}
          ${!b.cancelled ? meetBlock : ''}
          ${(!b.cancelled && b.type==='virtual' && (b.calendarEventId || b.meetLink)) ? `<button class="ghost small" data-fetch-gemini="${b.id}" style="margin-bottom:14px;">Fetch notes &amp; duration</button><span id="gemini-msg-${b.id}" style="font-size:12.5px;margin-left:10px;"></span>` : ''}
          <label>Internal notes <span class="note" style="display:inline;">(private &mdash; only you see this)</span></label>
          <textarea class="notes-textarea" data-summary="${b.id}">${esc(b.summary)}</textarea>
          <label style="margin-top:14px;display:block;">Client-facing summary <span class="note" style="display:inline;">(shown to the client in their portal)</span></label>
          <button class="ghost small" data-copy-to-client="${b.id}" style="margin-bottom:8px;">Copy internal notes here</button>
          <textarea class="notes-textarea" data-clientsummary="${b.id}">${esc(b.clientSummary)}</textarea>
        </div>
    `;
    let action = '';
    if(b.status!=='charged' && !b.cancelled){
      const actualMins = b.actualMinutes || b.durationMin;
      // A comped session never gets charge controls. It used to show the normal amount box and
      // a Charge button, so one wrong click billed a free session in full.
      if(b.comped){
        action = `
        <div class="charge-row">
          <div class="note" style="margin-bottom:10px;">This session is complimentary${b.couponCode?` (<strong>${esc(b.couponCode)}</strong>)`:''} &mdash; no card will be charged.</div>
          <div class="row2">
            <div><label>Hours worked</label><input type="text" value="${Math.round((actualMins/60)*100)/100}" data-actual-hours="${b.id}"></div>
            <div><label>Amount</label><input type="text" value="0.00" disabled></div>
          </div>
          <div style="margin-top:12px;"><button class="primary small" data-charge="${b.id}">Complete at no charge</button></div>
        </div>`;
      } else {
      // Whether a length was ever actually recorded for this session, as opposed to the app
      // falling back to the booked length. An in-person meeting almost never has one: nobody
      // runs a stopwatch on their phone through a client meeting.
      const timeRecorded = typeof b.actualMinutes === 'number' && b.actualMinutes > 0;
      const basis = billingBasisChoice[b.id] || state.settings.billingMode || 'actual';
      // Mirrors computeCharge() in api/_lib/billing.js. In minimum mode the booked length is a
      // floor, not the answer: a session that ran over bills what it actually ran, which is what
      // clients are told. This used to return the booked length and quietly undercharge.
      const minsForBilling = basis==='minimum' ? Math.max(b.durationMin, actualMins) : actualMins;
      const hours = Math.round((minsForBilling/60)*100)/100;
      const rate = state.settings.hourlyRate || 500;
      const baseAmt = Math.round(hours*rate*100)/100;
      let defaultAmt = baseAmt;
      let discountNote = '';
      if(b.couponDiscount && b.couponDiscount.type==='percent'){
        defaultAmt = Math.round(baseAmt*(1-Math.min(100,b.couponDiscount.value)/100)*100)/100;
        discountNote = `<div class="note" style="margin-bottom:8px;">Coupon <strong>${esc(b.couponCode)}</strong>: ${b.couponDiscount.value}% off &mdash; ${money(baseAmt)} \u2192 ${money(defaultAmt)}</div>`;
      } else if(b.couponDiscount && (b.couponDiscount.type==='fixed'||b.couponDiscount.type==='amount')){
        defaultAmt = Math.max(0, Math.round((baseAmt-b.couponDiscount.value)*100)/100);
        discountNote = `<div class="note" style="margin-bottom:8px;">Coupon <strong>${esc(b.couponCode)}</strong>: ${money(b.couponDiscount.value)} off &mdash; ${money(baseAmt)} \u2192 ${money(defaultAmt)}</div>`;
      }
      // A value typed into the hours box wins over anything derived, so typing survives the
      // next render instead of snapping back.
      const draft = billedHoursDraft[b.id];
      const hoursShown = (draft !== undefined) ? draft : String(hours);
      const draftNum = parseFloat(hoursShown);
      const amtFromHours = !isNaN(draftNum) ? Math.round(draftNum*rate*100)/100 : null;
      const amt = (draft !== undefined && amtFromHours != null)
        ? amtFromHours
        : ((b.amount!=null) ? b.amount : defaultAmt);
      const overMin = basis==='minimum' && actualMins > b.durationMin;
      const minsShown = !isNaN(draftNum) ? Math.round(draftNum*60) : minsForBilling;
      action = `
        <div class="charge-row">
          ${timeRecorded
            ? `<div class="note" style="margin-bottom:8px;">Time recorded: <strong>${b.actualMinutes} min</strong> &middot; Booked for: <strong>${b.durationMin} min</strong></div>`
            : `<div class="charge-hint">No time was recorded for this session &mdash; the timer wasn't used. Type how long it ran below; it defaults to the ${b.durationMin} minutes booked.</div>`}
          ${discountNote}
          ${timeRecorded ? `
          <label>Bill for</label>
          <div class="type-toggle" style="margin-bottom:12px;">
            <div class="type-btn ${basis==='actual'?'active':''}" data-billing-basis="${b.id}" data-basis-value="actual">Actual time (${actualMins} min)</div>
            <div class="type-btn ${basis==='minimum'?'active':''}" data-billing-basis="${b.id}" data-basis-value="minimum">At least booked (${Math.max(b.durationMin, actualMins)} min)</div>
          </div>` : ''}
          ${overMin?`<div class="note" style="margin-bottom:8px;">Ran ${actualMins - b.durationMin} min over the booked length, so it bills the ${actualMins} min actually worked.</div>`:''}
          <div class="row2">
            <div><label>Hours to bill</label><input type="text" value="${esc(hoursShown)}" data-actual-hours="${b.id}" placeholder="e.g. 1.5 or 1:30"></div>
            <div><label>Amount to charge</label><input type="text" value="${amt.toFixed(2)}" data-amount="${b.id}"></div>
          </div>
          <div class="note" style="margin-top:6px;">${isNaN(draftNum) ? 'Enter hours as 1.5 or 1:30.' : `Billing <strong>${minsShown} ${minsShown===1?'minute':'minutes'}</strong> at ${money(rate)}/hour.`}</div>
          ${chargeProblem && chargeProblem.id===b.id ? `
            <div class="charge-problem">
              <div class="charge-problem-title">Not charged</div>
              <div class="charge-problem-msg">${esc(chargeProblem.message)}</div>
              ${chargeProblem.next?`<div class="charge-problem-next">${esc(chargeProblem.next)}</div>`:''}
              ${b.declineEmail ? ''
                : chargeProblem.emailed==='sent' ? `<div class="charge-problem-sent">The client has been emailed about it, with a link to update their card. You don't need to chase this.</div>`
                : chargeProblem.emailed==='already-sent' ? `<div class="charge-problem-sent">The client was already emailed about this, so they haven't been emailed again.</div>`
                : chargeProblem.emailed==='no-email' ? `<div class="charge-problem-next">No email address on file for this client, so they couldn't be told automatically.</div>`
                : chargeProblem.emailed==='failed' ? `<div class="charge-problem-next">The client could not be emailed about it &mdash; you may want to tell them yourself.</div>` : ''}
              <div class="note" style="margin-top:8px;">Nothing was taken from the card, and this session is still unbilled.</div>
            </div>` : ''}
          ${emailStatusHtml(b)}
          <div style="margin-top:12px;"><button class="primary small" data-charge="${b.id}">${chargeProblem && chargeProblem.id===b.id ? (chargeProblem.retryable ? 'Try the card again' : 'Charge anyway') : 'Charge and send receipt'}</button></div>
          <button class="ghost small danger-ghost" data-skip-charge="${b.id}" style="margin-top:8px;">Mark complete, don't charge</button>
        </div>`;
      }
    }
    const isRescheduling = reschedulingId === b.id;
    const rescheduleBlock = isRescheduling ? `
      <div class="reschedule-form" style="margin-top:10px;padding:12px;border:1px solid var(--line-strong);border-radius:6px;">
        <div class="row2">
          <div><label>New date</label><input type="date" data-reschedule-date="${b.id}" value="${b.date}"></div>
          <div><label>New time</label><input type="time" data-reschedule-time="${b.id}" value="${b.time}"></div>
        </div>
        <label style="margin-top:10px;">Format</label>
        <div class="type-toggle" style="margin-top:4px;">
          <div class="type-btn ${(rescheduleType[b.id]||b.type)==='virtual'?'active':''}" data-reschedule-type="${b.id}" data-type-value="virtual">Online</div>
          <div class="type-btn ${(rescheduleType[b.id]||b.type)==='in-person'?'active':''}" data-reschedule-type="${b.id}" data-type-value="in-person">In person</div>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button class="primary small" data-save-reschedule="${b.id}">Save new time</button>
          <button class="ghost small" data-cancel-reschedule="${b.id}">Cancel</button>
        </div>
      </div>
    ` : '';
    return `
      <div class="session">
        <div class="session-top">
          <div>
            <div class="session-name">${b.clientId?`<a class="client-link" data-view-client="${b.clientId}">${esc(b.clientName)}</a>`:esc(b.clientName)}</div>
            <div class="session-time-big">${fmtTime(b.time)}</div>
            <div class="session-meta">${fmtDate(b.date)} &middot; ${b.durationMin} min scheduled${b.actualMinutes?', '+b.actualMinutes+' min actual':''}</div>
            <div class="session-format">${b.durationMin===15?'Phone call':(b.type==='virtual'?'Video call':'In person')}${b.comped?' &middot; comped ('+esc(b.couponCode)+')':(b.couponDiscount?' &middot; '+couponDescribe({discountType:b.couponDiscount.type,discountValue:b.couponDiscount.value})+' ('+esc(b.couponCode)+')':'')}</div>
          </div>
          <span class="tag status-${b.status}">${b.status}</span>${b.cancelled ? ` <span class="tag status-cancelled">cancelled</span>` : ''}
        </div>
        ${b.cancelled ? `<div class="note" style="margin-top:8px;">Cancelled${b.status==='charged' ? ' \u2014 this session was already charged, so it stays visible to the client and in your records.' : ' \u2014 the time was freed up. Any notes or billing from before cancelling are kept below for your records.'}</div>` : ''}
        ${controls}
        ${action?`<div class="session-actions">${action}</div>`:''}
        ${!b.cancelled ? `
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="ghost small" data-reschedule-toggle="${b.id}">${isRescheduling?'Close':'Reschedule'}</button>
          <button class="ghost small danger-ghost" data-cancel-booking="${b.id}">Cancel booking</button>
        </div>
        ${rescheduleBlock}
        ` : ''}
      </div>`;
  }

  const nav = `
    <div class="admin-nav">
      <button class="admin-nav-btn ${adminView==='dashboard'?'active':''}" data-admin-view="dashboard">Dashboard</button>
      <button class="admin-nav-btn ${adminView==='schedule'?'active':''}" data-admin-view="schedule">Schedule</button>
      <button class="admin-nav-btn ${(adminView==='clients'||adminView==='client-detail')?'active':''}" data-admin-view="clients">Clients</button>
      <button class="admin-nav-btn ${adminView==='settings'?'active':''}" data-admin-view="settings">Settings</button>
    </div>
  `;

  let body = '';

  if(adminView==='dashboard'){
    const todayDs = dateStr(new Date());
    if(!selectedDashboardDate) selectedDashboardDate = todayDs;
    const weekAheadDs = dateStr(new Date(Date.now() + 7*86400000));

    const todayBookings = state.bookings.filter(b=>b.date===todayDs && !b.cancelled).sort((a,b)=>a.time.localeCompare(b.time));
    const upcomingBookings = state.bookings.filter(b=>b.date>=todayDs && !b.cancelled).sort((a,b)=> a.date===b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date));
    const thisWeekBookings = state.bookings.filter(b=>b.date>=todayDs && b.date<=weekAheadDs && !b.cancelled).sort((a,b)=> a.date===b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date));
    const unbilledBookings = state.bookings.filter(b=>b.date<todayDs && b.status==='scheduled' && !b.cancelled).sort((a,b)=> a.date===b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date));

    if(!dashboardStatFilter) dashboardStatFilter = 'today';

    const statsHtml = `
      <div class="dash-stats">
        <div class="dash-stat ${dashboardStatFilter==='today'?'dash-stat-active':''}" data-dash-filter="today">
          <div class="dash-stat-num">${todayBookings.length}</div>
          <div class="dash-stat-label">Today</div>
        </div>
        <div class="dash-stat ${dashboardStatFilter==='week'?'dash-stat-active':''}" data-dash-filter="week">
          <div class="dash-stat-num">${thisWeekBookings.length}</div>
          <div class="dash-stat-label">Next 7 days</div>
        </div>
        <div class="dash-stat ${unbilledBookings.length ? 'dash-stat-alert' : ''} ${dashboardStatFilter==='billing'?'dash-stat-active':''}" data-dash-filter="billing">
          <div class="dash-stat-num">${unbilledBookings.length}</div>
          <div class="dash-stat-label">Needs billing</div>
        </div>
        <div class="dash-stat ${dashboardStatFilter==='upcoming'?'dash-stat-active':''}" data-dash-filter="upcoming">
          <div class="dash-stat-num">${upcomingBookings.length}</div>
          <div class="dash-stat-label">Upcoming total</div>
        </div>
      </div>
    `;

    const filterMeta = {
      today:    { title: 'Today',          caption: '', list: todayBookings },
      week:     { title: 'Next 7 days',    caption: '', list: thisWeekBookings },
      billing:  { title: 'Needs billing',  caption: 'Sessions whose date has already passed, that you haven\u2019t charged or marked complete yet. Charging or comping a session removes it from this list.', list: unbilledBookings },
      upcoming: { title: 'Upcoming total', caption: 'Every session booked from today onward.', list: upcomingBookings }
    };
    const active = filterMeta[dashboardStatFilter];
    const filteredListHtml = active.list.length===0
      ? `<div class="empty">Nothing here.</div>`
      : active.list.map(b=>sessionCardHtml(b)).join('');

function mountCardElementIfNeeded(){

// Portal card update uses its own separate Elements group/card field (independent from the
// booking flow's), since they're mounted at different times into different DOM nodes.
let portalElements = null;
let portalCardElement = null;
function mountPortalCardElementIfNeeded(){
  const mount = document.getElementById('portal-card-element');
  if(!mount || !portalShowCardForm) return;
  if(mount.childElementCount === 0){
    portalElements = stripe.elements();
    portalCardElement = portalElements.create('card', { style: { base: { fontSize: '14.5px', fontFamily: 'Inter, sans-serif', color: '#111111' } } });
    portalCardElement.mount('#portal-card-element');
    portalCardElement.on('change', (e)=>{
      const errEl = document.getElementById('portal-card-error');
      if(errEl) errEl.textContent = e.error ? e.error.message : '';
    });
  }
}
async function savePortalCard(){
  if(!portalCardElement) return;
  portalCardSaving = true; portalCardError = ''; render();
  try{
    // The portal session identifies who this is, so the server makes the SetupIntent against
    // their own Stripe customer. The page never sees or sends a customer id.
    const setupRes = await fetch('/api/portal-lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'start-card-update', token: portalToken })
    });
    const setupData = await setupRes.json();
    if(setupData.error){ portalCardError = setupData.error; portalCardSaving = false; render(); return; }
    const result = await stripe.confirmCardSetup(setupData.clientSecret, { payment_method: { card: portalCardElement } });
    if(result.error){ portalCardError = result.error.message; portalCardSaving = false; render(); return; }
    const confirmRes = await fetch('/api/portal-lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'confirm-card-update', token: portalToken, paymentMethodId: result.setupIntent.payment_method })
    });
    const confirmData = await confirmRes.json();
    if(confirmData.error){ portalCardError = confirmData.error; portalCardSaving = false; render(); return; }
    portalCardSaving = false; portalShowCardForm = false; portalCardError = '';
    render();
  }catch(e){
    portalCardError = 'Something went wrong. Please try again.';
    portalCardSaving = false; render();
  }
}

// The booking controls are divs. Without this they cannot be reached by keyboard at all, so
// anyone not using a mouse simply cannot book.
function makeControlsFocusable(){
  // The real class names used by the booking flow: format/duration buttons, calendar days
  // (only the ones that can actually be picked), time slots, and the Quick Check-in card.
  const selectors = '.type-btn, .cal-cell-sm[data-day], .time-cell[data-start-time], .qci-card';
  document.querySelectorAll(selectors).forEach(el=>{
    if(el.getAttribute('role') === 'button') return;
    el.setAttribute('role','button');
    el.setAttribute('tabindex','0');
    const selected = el.classList.contains('active') || el.classList.contains('selected');
    el.setAttribute('aria-pressed', selected ? 'true' : 'false');
    el.addEventListener('keydown', ev=>{
      if(ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar'){
        ev.preventDefault();
        el.click();
      }
    });
  });
}

    document.querySelectorAll('[data-client-wg-file]').forEach(el=>{
      el.onchange = ()=>{
        const id = el.getAttribute('data-client-wg-file');
        const file = el.files[0];
        if(!file) return;
        const client = state.clients.find(x=>x.id===id);
        if(!client) return;
        const savedMsg = $('client-wg-file-saved-'+id);
        if(savedMsg) savedMsg.textContent = 'Uploading\u2026';
        const reader = new FileReader();
        reader.onload = async ()=>{
          try{
            const uploadRes = await fetch('/api/admin-data', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
              body: JSON.stringify({ action: 'upload-pdf', fileName: file.name, fileDataUrl: reader.result })
            });
            const uploadData = await uploadRes.json();
            if(uploadData.error){ if(savedMsg) savedMsg.textContent = uploadData.error; return; }
            client.wgPdfData = uploadData.url;
            client.wgPdfName = file.name;
            const ok = await saveState();
            if(ok){ render(); }
            else if(savedMsg) savedMsg.textContent = 'Could not save \u2014 try logging out and back in.';
          }catch(e){
            if(savedMsg) savedMsg.textContent = 'Upload failed: ' + e.message;
          }
        };
        reader.readAsDataURL(file);
      };
    });
    const clientSearchEl = $('client-search');
    if(clientSearchEl){
      clientSearchEl.oninput = e=>{ clientSearch = e.target.value; render(); const el2 = $('client-search'); if(el2){ el2.focus(); el2.setSelectionRange(el2.value.length, el2.value.length); } };
    }
    document.querySelectorAll('[data-block-client]').forEach(el=>{ el.onclick = (e)=>{ e.stopPropagation(); setClientBlocked(el.getAttribute('data-block-client'), true); }; });
    document.querySelectorAll('[data-unblock-client]').forEach(el=>{ el.onclick = (e)=>{ e.stopPropagation(); setClientBlocked(el.getAttribute('data-unblock-client'), false); }; });
  }
}

// A client arriving from the "take the assessment" email: the link carries a token naming only
// their own record, so they start straight away, without signing in or typing anything.
// --- paying from a link -------------------------------------------------------------------------
// A client opens #pay/<token> and pays the amount owed themselves. The amount is never read from
// the link: the server works it out from the booking, so the page can't be edited into a
// different price and can't show a stale figure if the length was corrected after the email.
let payToken = null, payInfo = null, payStage = 'loading', payError = '', payBusy = false, payCard = null;

function openPayLink(){
  const m = (window.location.hash || '').match(/^#pay\/([a-f0-9]{24,})$/i);
  if(!m) return false;
  payToken = m[1];
  view = 'pay'; payStage = 'loading';
  render();
  fetch('/api/create-setup-intent', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action:'pay-info', token: payToken })
  }).then(r=>r.json()).then(info=>{
    payInfo = info;
    payStage = (info && info.state === 'owed') ? 'ready' : 'nothing';
    render();
    if(payStage === 'ready') mountPayCard();
  }).catch(()=>{ payStage='nothing'; payInfo={state:'unknown'}; render(); });
  return true;
}

// Every render replaces the DOM, so the Stripe field has to be put back into the new node —
// checking the node itself rather than a flag, the same way the portal's card field does.
let payElements = null;
function mountPayCard(){
  const host = document.getElementById('pay-card');
  if(!host || host.childElementCount > 0) return;
  payElements = stripe.elements();
  payCard = payElements.create('card', { style: { base: { fontSize:'14.5px', fontFamily:'Inter, sans-serif', color:'#111111' } } });
  payCard.mount('#pay-card');
  payCard.on('change', ev => {
    const el = document.getElementById('pay-card-error');
    if(el) el.textContent = ev.error ? ev.error.message : '';
  });
}

async function submitPayment(){
  if(payBusy || !payCard) return;
  payBusy = true; payError = ''; render(); mountPayCard();
  try{
    const r = await fetch('/api/create-setup-intent', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'pay-intent', token: payToken })
    });
    const data = await r.json();
    if(data.error){ payError = data.error; payBusy = false; render(); mountPayCard(); return; }

    // The cardholder is here, so the bank may ask them to confirm — which is the entire reason
    // this link exists. confirmCardPayment handles that step.
    const result = await stripe.confirmCardPayment(data.clientSecret, {
      payment_method: { card: payCard }
    });
    if(result.error){
      payError = result.error.message || 'That payment did not go through.';
      payBusy = false; render(); mountPayCard(); return;
    }
    // Reported to the server, which re-reads the payment from Stripe rather than taking the
    // browser's word for it.
    await fetch('/api/create-setup-intent', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'pay-confirm', token: payToken, paymentIntentId: result.paymentIntent.id })
    });
    payStage = 'done'; payBusy = false; payCard = null; payElements = null; render();
  }catch(e){
    payError = 'Something went wrong. Nothing has been charged — please try again.';
    payBusy = false; render(); mountPayCard();
  }
}

function renderPay(){
  const amt = payInfo && payInfo.amount != null ? money(payInfo.amount) : '';
  let body;
  if(payStage === 'loading'){
    body = `<div class="note">Loading…</div>`;
  } else if(payStage === 'done'){
    body = `
      <div class="pay-done">
        <div class="pay-done-tick">&check;</div>
        <div class="pay-done-title">Paid${amt?' — '+amt:''}</div>
        <div class="note" style="margin-top:8px;">A receipt is on its way to you. Thank you.</div>
      </div>`;
  } else if(payStage === 'nothing'){
    const s = payInfo?.state;
    const line = s === 'paid' ? "This session has already been paid. Nothing more is owed."
      : s === 'cancelled' ? "This session was cancelled, so there's nothing to pay."
      : s === 'comped' || s === 'nothing-owed' ? "There's nothing owed on this session."
      : "This payment link has expired or isn't valid any more.";
    body = `<div class="note" style="line-height:1.7;">${line}</div>
            <div class="note" style="margin-top:12px;">If that doesn't sound right, just reply to the email and Heshy will sort it out.</div>`;
  } else {
    body = `
      <div class="pay-amount-block">
        <div class="pay-amount-label">Amount due</div>
        <div class="pay-amount">${amt}</div>
        <div class="note" style="margin-top:6px;">${payInfo.minutes} minutes${payInfo.date?' &middot; '+fmtDate(payInfo.date):''}${payInfo.type==='virtual'?' &middot; Video call':(payInfo.type?' &middot; In person':'')}</div>
      </div>
      <label style="margin-top:20px;display:block;">Card details</label>
      <div id="pay-card" class="card-box"></div>
      <div id="pay-card-error" class="card-error"></div>
      ${payError?`<div class="card-error">${esc(payError)}</div>`:''}
      <button class="primary" id="pay-submit" style="margin-top:16px;width:100%;" ${payBusy?'disabled':''}>${payBusy?'Paying…':'Pay '+amt}</button>
      <div class="note" style="margin-top:12px;text-align:center;">Your bank may ask you to confirm this payment. Payments are handled by Stripe; the card details never reach this site.</div>`;
  }
  return `
    <div class="topbar"><div class="brand">Clarity Session w/ Heshy</div></div>
    <h1>${payStage==='done' ? 'Thank you' : 'Pay for your session'}</h1>
    ${payInfo && payInfo.name && payStage==='ready' ? `<div class="note" style="margin-bottom:18px;">Hi ${esc(payInfo.name)} — here's what's outstanding.</div>` : ''}
    ${body}
  `;
}

function openStrengthsFromLink(){
  try{
    const t = new URLSearchParams(window.location.search).get('strengths');
    if(!t) return false;
    history.replaceState(null, '', window.location.pathname + window.location.hash);
    openStrengths('client', t);
    return true;
  }catch(e){ return false; }
}

// Arriving from a "set your password" email.
async function openPasswordSetupFromLink(){
  try{
    const t = new URLSearchParams(window.location.search).get('setpassword');
    if(!t) return false;
    history.replaceState(null, '', window.location.pathname);
    const r = await fetch('/api/portal-lookup?action=check-setup-token&token='+encodeURIComponent(t));
    const d = await r.json();
    view = 'portal';
    if(!d.valid){ portalMode='password'; portalError='That link has expired. Please ask for a new one.'; render(); return true; }
    portalSetupToken = t; portalSetupName = d.name || ''; portalSetupHasPassword = !!d.hasPassword;
    portalMode = 'setup'; portalError=''; render();
    return true;
  }catch(e){ return false; }
}

// Arriving back from Google. The session token comes through the fragment, which never reaches
// a server, and is cleared from the address bar straight away.
function openPortalFromGoogle(){
  try{
    const h = window.location.hash || '';
    const okMatch = h.match(/portal-token=([^&]+)/);
    const errMatch = h.match(/portal-error=([^&]+)/);
    if(!okMatch && !errMatch) return false;
    history.replaceState(null, '', window.location.pathname + '#portal');
    view = 'portal';
    if(errMatch){
      const why = decodeURIComponent(errMatch[1]);
      portalError = why === 'google-nomatch'
        ? "That Google account isn't on file. Try the email address Heshy has for you, or ask him to check."
        : "Google sign-in didn't complete. Please try again, or use your password.";
      render();
      return true;
    }
    portalToken = decodeURIComponent(okMatch[1]);
    try{ localStorage.setItem('heshyPortalToken', portalToken); }catch(e){}
    resumePortalSession();
    return true;
  }catch(e){ return false; }
}

if(!openPayLink()){
  if(!openStrengthsFromLink()){
    if(openPortalFromGoogle()){ /* resuming that session */ }
    else { openPasswordSetupFromLink().then(handled => { if(!handled) loadState(); }); }
  }
}

// Clicking the link in an email loads the page fresh, so the check above catches it. Arriving
// at #pay/... without a reload — pasting the link into a tab already on the site, or using the
// back button — changes only the hash, and nothing would happen at all.
window.addEventListener('hashchange', () => {
  if(view !== 'pay' && /^#pay\/[a-f0-9]{24,}$/i.test(window.location.hash || '')) openPayLink();
});
</script>
