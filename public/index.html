  const portalBookAgainBtn = $('portal-book-again'); if(portalBookAgainBtn) portalBookAgainBtn.onclick = portalBookAgain;
  document.querySelectorAll('[data-go-portal]').forEach(el=>{ el.onclick = (e)=>{ e.preventDefault(); goToPortal(); }; });
  const portalLogoutBtn = $('portal-logout-btn'); if(portalLogoutBtn) portalLogoutBtn.onclick = portalLogout;
  const portalUpdateCardBtn = $('portal-update-card-btn'); if(portalUpdateCardBtn) portalUpdateCardBtn.onclick = ()=>{ portalShowCardForm = true; portalCardError=''; render(); };
  const portalCancelCardBtn = $('portal-cancel-card-btn'); if(portalCancelCardBtn) portalCancelCardBtn.onclick = ()=>{ portalShowCardForm = false; portalCardError=''; render(); };
  const portalSaveCardBtn = $('portal-save-card-btn'); if(portalSaveCardBtn) portalSaveCardBtn.onclick = savePortalCard;
  mountPortalCardElementIfNeeded();

  if(view==='admin' && !adminUnlocked) return;
  if(view==='portal') return;

  if(view==='client'){
    document.querySelectorAll('[data-start-time]').forEach(el=>{ el.onclick = ()=>selectStartTime(el.getAttribute('data-start-time')); });
    document.querySelectorAll('[data-duration]').forEach(el=>{ el.onclick = ()=>selectDuration(Number(el.getAttribute('data-duration'))); });
    document.querySelectorAll('[data-day]').forEach(el=>{ el.onclick = ()=>selectDay(el.getAttribute('data-day')); });
    document.querySelectorAll('[data-type]').forEach(el=>{ el.onclick = ()=>selectType(el.getAttribute('data-type')); });
    const to2 = $('toStep2'); if(to2) to2.onclick = ()=>goStep(2);
    const back1 = $('backTo1'); if(back1) back1.onclick = ()=>goStep(1);
    const map = {'f-name':'name','f-email':'email','f-phone':'phone'};
    Object.keys(map).forEach(id=>{
      const el = $(id);
      if(el) el.oninput = e=>{
        clientForm[map[id]] = e.target.value;
        updateConfirmButtonState();
      };
    });
    const emailEl = $('f-email'); if(emailEl) emailEl.onblur = onEmailBlur;
    const couponEl = $('f-coupon'); if(couponEl) couponEl.oninput = e=> clientForm.couponCode = e.target.value;
    attachIntakeRegionHandlers();
    const conf = $('confirmBtn'); if(conf) conf.onclick = confirmBooking;
    mountCardElementIfNeeded();
  } else {

    document.querySelectorAll('[data-admin-type]').forEach(el=>{ el.onclick = ()=>selectAdminType(el.getAttribute('data-admin-type')); });
    const toggleSchedBtn = $('toggleScheduleEditor'); if(toggleSchedBtn) toggleSchedBtn.onclick = ()=>{ showScheduleEditor = !showScheduleEditor; render(); };
    document.querySelectorAll('[data-admin-view]').forEach(el=>{ el.onclick = ()=>{ adminView = el.getAttribute('data-admin-view'); render(); }; });
    document.querySelectorAll('[data-view-client]').forEach(el=>{
      el.onclick = ()=>{ adminView = 'client-detail'; viewingClientId = el.getAttribute('data-view-client'); render(); };
    });
    document.querySelectorAll('[data-rule-day]').forEach(el=>{ el.onclick = ()=>toggleRuleDay(Number(el.getAttribute('data-rule-day'))); });
    document.querySelectorAll('[data-remove-rule]').forEach(el=>{ el.onclick = ()=>removeRule(el.getAttribute('data-remove-rule')); });
    const nrStart=$('nr-start'), nrEnd=$('nr-end'), nrArea=$('nr-area'), nrAddress=$('nr-address');
    if(nrStart) nrStart.oninput = e=> newRule.start = e.target.value;
    if(nrEnd) nrEnd.oninput = e=> newRule.end = e.target.value;
    if(nrArea) nrArea.oninput = e=> newRule.generalArea = e.target.value;
    if(nrAddress) nrAddress.oninput = e=> newRule.address = e.target.value;
    const addRuleBtn = $('addRuleBtn'); if(addRuleBtn) addRuleBtn.onclick = addRule;
    document.querySelectorAll('[data-cal-day]').forEach(el=>{
      el.onclick = ()=>{ selectedScheduleDate = el.getAttribute('data-cal-day'); render(); };
    });
    const calPrev = $('calPrevMonth');
    if(calPrev) calPrev.onclick = ()=>{ scheduleCalMonth = new Date(scheduleCalMonth.getFullYear(), scheduleCalMonth.getMonth()-1, 1); render(); };
    const calNext = $('calNextMonth');
    if(calNext) calNext.onclick = ()=>{ scheduleCalMonth = new Date(scheduleCalMonth.getFullYear(), scheduleCalMonth.getMonth()+1, 1); render(); };
    document.querySelectorAll('[data-dash-day]').forEach(el=>{
      el.onclick = ()=>{ selectedDashboardDate = el.getAttribute('data-dash-day'); render(); };
    });
    document.querySelectorAll('[data-dash-filter]').forEach(el=>{
      el.onclick = ()=>{ dashboardStatFilter = el.getAttribute('data-dash-filter'); render(); };
    });
    const dashCalPrev = $('dashCalPrevMonth');
    if(dashCalPrev) dashCalPrev.onclick = ()=>{ dashboardCalMonth = new Date(dashboardCalMonth.getFullYear(), dashboardCalMonth.getMonth()-1, 1); render(); };
    const dashCalNext = $('dashCalNextMonth');
    if(dashCalNext) dashCalNext.onclick = ()=>{ dashboardCalMonth = new Date(dashboardCalMonth.getFullYear(), dashboardCalMonth.getMonth()+1, 1); render(); };
    const ovStartEl = $('overrideStart'), ovEndEl = $('overrideEnd'), ovAreaEl = $('overrideArea'), ovAddrEl = $('overrideAddress');
    if(ovStartEl) ovStartEl.oninput = e=> overrideStart = e.target.value;
    if(ovEndEl) ovEndEl.oninput = e=> overrideEnd = e.target.value;
    if(ovAreaEl) ovAreaEl.oninput = e=> overrideArea = e.target.value;
    if(ovAddrEl) ovAddrEl.oninput = e=> overrideAddress = e.target.value;
    const addOverrideBtn = $('addOverrideBtn');
    if(addOverrideBtn) addOverrideBtn.onclick = async ()=>{
      if(!selectedScheduleDate || !overrideStart || !overrideEnd) return;
      if(!state.overrides) state.overrides = [];
      const ov = { id: uid(), date: selectedScheduleDate, start: overrideStart, end: overrideEnd, type: adminType };
      if(adminType==='in-person'){ ov.generalArea = overrideArea.trim(); ov.address = overrideAddress.trim(); }
      state.overrides.push(ov);
      overrideStart = ''; overrideEnd = ''; overrideArea = ''; overrideAddress = '';
      await saveState(); render();
    };
    document.querySelectorAll('[data-remove-override]').forEach(el=>{
      el.onclick = async ()=>{
        state.overrides = (state.overrides||[]).filter(o=>o.id!==el.getAttribute('data-remove-override'));
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-block-date]').forEach(el=>{
      el.onclick = async ()=>{
        const date = el.getAttribute('data-block-date');
        if(!state.blockedDates) state.blockedDates = [];
        if(!state.blockedDates.some(bl=>bl.date===date && bl.type===adminType)){
          state.blockedDates.push({ id: uid(), date, type: adminType });
        }
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-unblock-date]').forEach(el=>{
      el.onclick = async ()=>{
        const date = el.getAttribute('data-unblock-date');
        state.blockedDates = (state.blockedDates||[]).filter(bl=>!(bl.date===date && bl.type===adminType));
        await saveState(); render();
      };
    });
    const meetEl=$('set-meet'), locEl=$('set-location'), intakeEl=$('set-intake'), dur60El=$('dur-60'), dur120El=$('dur-120');
    const billingActualBtn = $('billing-mode-actual'), billingMinimumBtn = $('billing-mode-minimum');
    if(billingActualBtn) billingActualBtn.onclick = ()=>{ state.settings.billingMode = 'actual'; render(); };
    if(billingMinimumBtn) billingMinimumBtn.onclick = ()=>{ state.settings.billingMode = 'minimum'; render(); };
    const saveSettingsBtn = $('save-settings-btn');
    if(saveSettingsBtn){
      saveSettingsBtn.onclick = async ()=>{
        state.settings.meetLink = meetEl ? meetEl.value : state.settings.meetLink;
        state.settings.location = locEl ? locEl.value : state.settings.location;
        state.settings.intakeQuestions = intakeEl ? intakeEl.value.split('\n').map(s=>s.trim()).filter(Boolean) : state.settings.intakeQuestions;
        const chosenDurations = [];
        if(dur60El && dur60El.checked) chosenDurations.push(60);
        if(dur120El && dur120El.checked) chosenDurations.push(120);
        state.settings.durationOptions = chosenDurations.length ? chosenDurations : [60];
        saveSettingsBtn.disabled = true; saveSettingsBtn.textContent = 'Saving…';
        const ok = await saveState();
        saveSettingsBtn.disabled = false; saveSettingsBtn.textContent = 'Save settings';
        const msg = $('settings-save-msg');
        if(msg){
          msg.style.color = ok ? '#2E5B27' : '#A5433A';
          msg.textContent = ok ? 'Saved.' : 'Could not save — try logging out and back in.';
          setTimeout(()=>{ if(msg) msg.textContent=''; }, 4000);
        }
      };
    }
    const couponCodeEl=$('coupon-code'), couponDescEl=$('coupon-desc'), couponMaxEl=$('coupon-max');
    if(couponCodeEl) couponCodeEl.oninput = e=> newCoupon.code = e.target.value;
    if(couponDescEl) couponDescEl.oninput = e=> newCoupon.description = e.target.value;
    if(couponMaxEl) couponMaxEl.oninput = e=> newCoupon.maxUses = e.target.value;
    const addCouponBtn = $('addCouponBtn'); if(addCouponBtn) addCouponBtn.onclick = addCoupon;
    document.querySelectorAll('[data-remove-coupon]').forEach(el=>{ el.onclick = ()=>removeCoupon(el.getAttribute('data-remove-coupon')); });

    document.querySelectorAll('[data-mark-complete]').forEach(el=>{ el.onclick = ()=>markComplete(el.getAttribute('data-mark-complete')); });
    document.querySelectorAll('[data-charge]').forEach(el=>{ el.onclick = ()=>chargeAndReceipt(el.getAttribute('data-charge')); });
    document.querySelectorAll('[data-actual-hours]').forEach(el=>{
      el.oninput = ()=>{
        const id = el.getAttribute('data-actual-hours');
        const amtEl = document.querySelector(`[data-amount="${id}"]`);
        const hours = parseFloat(el.value);
        if(amtEl && !isNaN(hours)){
          amtEl.value = (Math.round(hours*500*100)/100).toFixed(2);
        }
      };
    });
    document.querySelectorAll('[data-skip-charge]').forEach(el=>{ el.onclick = ()=>skipCharge(el.getAttribute('data-skip-charge')); });
    document.querySelectorAll('[data-billing-basis]').forEach(el=>{
      el.onclick = ()=>{
        billingBasisChoice[el.getAttribute('data-billing-basis')] = el.getAttribute('data-basis-value');
        render();
      };
    });
    document.querySelectorAll('[data-cancel-booking]').forEach(el=>{ el.onclick = ()=>cancelBooking(el.getAttribute('data-cancel-booking')); });
    document.querySelectorAll('[data-reschedule-toggle]').forEach(el=>{
      el.onclick = ()=>{
        const id = el.getAttribute('data-reschedule-toggle');
        reschedulingId = reschedulingId === id ? null : id;
        render();
      };
    });
    document.querySelectorAll('[data-cancel-reschedule]').forEach(el=>{ el.onclick = ()=>{ reschedulingId = null; render(); }; });
    document.querySelectorAll('[data-reschedule-type]').forEach(el=>{
      el.onclick = ()=>{
        rescheduleType[el.getAttribute('data-reschedule-type')] = el.getAttribute('data-type-value');
        render();
      };
    });
    document.querySelectorAll('[data-save-reschedule]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-save-reschedule');
        const dateEl = document.querySelector(`[data-reschedule-date="${id}"]`);
        const timeEl = document.querySelector(`[data-reschedule-time="${id}"]`);
        const newDate = dateEl ? dateEl.value : '';
        const newTime = timeEl ? timeEl.value : '';
        const existing = state.bookings.find(x=>x.id===id);
        const newType = rescheduleType[id] || (existing ? existing.type : undefined);
        if(!newDate || !newTime){ alert('Pick a date and time.'); return; }
        el.disabled = true; el.textContent = 'Saving…';
        try{
          const res = await fetch('/api/admin-data', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
            body: JSON.stringify({ action: 'reschedule-booking', bookingId: id, newDate, newTime, newType })
          });
          const data = await res.json();
          if(data.error){ alert('Reschedule failed: ' + data.error); el.disabled = false; el.textContent = 'Save new time'; return; }
          reschedulingId = null;
          delete rescheduleType[id];
          await loadAdminState();
          render();
        }catch(e){
          alert('Reschedule failed: ' + e.message);
          el.disabled = false; el.textContent = 'Save new time';
        }
      };
    });
    document.querySelectorAll('[data-start-timer]').forEach(el=>{
      el.onclick = ()=>{
        const id = el.getAttribute('data-start-timer');
        const b = state.bookings.find(x=>x.id===id);
        startTimer(id);
        // In-person: one physical event, so Start naturally drives both timing and recording together.
        // Virtual keeps recording as its own separate action (needs the tab-share consent step).
        if(b && b.type === 'in-person') startRecording(id, 'in-person');
      };
    });
    document.querySelectorAll('[data-join-start]').forEach(el=>{
      el.onclick = ()=>{
        const id = el.getAttribute('data-join-start');
        const b = state.bookings.find(x=>x.id===id);
        if(b && b.meetLink) window.open(b.meetLink, '_blank');
        startTimer(id);
      };
    });
    document.querySelectorAll('[data-fetch-gemini]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-fetch-gemini');
        const msg = document.getElementById('gemini-msg-'+id);
        el.disabled = true; el.textContent = 'Fetching…';
        try{
          const res = await fetch('/api/fetch-gemini-notes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
            body: JSON.stringify({ bookingId: id })
          });
          const data = await res.json();
          if(data.error){
            if(msg){ msg.style.color = '#A5433A'; msg.textContent = data.error; }
            el.disabled = false; el.textContent = 'Fetch notes & duration';
            return;
          }
          await loadAdminState();
          render();
          const msg2 = document.getElementById('gemini-msg-'+id);
          if(msg2 && data.note){ msg2.style.color = data.foundDuration ? '#2E5B27' : '#6E6E6E'; msg2.textContent = data.note; }
        }catch(e){
          if(msg){ msg.style.color = '#A5433A'; msg.textContent = 'Something went wrong.'; }
          el.disabled = false; el.textContent = 'Fetch notes & duration';
        }
      };
    });
    document.querySelectorAll('[data-stop-timer]').forEach(el=>{
      el.onclick = ()=>{
        const id = el.getAttribute('data-stop-timer');
        stopTimer(id);
        if(activeRecordings[id]) stopRecording(id);
      };
    });
    document.querySelectorAll('[data-meet]').forEach(el=>{ el.onchange = ()=>updateBooking(el.getAttribute('data-meet'), { meetLink: el.value }); });
    document.querySelectorAll('[data-summary]').forEach(el=>{ el.onchange = ()=>updateBooking(el.getAttribute('data-summary'), { summary: el.value }); });
    document.querySelectorAll('[data-clientsummary]').forEach(el=>{ el.onchange = ()=>updateBooking(el.getAttribute('data-clientsummary'), { clientSummary: el.value }); });
    document.querySelectorAll('[data-copy-to-client]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-copy-to-client');
        const internalEl = document.querySelector(`[data-summary="${id}"]`);
        const clientEl = document.querySelector(`[data-clientsummary="${id}"]`);
        if(!internalEl || !clientEl) return;
        clientEl.value = internalEl.value;
        await updateBooking(id, { clientSummary: internalEl.value });
      };
    });
    document.querySelectorAll('[data-view-client-profile]').forEach(el=>{
      el.onclick = ()=>{ adminView = 'client-detail'; viewingClientId = el.getAttribute('data-view-client-profile'); render(); };
    });
    document.querySelectorAll('[data-back-to-clients]').forEach(el=>{
      el.onclick = ()=>{ adminView = 'clients'; render(); };
    });
    document.querySelectorAll('[data-client-notes]').forEach(el=>{
      el.onblur = async ()=>{
        const id = el.getAttribute('data-client-notes');
        const client = state.clients.find(x=>x.id===id);
        if(!client) return;
        if(client.notes === el.value) return; // nothing changed
        client.notes = el.value;
        const savedMsg = $('client-notes-saved-'+id);
        if(savedMsg) savedMsg.textContent = 'Saving\u2026';
        const ok = await saveState();
        if(savedMsg) savedMsg.textContent = ok ? 'Saved' : 'Could not save \u2014 try logging out and back in.';
        if(ok && savedMsg) setTimeout(()=>{ if(savedMsg) savedMsg.textContent=''; }, 2000);
      };
    });
    document.querySelectorAll('[data-client-wg-letters]').forEach(el=>{
      el.onblur = async ()=>{
        const id = el.getAttribute('data-client-wg-letters');
        const client = state.clients.find(x=>x.id===id);
        if(!client) return;
        const newVal = el.value.toUpperCase().trim();
        if((client.wgLetters||'') === newVal) return;
        client.wgLetters = newVal;
        const savedMsg = $('client-wg-letters-saved-'+id);
        if(savedMsg) savedMsg.textContent = 'Saving\u2026';
        const ok = await saveState();
        if(ok){ render(); } // re-render to refresh the big badge in the header
        else if(savedMsg) savedMsg.textContent = 'Could not save \u2014 try logging out and back in.';
      };
    });
    document.querySelectorAll('[data-client-wg-file]').forEach(el=>{
      el.onchange = ()=>{
        const id = el.getAttribute('data-client-wg-file');
        const file = el.files[0];
        if(!file) return;
        const client = state.clients.find(x=>x.id===id);
        if(!client) return;
        const savedMsg = $('client-wg-file-saved-'+id);
        if(savedMsg) savedMsg.textContent = 'Uploading\u2026';
        const reader = new FileReader();
        reader.onload = async ()=>{
          try{
            const uploadRes = await fetch('/api/admin-data', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
              body: JSON.stringify({ action: 'upload-pdf', fileName: file.name, fileDataUrl: reader.result })
            });
            const uploadData = await uploadRes.json();
            if(uploadData.error){ if(savedMsg) savedMsg.textContent = uploadData.error; return; }
            client.wgPdfData = uploadData.url;
            client.wgPdfName = file.name;
            const ok = await saveState();
            if(ok){ render(); }
            else if(savedMsg) savedMsg.textContent = 'Could not save \u2014 try logging out and back in.';
          }catch(e){
            if(savedMsg) savedMsg.textContent = 'Upload failed: ' + e.message;
          }
        };
        reader.readAsDataURL(file);
      };
    });
    const clientSearchEl = $('client-search');
    if(clientSearchEl){
      clientSearchEl.oninput = e=>{ clientSearch = e.target.value; render(); const el2 = $('client-search'); if(el2){ el2.focus(); el2.setSelectionRange(el2.value.length, el2.value.length); } };
    }
    document.querySelectorAll('[data-block-client]').forEach(el=>{ el.onclick = (e)=>{ e.stopPropagation(); setClientBlocked(el.getAttribute('data-block-client'), true); }; });
    document.querySelectorAll('[data-unblock-client]').forEach(el=>{ el.onclick = (e)=>{ e.stopPropagation(); setClientBlocked(el.getAttribute('data-unblock-client'), false); }; });
  }
}

loadState();
</script>
</body>
</html>
