<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111;
    --muted:#6E6E6E;
    --line:#DEDEDE;
    --line-strong:#B8B8B8;
    --paper:#FFFFFF;
    --bg:#FBFBFA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 24px 120px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:32px 0 40px;border-bottom:1px solid var(--line);margin-bottom:40px;
  }
  .brand{font-family:'Source Serif 4',serif;font-size:20px;font-weight:500;}
  .manage-link{
    font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;
    font-family:'Inter',sans-serif;padding:0;text-decoration:underline;text-underline-offset:3px;
  }
  .manage-link:hover{color:var(--ink);}

  .step-label{font-size:13px;color:var(--muted);margin-bottom:8px;}
  .step-line{height:2px;background:var(--line);margin-bottom:40px;position:relative;}
  .step-line::after{
    content:'';position:absolute;left:0;top:0;height:2px;background:var(--ink);
    width:var(--pct,0%);transition:width .3s ease;
  }

  h1{font-family:'Source Serif 4',serif;font-weight:500;font-size:26px;margin:0 0 28px;}
  .intro{font-size:15px;line-height:1.65;color:var(--ink);max-width:520px;margin:0 0 32px;}

  .type-toggle{display:flex;gap:8px;margin-bottom:24px;}
  .type-btn{
    flex:1;padding:13px 0;border:1px solid var(--line-strong);border-radius:6px;text-align:center;
    cursor:pointer;font-size:14px;font-weight:500;background:var(--paper);
  }
  .type-btn:hover{border-color:var(--ink);}
  .type-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .day-strip{display:flex;gap:8px;margin-bottom:24px;overflow-x:auto;padding-bottom:2px;}
  .day-cell{
    flex:0 0 auto;width:64px;padding:12px 0;border:1px solid var(--line-strong);border-radius:6px;
    text-align:center;cursor:pointer;background:var(--paper);

  .day-cell:hover{border-color:var(--ink);}
  .day-cell.active{background:var(--ink);border-color:var(--ink);}
  .day-cell .dow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}

  .day-cell .dnum{font-family:'Source Serif 4',serif;font-size:19px;margin-top:2px;}
  .day-cell.active .dnum{color:#fff;}
  .day-cell .dcount{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .day-cell.active .dcount{color:#BEBEBE;}
  .time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .time-cell{
    border:1px solid var(--line-strong);border-radius:6px;padding:12px 10px;cursor:pointer;text-align:center;
  }
  .time-cell:hover{border-color:var(--ink);}
  .time-cell.selected{background:var(--ink);border-color:var(--ink);}
  .time-cell .time{font-size:14px;font-weight:500;}
  .time-cell.selected .time{color:#fff;}
  .time-cell .format{font-size:11px;color:var(--muted);margin-top:2px;}
  .time-cell.selected .format{color:#BEBEBE;}

  .day-title{font-size:14px;font-weight:600;margin:24px 0 10px;}
  .day-title:first-child{margin-top:0;}
  .slot-list{border-top:1px solid var(--line);}
  .slot{
    display:flex;align-items:center;justify-content:space-between;padding:16px 4px;
    border-bottom:1px solid var(--line);cursor:pointer;
  }
  .slot:hover{background:#F4F4F2;}
  .slot.selected{background:#EFEFED;}
  .slot .time{font-size:15px;font-weight:500;}
  .slot .format{font-size:13px;color:var(--muted);}
  .slot .radio{
    width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-strong);flex-shrink:0;

  .slot.selected .radio{border-color:var(--ink);background:var(--ink);box-shadow:inset 0 0 0 3px #fff;}
  .empty{color:var(--muted);font-size:14px;padding:24px 0;}

  .required-mark{color:#A5433A;}

  button.ghost{

  button.ghost.danger-ghost{border-color:#D9A8A2;color:#8C2F27;}

  button.small{padding:7px 12px;font-size:12.5px;}
  .btn-row{display:flex;gap:10px;margin-top:28px;}

  .confirm{padding:56px 0 40px;}
  .confirm-mark{
    width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:20px;

  .confirm p{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 32px;}
  .join-block{margin-top:24px;}

  .location-text{font-size:14.5px;line-height:1.6;color:var(--ink);}

  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-month-label{font-family:'Source Serif 4',serif;font-size:16px;font-weight:500;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:6px;}
  .cal-cell{
    aspect-ratio:1;border:1px solid var(--line);border-radius:6px;padding:6px;position:relative;

  .cal-cell:hover{border-color:var(--ink);}
  .cal-cell.empty{border:none;cursor:default;}
  .cal-cell.past{color:var(--line-strong);cursor:default;background:#FAFAF9;}

  .cal-daynum{font-size:12.5px;}
  .cal-dot{width:5px;height:5px;border-radius:50%;background:var(--ink);position:absolute;bottom:6px;left:6px;}

  .cal-dot-legend,.cal-holiday-legend{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .cal-dot-legend{background:var(--ink);}

  .day-detail{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);}
  .day-detail-header{font-family:'Source Serif 4',serif;font-size:16px;font-weight:500;margin-bottom:10px;}
  .admin-nav-btn{
    background:none;border:none;padding:12px 4px;margin-right:24px;font-size:14px;font-weight:500;
    color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .admin-nav-btn:hover{color:var(--ink);}
  .admin-nav-btn.active{color:var(--ink);border-bottom-color:var(--ink);}
  .client-link{color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer;}
  .admin-block{margin-bottom:44px;padding-bottom:44px;border-bottom:1px solid var(--line);}
  .admin-block:last-child{border-bottom:none;}
  .admin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;}
  select{
    width:100%;padding:10px;border:1px solid var(--line-strong);border-radius:4px;font-size:14px;

  .slot-day-row{padding:12px 0;border-bottom:1px solid var(--line);}
  .slot-day-label{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:8px;}
  .slot-chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .slot-chip{
    display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:5px 8px;
    border:1px solid var(--line-strong);border-radius:14px;background:var(--paper);

  .slot-chip.booked{color:var(--muted);background:#F4F4F2;}
  .chip-x{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;
    padding:0;margin-left:2px;
  }
  .chip-x:hover{color:#A5433A;}
  .charge-row{padding-top:4px;}
  .charge-row label:first-of-type{margin-top:0;}
  .day-toggle-row{display:flex;gap:6px;}
  .day-toggle{
    width:34px;height:34px;border:1px solid var(--line-strong);border-radius:6px;display:flex;
    align-items:center;justify-content:center;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .day-toggle:hover{border-color:var(--ink);}
  .day-toggle.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .row .main{font-weight:500;}
  .row .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--line-strong);border-radius:3px;padding:2px 7px;text-transform:capitalize;}
  .tag.status-scheduled{color:var(--muted);border-color:var(--line-strong);}
  .tag.status-completed{color:var(--ink);border-color:var(--ink);}
  .tag.status-charged{background:var(--ink);color:#fff;border-color:var(--ink);}
  .session{border-bottom:1px solid var(--line);padding:20px 0;}
  .session:last-child{border-bottom:none;}
  .session-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .session-name{font-weight:600;font-size:14.5px;}
  .session-meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .session-format{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}
  .session-controls{margin-top:14px;padding:14px;background:#F7F7F5;border-radius:6px;}
  .session-controls label:first-of-type{margin-top:0;}
  .session-actions{margin-top:14px;}
  textarea{
    width:100%;padding:10px 11px;border:1px solid var(--line-strong);border-radius:4px;font-size:14px;
    font-family:'Inter',sans-serif;min-height:56px;resize:vertical;
  }
  .timer{font-family:'Source Serif 4',serif;font-size:20px;}
  .notes-textarea{min-height:160px;}
  .note{font-size:12px;color:var(--muted);margin-top:6px;}
  .client-block{border-bottom:1px solid var(--line);padding:20px 0;}
  .client-block:last-child{border-bottom:none;}
  .client-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .client-name{font-weight:600;font-size:14.5px;}
  .client-total{font-size:12.5px;color:var(--muted);}
  .hist-line{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;color:var(--ink);}
  .hist-line span:last-child{color:var(--muted);}
  .q-block label:first-of-type{margin-top:14px;}
  .wg-block{border-top:1px solid var(--line);padding-top:18px;margin-top:24px;}
  .wg-block p{font-size:13.5px;line-height:1.6;color:var(--muted);margin:0 0 10px;}
  .wg-link{color:var(--ink);text-decoration:underline;text-underline-offset:3px;}
  input[type=file]{font-size:13px;margin-top:8px;}
  .file-name{font-size:12.5px;color:var(--muted);margin-top:6px;}
  .blocked-msg{background:#FBEAEA;border:1px solid #E3B3AC;border-radius:8px;padding:14px 16px;font-size:13.5px;color:#8C2F27;margin:20px 0;}
  .client-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;}

  .portal-session{border-bottom:1px solid var(--line);padding:16px 0;}
  .portal-session:last-child{border-bottom:none;}
  .portal-session .top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:500;}
  .portal-session .meta{font-size:12.5px;color:var(--muted);margin-top:2px;}

</style>

<body>
<div class="wrap" id="app"></div>

<script src="https://js.stripe.com/v3/"></script>
<script>
const STRIPE_PUBLISHABLE_KEY = 'pk_live_51TsrEPPAxQObgqV7mjxJ31V5JNhBanKcQK3mtnvWU8wnnCMrbXd9SlkpveW3jJPZFVjoqnlRuRZwppqYhhCkZkfv00kbDv2p2k';
const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
const elements = stripe.elements();
const cardElement = elements.create('card', {
  style: { base: { fontSize: '14.5px', fontFamily: 'Inter, sans-serif', color: '#111111' } }
});
let cardMounted = false;
let cardComplete = false;
let cardErrorMsg = '';
function isCurrentEmailBlocked(){
  return clientForm.checkedEmail === clientForm.email && !!clientForm.blocked;
}
function updateConfirmButtonState(){
  const btn = document.getElementById('confirmBtn');
  if(!btn) return;
  btn.disabled = !(clientForm.name && clientForm.email && clientForm.phone && cardComplete) || submitting || isCurrentEmailBlocked();
}
cardElement.on('change', (e)=>{
  cardComplete = e.complete;
  cardErrorMsg = e.error ? e.error.message : '';
  const errEl = document.getElementById('card-error');
  if(errEl) errEl.textContent = cardErrorMsg;
  updateConfirmButtonState();
});

let state = { slots: [], bookings: [], clients: [], settings: { meetLink: '', location: '', intakeQuestions: [
  "What's your name and what do you do?",
  "What's the main challenge or decision you're facing right now?",
  "What does success look like if this session goes well?",
  "How did you hear about Catalyst Consulting?",
  "What's your current role or business?",
  "Is this a personal, business, or career-related topic?",
  "Have you worked with a coach or consultant on this before?",
  "What's the timeline or urgency around this?",
  "Anything you'd rather I know going in that's hard to say out loud?",
  "Anything else I should know before we talk?"
] }, availability: {
  virtual: [
    { id:'r1', days:[1,2,3,4], start:'11:00', end:'13:00' },
    { id:'r2', days:[5], start:'10:30', end:'12:30' },
    { id:'r3', days:[0], start:'10:30', end:'11:30' }
  ],
  'in-person': [
    { id:'r4', days:[1,2,3,4], start:'11:00', end:'13:00' }
  ]
} };
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function timeToMin(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function pad2(n){ return String(n).padStart(2,'0'); }
function dateStr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function generateSlotsFromRules(weeksAhead){
  const bookedSlotIds = new Set(state.bookings.map(b=>b.slotId));
  const existingMap = new Map();
  state.slots.forEach(s=> existingMap.set(s.date+'|'+s.time+'|'+s.type, s));
  const today = new Date(); today.setHours(0,0,0,0);
  const added = [];
  for(let i=0;i<weeksAhead*7;i++){
    const d = new Date(today); d.setDate(d.getDate()+i);
    const dow = d.getDay();
    const ds = dateStr(d);
    ['virtual','in-person'].forEach(type=>{
      (state.availability[type]||[]).forEach(rule=>{
        if(rule.days.includes(dow)){
          let cursor = timeToMin(rule.start);
          const endMin = timeToMin(rule.end);
          while(cursor + 60 <= endMin){
            const timeStr = pad2(Math.floor(cursor/60))+':'+pad2(cursor%60);
            const key = ds+'|'+timeStr+'|'+type;
            const existing = existingMap.get(key);
            if(!existing){
              const slot = { id: uid(), date: ds, time: timeStr, duration: 60, type };
              state.slots.push(slot);
              existingMap.set(key, slot);
              added.push(slot);
            } else if(existing.duration !== 60 && !bookedSlotIds.has(existing.id)){
              existing.duration = 60;
              added.push(existing);
            }
            cursor += 60;
          }
        }
      });
    });
  }
  return added;
}
let adminToken = (typeof sessionStorage !== 'undefined' && sessionStorage.getItem('heshyAdminToken')) || '';
let adminUnlocked = !!adminToken;
let view = (() => {
  const h = location.hash.replace(/[^a-z]/gi, '');
  if(h.includes('manage')) return 'admin';
  if(h.includes('portal')) return 'portal';
  return 'client';
})();
let bookingStep = 1;
let selectedSlot = null;
let selectedDay = null;
let selectedType = 'virtual';
let clientForm = { name:'', email:'', phone:'', intakeAnswers:[], wgPdfName:'', wgPdfData:'', checkedEmail:'', isNew:false, blocked:false, couponCode:'' };
let confirmedMeetLink = '';
let confirmedComped = false;
let submitting = false;
let portalEmail = '';
let portalClient = null;
let portalError = '';
let expandedClientId = null;
let runningTimer = {};
let timerDisplay = {};
let newSlot = { date:'', time:'', duration:60, type:'virtual' };
let newCoupon = { code:'', description:'', maxUses:'' };
let adminType = 'virtual';
let adminView = 'dashboard';
let showScheduleEditor = false;
let scheduleCalMonth = (()=>{ const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })();
let selectedScheduleDate = null;
let quickAddTime = '';
let quickAddDuration = 60;
let dashboardCalMonth = (()=>{ const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })();
let selectedDashboardDate = null;
function selectAdminType(t){ adminType = t; newSlot.type = t; selectedScheduleDate = null; render(); }

function uid(){ return Math.random().toString(36).slice(2,10); }
function intakeRegionHtml(){
  const checked = clientForm.checkedEmail === clientForm.email && clientForm.email;
  const isBlocked = !!(checked && clientForm.blocked);
  const isNew = !!(checked && clientForm.isNew);
  if(isBlocked){
    return `<div class="blocked-msg">We're not able to book a session for this email right now.</div>`;
  }
  if(isNew){
    const questions = state.settings.intakeQuestions || [];
    while(clientForm.intakeAnswers.length < questions.length) clientForm.intakeAnswers.push('');
    let html = `<div class="form-section q-block"><div class="section-title">A few questions</div>`;
    questions.forEach((q,i)=>{
      html += `<label>${q}</label><input type="text" data-intake="${i}" value="${clientForm.intakeAnswers[i]||''}">`;
    });

function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}
function fmtTime(t){
  const [h,m] = t.split(':').map(Number);
  const ampm = h>=12?'PM':'AM';
  const h12 = h%12===0?12:h%12;
  return h12+':'+String(m).padStart(2,'0')+' '+ampm;
}
function money(n){ return '$'+n.toFixed(2); }

let calendarBusy = [];
let jewishHolidayDates = new Set();
let jewishHolidayNames = {};
const BLOCKED_HOLIDAY_MATCHES = [
  'Rosh Hashana', 'Yom Kippur', 'Sukkot', 'Shmini Atzeret', 'Simchat Torah',
  'Pesach', 'Shavuot', 'Purim', "Tish'a B'Av", 'Tisha B\u2019Av'
];
async function loadJewishHolidays(){
  try{
    const year = new Date().getFullYear();
    const urls = [year, year+1].map(y=>`https://www.hebcal.com/hebcal?v=1&cfg=json&maj=on&min=on&mod=off&nx=off&year=${y}&ss=off&mf=on&c=off&geo=none`);
    const results = await Promise.all(urls.map(u=>fetch(u).then(r=>r.json()).catch(()=>({items:[]}))));
    const items = results.flatMap(d=>d.items||[]);
    const matched = items.filter(i=> BLOCKED_HOLIDAY_MATCHES.some(name=> (i.title||'').includes(name)));
    jewishHolidayDates = new Set(matched.map(i=>i.date.slice(0,10)));
    jewishHolidayNames = {};
    matched.forEach(i=>{
      const ds = i.date.slice(0,10);
      if(!jewishHolidayNames[ds]) jewishHolidayNames[ds] = i.title;
    });
  }catch(e){ jewishHolidayDates = new Set(); jewishHolidayNames = {}; }
}
let calendarConnected = false;
function slotOverlapsBusy(slot){
  const slotStart = new Date(slot.date+'T'+slot.time+':00');
  const slotEnd = new Date(slotStart.getTime() + slot.duration*60000);
  return calendarBusy.some(b=>{
    const bStart = new Date(b.start), bEnd = new Date(b.end);
    return slotStart < bEnd && slotEnd > bStart;
  });
}
async function loadCalendarBusy(){
  try{
    const today = new Date();
    const later = new Date(); later.setDate(later.getDate()+60);
    const r = await fetch('/api/free-busy?timeMin='+today.toISOString()+'&timeMax='+later.toISOString());
    const data = await r.json();
    calendarConnected = !!data.connected;
    calendarBusy = data.busy || [];
  }catch(e){ calendarConnected = false; calendarBusy = []; }
}
function isFutureSlot(s){
  const now = new Date();
  const nowDs = dateStr(now);
  if(s.date > nowDs) return true;
  if(s.date < nowDs) return false;
  const nowTime = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  return s.time > nowTime;
}
function openSlots(){
  const bookedIds = new Set(state.bookings.map(b=>b.slotId));
  return state.slots.filter(s=>!bookedIds.has(s.id) && s.type===selectedType && !slotOverlapsBusy(s) && !jewishHolidayDates.has(s.date) && isFutureSlot(s)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
function groupByDate(slots){
  const g = {};
  slots.forEach(s=>{ (g[s.date]=g[s.date]||[]).push(s); });
  return g;
}

async function confirmBooking(){
  if(!clientForm.name || !clientForm.email || !clientForm.phone || !cardComplete || submitting) return;
  if(isCurrentEmailBlocked()) return;
  if(clientForm.isNew && !clientForm.wgPdfData){
    const proceed = confirm("You haven't attached your Working Genius results yet. It's not required, but it helps a lot before your first session.\n\nContinue booking without it?");
    if(!proceed) return;
  }
  submitting = true;
  const btn = document.getElementById('confirmBtn');
  const backBtn = document.getElementById('backTo1');
  if(btn){ btn.disabled = true; btn.textContent = 'Booking…'; }
  if(backBtn) backBtn.disabled = true;

  try{
    const setupRes = await fetch('/api/create-setup-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: clientForm.name, email: clientForm.email, phone: clientForm.phone })
    });
    const setupData = await setupRes.json();
    if(setupData.error){ throw new Error(setupData.error); }

    const result = await stripe.confirmCardSetup(setupData.clientSecret, {
      payment_method: {
        card: cardElement,
        billing_details: { name: clientForm.name, email: clientForm.email, phone: clientForm.phone }
      }
    });
    if(result.error){ throw new Error(result.error.message); }

    const bookingRes = await fetch('/api/create-booking', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        slotId: selectedSlot.id, name: clientForm.name, email: clientForm.email, phone: clientForm.phone,
        intakeAnswers: clientForm.intakeAnswers, wgPdfName: clientForm.wgPdfName, wgPdfData: clientForm.wgPdfData,
        stripeCustomerId: setupData.customerId, couponCode: clientForm.couponCode
      })
    });
    const bookingData = await bookingRes.json();
    if(bookingData.error){ throw new Error(bookingData.error); }
    if(bookingData.meetLink) confirmedMeetLink = bookingData.meetLink;
    confirmedComped = !!bookingData.comped;

    submitting = false;
    bookingStep = 3; render();
  }catch(err){
    submitting = false;
    cardErrorMsg = err.message || 'Something went wrong. Please try again.';
    const errEl = document.getElementById('card-error'); if(errEl) errEl.textContent = cardErrorMsg;
    const btn = document.getElementById('confirmBtn'); if(btn){ btn.textContent = 'Book session'; updateConfirmButtonState(); }
    const backBtn = document.getElementById('backTo1'); if(backBtn) backBtn.disabled = false;
  }
}

function startTimer(id){

  timerDisplay[id] = timerDisplay[id] || 0;
  runningTimer[id] = setInterval(()=>{ timerDisplay[id]++; renderTimerOnly(id); }, 1000);
  render();
}

async function chargeAndReceipt(id){
  const btn = document.querySelector(`[data-charge="${id}"]`);
  const amountInput = document.querySelector(`[data-amount="${id}"]`);
  const hoursInput = document.querySelector(`[data-actual-hours="${id}"]`);
  const overrideAmount = amountInput ? parseFloat(amountInput.value) : null;
  const overrideHours = hoursInput ? parseFloat(hoursInput.value) : null;
  const overrideMinutes = (overrideHours!=null && !isNaN(overrideHours)) ? Math.round(overrideHours*60) : null;
  if(btn){ btn.disabled = true; btn.textContent = 'Charging…'; }
  try{
    const res = await fetch('/api/charge-booking', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
      body: JSON.stringify({
        bookingId: id,
        amount: (overrideAmount!=null && !isNaN(overrideAmount)) ? overrideAmount : undefined,
        actualMinutes: (overrideMinutes!=null && !isNaN(overrideMinutes)) ? overrideMinutes : undefined
      })
    });
    const data = await res.json();
    if(data.error){ alert('Charge failed: ' + data.error); if(btn){ btn.disabled=false; } return; }
    await loadAdminState();
    render();
  }catch(e){
    alert('Charge failed: ' + e.message);

      <div class="form-section">
        <div class="section-title">Coupon code <span class="optional-mark">(optional)</span></div>
        <input type="text" id="f-coupon" placeholder="Have a code? Enter it here" value="${clientForm.couponCode}">
      </div>
      <div class="form-section last">
        <div class="section-title">Payment</div>
        <label>Card</label>
        <div id="card-element" class="stripe-el"></div>
        <div id="card-error" class="card-error"></div>
      </div>
      <div class="btn-row">
        <button class="ghost" id="backTo1" ${submitting?'disabled':''}>Back</button>
        <button class="primary" id="confirmBtn" ${(clientForm.name && clientForm.email && clientForm.phone && cardComplete && !submitting && !isCurrentEmailBlocked()) ? '' : 'disabled'}>${submitting?'Booking…':'Book session'}</button>
      </div>
    `;
  } else {
    inner += `
      <div class="confirm">
        <div class="confirm-mark">&#10003;</div>
        <h1>Booked.</h1>
        <p>A confirmation is on its way to your email.</p>
        <div class="fact">
          <div class="fact-row"><span>Time</span><span>${fmtDate(selectedSlot.date)}, ${fmtTime(selectedSlot.time)}</span></div>
          <div class="fact-row"><span>Format</span><span>${selectedSlot.type==='virtual'?'Video call':'In person'}</span></div>
          <div class="fact-row"><span>Rate</span><span>${confirmedComped ? 'Complimentary — no charge' : '$500 per hour, charged after the session'}</span></div>
          ${confirmedComped ? `<div class="fact-row"><span>Coupon</span><span>${clientForm.couponCode}</span></div>` : ''}
        </div>
        ${selectedSlot.type==='virtual'
          ? `<div class="join-block"><div class="section-title">Join link</div><a href="${confirmedMeetLink||'#'}" class="join-link">${confirmedMeetLink||'Link will be sent before the session'}</a></div>`
          : `<div class="join-block"><div class="section-title">Location</div><div class="location-text">${(state.settings.location||'Address will be sent before the session').replace(/\n/g,'<br>')}</div></div>`}
      </div>
    `;
  }

  return `
    <div class="topbar"><div class="brand">Heshy — Clarity Sessions</div></div>
    <div class="step-label">Step ${bookingStep} of 3</div>
    <div class="step-line" style="--pct:${pct}%"></div>
    ${inner}
  `;
}

function renderDashboardCalendar(){
  const monthStart = new Date(dashboardCalMonth.getFullYear(), dashboardCalMonth.getMonth(), 1);
  const monthLabel = monthStart.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  const firstDow = monthStart.getDay();
  const daysInMonth = new Date(monthStart.getFullYear(), monthStart.getMonth()+1, 0).getDate();
  const todayDs = dateStr(new Date());

  const countsByDate = {};
  state.bookings.forEach(b=>{ countsByDate[b.date] = (countsByDate[b.date]||0)+1; });

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(monthStart.getFullYear(), monthStart.getMonth(), day);
    const ds = dateStr(d);
    const isHoliday = jewishHolidayDates.has(ds);
    const hasBookings = !!countsByDate[ds];
    const isSelected = selectedDashboardDate === ds;
    const isToday = ds === todayDs;
    cells += `<div class="cal-cell ${isHoliday?'holiday':''} ${isSelected?'selected':''} ${isToday?'today':''}" data-dash-day="${ds}" ${isHoliday?`title="${jewishHolidayNames[ds]||'Jewish holiday'}"`:''}>
      <div class="cal-daynum">${day}</div>
      ${hasBookings ? `<div class="cal-dot"></div>` : ''}
    </div>`;
  }

  return `
    <div class="cal-header">
      <button class="ghost small" id="dashCalPrevMonth">&larr;</button>
      <div class="cal-month-label">${monthLabel}</div>
      <button class="ghost small" id="dashCalNextMonth">&rarr;</button>
    </div>
    <div class="cal-grid">
      ${['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="cal-legend">
      <span><span class="cal-dot-legend"></span> has sessions</span>
    </div>
  `;
}

function renderScheduleCalendar(){
  const monthStart = new Date(scheduleCalMonth.getFullYear(), scheduleCalMonth.getMonth(), 1);
  const monthLabel = monthStart.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  const firstDow = monthStart.getDay();
  const daysInMonth = new Date(monthStart.getFullYear(), monthStart.getMonth()+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const todayDs = dateStr(today);

  const countsForType = {};
  state.slots.forEach(s=>{ if(s.type===adminType && isFutureSlot(s)) countsForType[s.date] = (countsForType[s.date]||0)+1; });

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(monthStart.getFullYear(), monthStart.getMonth(), day);
    const ds = dateStr(d);
    const isPast = ds < todayDs;
    const isHoliday = jewishHolidayDates.has(ds);
    const hasSlots = !!countsForType[ds];
    const isSelected = selectedScheduleDate === ds;
    const isToday = ds === todayDs;
    cells += `<div class="cal-cell ${isPast?'past':''} ${isHoliday?'holiday':''} ${isSelected?'selected':''} ${isToday?'today':''}" ${isPast?'':`data-cal-day="${ds}"`} ${isHoliday?`title="${jewishHolidayNames[ds]||'Jewish holiday'}"`:''}>
      <div class="cal-daynum">${day}</div>
      ${hasSlots ? `<div class="cal-dot"></div>` : ''}
    </div>`;
  }

  return `
    <div class="cal-header">
      <button class="ghost small" id="calPrevMonth">&larr;</button>
      <div class="cal-month-label">${monthLabel}</div>
      <button class="ghost small" id="calNextMonth">&rarr;</button>
    </div>
    <div class="cal-grid">
      ${['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="cal-legend">
      <span><span class="cal-dot-legend"></span> has open times</span>
      <span><span class="cal-holiday-legend"></span> Jewish holiday, unavailable</span>
    </div>
  `;
}

function renderDayDetail(){
  if(!selectedScheduleDate) return '';
  const ds = selectedScheduleDate;
  const daySlots = state.slots.filter(s=>s.type===adminType && s.date===ds).sort((a,b)=>a.time.localeCompare(b.time));
  const bookedIds = new Set(state.bookings.map(b=>b.slotId));
  const isHoliday = jewishHolidayDates.has(ds);
  let chips = daySlots.length===0 ? `<div class="empty">No times set for this day.</div>` : '';
  daySlots.forEach(s=>{
    const isBooked = bookedIds.has(s.id);
    chips += `<span class="slot-chip ${isBooked?'booked':''}">${fmtTime(s.time)}${isBooked?'':`<button class="chip-x" data-remove-slot="${s.id}" title="Remove">&times;</button>`}</span>`;
  });
  return `
    <div class="day-detail">
      <div class="day-detail-header">${fmtDate(ds)}</div>
      ${isHoliday ? `<div class="note">${jewishHolidayNames[ds]||'Jewish holiday'} &mdash; stays unavailable regardless of times added here.</div>` : ''}
      <div class="slot-chip-row" style="margin:10px 0 16px;">${chips}</div>
      ${!isHoliday ? `
      <div class="row2">
        <div><label>Add a time</label><input type="text" id="quickAddTime" placeholder="HH:MM" value="${quickAddTime}"></div>
        <div><label>Duration</label>
          <select id="quickAddDuration">
            <option value="30" ${quickAddDuration==30?'selected':''}>30 min</option>
            <option value="60" ${quickAddDuration==60?'selected':''}>60 min</option>
            <option value="90" ${quickAddDuration==90?'selected':''}>90 min</option>
          </select>
        </div>
      </div>
      <div style="margin-top:12px;"><button class="primary small" id="quickAddBtn">Add time</button></div>
      ` : ''}
    </div>
  `;
}

function renderAdmin(){
  const bookedIds = new Set(state.bookings.map(b=>b.slotId));
  const todayDs = (()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();
  const typeSlots = state.slots.filter(s=>s.type===adminType && s.date>=todayDs && !jewishHolidayDates.has(s.date) && isFutureSlot(s));
  let rulesHtml = (state.availability[adminType]||[]).length===0 ? `<div class="empty">No weekly pattern set.</div>` : '';
  (state.availability[adminType]||[]).forEach(r=>{
    rulesHtml += `
      <div class="row">
        <div><div class="main">${daysLabel(r.days)}</div><div class="sub">${fmtTimeShort(r.start)} &ndash; ${fmtTimeShort(r.end)}</div></div>
        <button class="ghost small" data-remove-rule="${r.id}">Remove</button>
      </div>`;
  });
  let slotsHtml = typeSlots.length===0 ? `<div class="empty">No ${adminType==='virtual'?'online':'in-person'} slots added yet.</div>` : '';
  const slotsByDate = {};
  typeSlots.forEach(s=>{ (slotsByDate[s.date]=slotsByDate[s.date]||[]).push(s); });
  Object.keys(slotsByDate).sort().forEach(d=>{
    const daySlots = slotsByDate[d].sort((a,b)=>a.time.localeCompare(b.time));
    slotsHtml += `<div class="slot-day-row">
      <div class="slot-day-label">${fmtDate(d)}</div>
      <div class="slot-chip-row">`;
    daySlots.forEach(s=>{
      const isBooked = bookedIds.has(s.id);
      slotsHtml += `<span class="slot-chip ${isBooked?'booked':''}">${fmtTime(s.time)}${isBooked?'':`<button class="chip-x" data-remove-slot="${s.id}" title="Remove">&times;</button>`}</span>`;
    });
    slotsHtml += `</div></div>`;
  });

  const clientById = {};
  state.clients.forEach(c=>{ clientById[c.id] = c; });

  function sessionCardHtml(b){
    const running = !!runningTimer[b.id];
    const timerBlock = `
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:8px;">
        <span class="timer" id="timer-${b.id}">${String(Math.floor((timerDisplay[b.id]||0)/60)).padStart(2,'0')}:${String((timerDisplay[b.id]||0)%60).padStart(2,'0')}</span>
        ${running ? `<button class="ghost small" data-stop-timer="${b.id}">Stop</button>` : `<button class="ghost small" data-start-timer="${b.id}">Start</button>`}
        <span class="note" style="margin:0;">Tracks actual time for billing</span>
      </div>`;
    const meetBlock = b.meetLink ? `
      <label>${b.type==='virtual' ? 'Google Meet link' : 'Google Meet link (for your own recording/notes)'}</label>
      <input type="text" value="${b.meetLink||''}" data-meet="${b.id}">
      ${!running ? `<button class="primary small" data-join-start="${b.id}" style="margin-top:10px;">${b.type==='virtual'?'Join meeting':'Start Meet'} &amp; start timer</button>` : ''}
    ` : '';
    const controls = `
        <div class="session-controls">
          ${timerBlock}
          ${meetBlock}
          ${(b.calendarEventId || b.meetLink) ? `<button class="ghost small" data-fetch-gemini="${b.id}" style="margin-bottom:14px;">Fetch notes & duration</button><span id="gemini-msg-${b.id}" style="font-size:12.5px;margin-left:10px;"></span>` : ''}
          <label>Internal notes</label>
          <textarea class="notes-textarea" data-summary="${b.id}">${b.summary||''}</textarea>
          <label>Client-facing summary</label>
          <textarea class="notes-textarea" data-clientsummary="${b.id}">${b.clientSummary||''}</textarea>
        </div>
    `;
    let action = '';
    if(b.status!=='charged'){
      const mins = b.actualMinutes || b.durationMin;
      const hours = Math.round((mins/60)*100)/100;
      const defaultAmt = Math.round(hours*500*100)/100;
      const amt = (b.amount!=null) ? b.amount : defaultAmt;
      action = `
        <div class="charge-row">
          <div class="row2">
            <div><label>Actual hours</label><input type="text" value="${hours}" data-actual-hours="${b.id}"></div>
            <div><label>Amount to charge</label><input type="text" value="${amt.toFixed(2)}" data-amount="${b.id}"></div>
          </div>
          <div style="margin-top:12px;"><button class="primary small" data-charge="${b.id}">Charge and send receipt</button></div>
          <button class="ghost small danger-ghost" data-skip-charge="${b.id}" style="margin-top:8px;">Mark complete, don't charge</button>
        </div>`;
    }
    return `
      <div class="session">
        <div class="session-top">
          <div>
            <div class="session-name">${b.clientId?`<a class="client-link" data-view-client="${b.clientId}">${b.clientName}</a>`:b.clientName}</div>
            <div class="session-meta">${fmtDate(b.date)}, ${fmtTime(b.time)}, ${b.durationMin} min scheduled${b.actualMinutes?', '+b.actualMinutes+' min actual':''}</div>
            <div class="session-format">${b.type==='virtual'?'Video call':'In person'}${b.comped?' &middot; comped ('+b.couponCode+')':''}</div>
          </div>
          <span class="tag status-${b.status}">${b.status}</span>
        </div>
        ${controls}
        ${action?`<div class="session-actions">${action}</div>`:''}
        <button class="ghost small danger-ghost" data-cancel-booking="${b.id}" style="margin-top:8px;">Cancel booking</button>
      </div>`;
  }

  const nav = `
    <div class="admin-nav">
      <button class="admin-nav-btn ${adminView==='dashboard'?'active':''}" data-admin-view="dashboard">Dashboard</button>
      <button class="admin-nav-btn ${adminView==='schedule'?'active':''}" data-admin-view="schedule">Schedule</button>
      <button class="admin-nav-btn ${adminView==='clients'?'active':''}" data-admin-view="clients">Clients</button>
      <button class="admin-nav-btn ${adminView==='settings'?'active':''}" data-admin-view="settings">Settings</button>
    </div>
  `;

  let body = '';

  if(adminView==='dashboard'){
    const todayDs = dateStr(new Date());
    if(!selectedDashboardDate) selectedDashboardDate = todayDs;
    const dayBookings = state.bookings.filter(b=>b.date===selectedDashboardDate).sort((a,b)=>a.time.localeCompare(b.time));
    let dayHtml = dayBookings.length===0 ? `<div class="empty">No sessions on this day.</div>` : '';
    dayBookings.forEach(b=>{
      if(b.status==='charged'){
        dayHtml += `<div class="session">
          <div class="session-top">
            <div>
              <div class="session-name">${b.clientId?`<a class="client-link" data-view-client="${b.clientId}">${b.clientName}</a>`:b.clientName}</div>
              <div class="session-meta">${fmtTime(b.time)}, ${b.actualMinutes||b.durationMin} min &middot; ${money(b.amount||0)} charged</div>
              <div class="session-format">${b.type==='virtual'?'Video call':'In person'}</div>
            </div>
            <span class="tag status-charged">charged</span>
          </div>
        </div>`;
      } else {
        dayHtml += sessionCardHtml(b);
      }
    });
    const isSelectedToday = selectedDashboardDate === todayDs;
    body = `
      <div class="admin-block">
        <h2 class="sect">Dashboard</h2>
        ${renderDashboardCalendar()}
      </div>
      <div class="admin-block">
        <h2 class="sect">${isSelectedToday ? 'Today' : fmtDate(selectedDashboardDate)}</h2>
        ${dayHtml}
      </div>
    `;
  }

  if(adminView==='schedule'){
    body = `
      <div class="admin-block">
        <h2 class="sect">Schedule</h2>
        <div class="type-toggle">
          <div class="type-btn ${adminType==='virtual'?'active':''}" data-admin-type="virtual">Online</div>
          <div class="type-btn ${adminType==='in-person'?'active':''}" data-admin-type="in-person">In person</div>
        </div>

        <div style="margin-top:24px;">
          ${renderScheduleCalendar()}
        </div>
        ${renderDayDetail()}

        <button class="ghost small" id="toggleScheduleEditor" style="margin-top:24px;">${showScheduleEditor?'Hide weekly pattern':'Edit weekly pattern'}</button>

        ${showScheduleEditor ? `
        <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--line);">
          <div class="section-title">Weekly pattern</div>
          <p class="note" style="margin:0 0 14px;">This is the schedule that repeats every week. Add or remove a day/time block below.</p>
          ${rulesHtml}
          <div class="day-toggle-row" style="margin-top:14px;">
            ${DOW.map((d,i)=>`<div class="day-toggle ${newRule.days.includes(i)?'active':''}" data-rule-day="${i}">${d[0]}</div>`).join('')}
          </div>
          <div class="row2" style="margin-top:12px;">
            <div><label>Start time</label><input type="text" id="nr-start" placeholder="HH:MM" value="${newRule.start}"></div>
            <div><label>End time</label><input type="text" id="nr-end" placeholder="HH:MM" value="${newRule.end}"></div>
          </div>
          <div style="margin-top:14px;"><button class="ghost small" id="addRuleBtn">Add pattern</button></div>
        </div>
        ` : ''}
      </div>
    `;
  }

  if(adminView==='clients'){
    let clientsHtml = state.clients.length===0 ? `<div class="empty">No client profiles yet.</div>` : '';
    state.clients.slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(c=>{
      const clientBookings = state.bookings.filter(b=>b.clientId===c.id);
      const sessionCount = clientBookings.length;
      const totalBilled = clientBookings.filter(b=>b.status==='charged').reduce((sum,b)=>sum+(b.amount||0),0);
      clientsHtml += `
        <div class="client-row" data-toggle-client="${c.id}">
          <div><div class="main">${c.name}</div><div class="sub">${c.email} &middot; ${sessionCount} session${sessionCount!==1?'s':''}${totalBilled>0?' &middot; '+money(totalBilled)+' total':''}</div></div>
          ${c.blocked ? `<span class="tag blocked">blocked</span>` : ''}
        </div>`;
      if(expandedClientId === c.id){
        const questions = state.settings.intakeQuestions || [];
        let qaHtml = '';
        questions.forEach((q,i)=>{
          if(c.intakeAnswers && c.intakeAnswers[i]){
            qaHtml += `<div class="qa"><div class="q">${q}</div><div>${c.intakeAnswers[i]}</div></div>`;
          }
        });
        let sessHtml = '';
        clientBookings.sort((a,b)=>b.createdAt-a.createdAt).forEach(b=>{
          sessHtml += `<div class="hist-line"><span>${fmtDate(b.date)} &middot; ${b.type==='virtual'?'Video':'In person'} &middot; ${b.status}</span><span>${b.status==='charged'?money(b.amount||0):''}</span></div>`;
          if(b.summary) sessHtml += `<div class="qa"><div class="q">Notes</div><div>${b.summary}</div></div>`;
        });
        clientsHtml += `
          <div class="client-detail">
            ${qaHtml || `<div class="empty">No intake answers on file.</div>`}
            ${c.wgPdfData ? `<div class="qa"><div class="q">Working Genius</div><a class="wg-link" href="${c.wgPdfData}" download="${c.wgPdfName||'working-genius.pdf'}">${c.wgPdfName||'Download PDF'}</a></div>` : ''}
            <div class="section-title" style="margin-top:18px;">Session history</div>
            ${sessHtml || `<div class="empty">No sessions yet.</div>`}
            <div style="margin-top:14px;">
              ${c.blocked
                ? `<button class="ghost small" data-unblock-client="${c.id}">Unblock</button>`
                : `<button class="ghost small danger-ghost" data-block-client="${c.id}">Block from booking</button>`}
            </div>
          </div>`;
      }
    });
    body = `
      <div class="admin-block">
        <h2 class="sect">Clients</h2>
        ${clientsHtml}
      </div>
    `;
  }

  if(adminView==='settings'){
    body = `
      <div class="admin-block">
        <h2 class="sect">Settings</h2>
        <label>Google Calendar</label>
        <div style="display:flex;align-items:center;gap:14px;">
          <span class="tag ${calendarConnected?'status-completed':'status-scheduled'}">${calendarConnected?'connected':'not connected'}</span>
          <a class="wg-link" href="/api/google-auth-url?token=${encodeURIComponent(adminToken)}">${calendarConnected?'Reconnect':'Connect Google Calendar'}</a>
        </div>
        <div class="note">When connected, times that conflict with your personal calendar won't show as bookable, and booked sessions get added to your calendar automatically.</div>
        <label>Video call link (Google Meet)</label>
        <input type="text" id="set-meet" placeholder="https://meet.google.com/xxx-xxxx-xxx" value="${state.settings.meetLink}">
        <label>In-person location and instructions</label>
        <textarea id="set-location" placeholder="Address, parking, floor, buzzer code, etc.">${state.settings.location}</textarea>
        <label>Intake questions (one per line, asked only on a client's first booking)</label>
        <textarea id="set-intake" style="min-height:140px;">${(state.settings.intakeQuestions||[]).join('\n')}</textarea>
        <div class="note">Sent automatically on every confirmation, based on which format the client picked.</div>
        <div style="margin-top:16px;">
          <button class="primary small" id="save-settings-btn">Save settings</button>
          <span id="settings-save-msg" style="font-size:13px;margin-left:12px;"></span>
        </div>
      </div>

      <div class="admin-block">
        <h2 class="sect">Coupon codes</h2>
        <p class="note" style="margin:0 0 14px;">A client can enter a code at booking to make that one session free. The card is still saved for no-show protection, but you won't be charged for it unless you choose to.</p>
        ${(state.settings.coupons||[]).length===0 ? `<div class="empty">No coupon codes yet.</div>` : ''}
        ${(state.settings.coupons||[]).map(c=>`
          <div class="row">
            <div><div class="main">${c.code}</div><div class="sub">${c.description||'No description'} &middot; ${c.maxUses ? (c.usedCount||0)+' of '+c.maxUses+' used' : 'Unlimited uses'}${c.usedCount>0?' &middot; used '+(c.usedCount||0)+' time'+(c.usedCount===1?'':'s'):''}</div></div>
            <button class="ghost small danger-ghost" data-remove-coupon="${c.code}">Remove</button>
          </div>
        `).join('')}
        <div class="admin-grid" style="margin-top:16px;">
          <div><label>Code</label><input type="text" id="coupon-code" placeholder="FRIEND2026" value="${newCoupon.code}"></div>
          <div><label>Description (optional)</label><input type="text" id="coupon-desc" placeholder="For referrals" value="${newCoupon.description}"></div>
          <div><label>Max uses</label><input type="text" id="coupon-max" placeholder="Blank = unlimited" value="${newCoupon.maxUses}"></div>
        </div>
        <div style="margin-top:14px;"><button class="ghost small" id="addCouponBtn">Add coupon</button></div>
      </div>
    `;
  }

  return `
    <div class="topbar"><div class="brand">Heshy — Manage</div><button class="manage-link" id="backToClientBtn">Back to booking</button></div>
    ${nav}
    ${body}
  `;
}

function mountCardElementIfNeeded(){
  const mount = document.getElementById('card-element');
  if(!mount || bookingStep !== 2) return;
  if(mount.childElementCount === 0){
    cardElement.mount('#card-element');
  }
  const errEl = document.getElementById('card-error');
  if(errEl) errEl.textContent = cardErrorMsg;
}

function attachHandlers(){
  const $ = id => document.getElementById(id);
  const backBtn = $('backToClientBtn'); if(backBtn) backBtn.onclick = backToClient;
  const loginBtn = $('admin-login-btn'); if(loginBtn) loginBtn.onclick = tryAdminLogin;
  const passInput = $('admin-pass');
  if(passInput) passInput.onkeydown = e=>{ if(e.key==='Enter') tryAdminLogin(); };
  const portalGoBtn = $('portal-go-btn'); if(portalGoBtn) portalGoBtn.onclick = checkPortal;
  const portalEmailInput = $('portal-email');
  if(portalEmailInput){
    portalEmailInput.oninput = e=> portalEmail = e.target.value;
    portalEmailInput.onkeydown = e=>{ if(e.key==='Enter') checkPortal(); };
  }
  const portalBookAgainBtn = $('portal-book-again'); if(portalBookAgainBtn) portalBookAgainBtn.onclick = portalBookAgain;

  if(view==='admin' && !adminUnlocked) return;
  if(view==='portal') return;

  if(view==='client'){
    document.querySelectorAll('[data-slot]').forEach(el=>{ el.onclick = ()=>selectSlot(el.getAttribute('data-slot')); });
    document.querySelectorAll('[data-day]').forEach(el=>{ el.onclick = ()=>selectDay(el.getAttribute('data-day')); });
    document.querySelectorAll('[data-type]').forEach(el=>{ el.onclick = ()=>selectType(el.getAttribute('data-type')); });
    const to2 = $('toStep2'); if(to2) to2.onclick = ()=>goStep(2);
    const back1 = $('backTo1'); if(back1) back1.onclick = ()=>goStep(1);
    const map = {'f-name':'name','f-email':'email','f-phone':'phone'};
    Object.keys(map).forEach(id=>{
      const el = $(id);
      if(el) el.oninput = e=>{
        clientForm[map[id]] = e.target.value;
        updateConfirmButtonState();
      };
    });
    const emailEl = $('f-email'); if(emailEl) emailEl.onblur = onEmailBlur;
    const couponEl = $('f-coupon'); if(couponEl) couponEl.oninput = e=> clientForm.couponCode = e.target.value;
    attachIntakeRegionHandlers();
    const conf = $('confirmBtn'); if(conf) conf.onclick = confirmBooking;
    mountCardElementIfNeeded();
  } else {
    const dateEl=$('ns-date'), timeEl=$('ns-time'), durEl=$('ns-duration');
    if(dateEl) dateEl.oninput = e=> newSlot.date = e.target.value;
    if(timeEl) timeEl.oninput = e=> newSlot.time = e.target.value;
    if(durEl) durEl.onchange = e=> newSlot.duration = e.target.value;
    document.querySelectorAll('[data-admin-type]').forEach(el=>{ el.onclick = ()=>selectAdminType(el.getAttribute('data-admin-type')); });
    const toggleSchedBtn = $('toggleScheduleEditor'); if(toggleSchedBtn) toggleSchedBtn.onclick = ()=>{ showScheduleEditor = !showScheduleEditor; render(); };
    document.querySelectorAll('[data-admin-view]').forEach(el=>{ el.onclick = ()=>{ adminView = el.getAttribute('data-admin-view'); render(); }; });
    document.querySelectorAll('[data-view-client]').forEach(el=>{
      el.onclick = ()=>{ adminView = 'clients'; expandedClientId = el.getAttribute('data-view-client'); render(); };
    });
    document.querySelectorAll('[data-rule-day]').forEach(el=>{ el.onclick = ()=>toggleRuleDay(Number(el.getAttribute('data-rule-day'))); });
    document.querySelectorAll('[data-remove-rule]').forEach(el=>{ el.onclick = ()=>removeRule(el.getAttribute('data-remove-rule')); });
    const nrStart=$('nr-start'), nrEnd=$('nr-end');
    if(nrStart) nrStart.oninput = e=> newRule.start = e.target.value;
    if(nrEnd) nrEnd.oninput = e=> newRule.end = e.target.value;
    const addRuleBtn = $('addRuleBtn'); if(addRuleBtn) addRuleBtn.onclick = addRule;
    document.querySelectorAll('[data-cal-day]').forEach(el=>{
      el.onclick = ()=>{ selectedScheduleDate = el.getAttribute('data-cal-day'); render(); };
    });
    const calPrev = $('calPrevMonth');
    if(calPrev) calPrev.onclick = ()=>{ scheduleCalMonth = new Date(scheduleCalMonth.getFullYear(), scheduleCalMonth.getMonth()-1, 1); render(); };
    const calNext = $('calNextMonth');
    if(calNext) calNext.onclick = ()=>{ scheduleCalMonth = new Date(scheduleCalMonth.getFullYear(), scheduleCalMonth.getMonth()+1, 1); render(); };
    document.querySelectorAll('[data-dash-day]').forEach(el=>{
      el.onclick = ()=>{ selectedDashboardDate = el.getAttribute('data-dash-day'); render(); };
    });
    const dashCalPrev = $('dashCalPrevMonth');
    if(dashCalPrev) dashCalPrev.onclick = ()=>{ dashboardCalMonth = new Date(dashboardCalMonth.getFullYear(), dashboardCalMonth.getMonth()-1, 1); render(); };
    const dashCalNext = $('dashCalNextMonth');
    if(dashCalNext) dashCalNext.onclick = ()=>{ dashboardCalMonth = new Date(dashboardCalMonth.getFullYear(), dashboardCalMonth.getMonth()+1, 1); render(); };
    const qaTimeEl = $('quickAddTime'), qaDurEl = $('quickAddDuration');
    if(qaTimeEl) qaTimeEl.oninput = e=> quickAddTime = e.target.value;
    if(qaDurEl) qaDurEl.onchange = e=> quickAddDuration = Number(e.target.value);
    const quickAddBtn = $('quickAddBtn');
    if(quickAddBtn) quickAddBtn.onclick = async ()=>{
      if(!selectedScheduleDate || !quickAddTime) return;
      state.slots.push({ id: uid(), date: selectedScheduleDate, time: quickAddTime, duration: quickAddDuration, type: adminType });
      quickAddTime = '';
      await saveState(); render();
    };
    const meetEl=$('set-meet'), locEl=$('set-location'), intakeEl=$('set-intake');
    const saveSettingsBtn = $('save-settings-btn');
    if(saveSettingsBtn){
      saveSettingsBtn.onclick = async ()=>{
        state.settings.meetLink = meetEl ? meetEl.value : state.settings.meetLink;
        state.settings.location = locEl ? locEl.value : state.settings.location;
        state.settings.intakeQuestions = intakeEl ? intakeEl.value.split('\n').map(s=>s.trim()).filter(Boolean) : state.settings.intakeQuestions;
        saveSettingsBtn.disabled = true; saveSettingsBtn.textContent = 'Saving…';
        const ok = await saveState();
        saveSettingsBtn.disabled = false; saveSettingsBtn.textContent = 'Save settings';
        const msg = $('settings-save-msg');
        if(msg){
          msg.style.color = ok ? '#2E5B27' : '#A5433A';
          msg.textContent = ok ? 'Saved.' : 'Could not save — try logging out and back in.';
          setTimeout(()=>{ if(msg) msg.textContent=''; }, 4000);
        }
      };
    }
    const addBtn = $('addSlotBtn'); if(addBtn) addBtn.onclick = addSlot;
    const couponCodeEl=$('coupon-code'), couponDescEl=$('coupon-desc'), couponMaxEl=$('coupon-max');
    if(couponCodeEl) couponCodeEl.oninput = e=> newCoupon.code = e.target.value;
    if(couponDescEl) couponDescEl.oninput = e=> newCoupon.description = e.target.value;
    if(couponMaxEl) couponMaxEl.oninput = e=> newCoupon.maxUses = e.target.value;
    const addCouponBtn = $('addCouponBtn'); if(addCouponBtn) addCouponBtn.onclick = addCoupon;
    document.querySelectorAll('[data-remove-coupon]').forEach(el=>{ el.onclick = ()=>removeCoupon(el.getAttribute('data-remove-coupon')); });
    document.querySelectorAll('[data-remove-slot]').forEach(el=>{ el.onclick = ()=>removeSlot(el.getAttribute('data-remove-slot')); });
    document.querySelectorAll('[data-mark-complete]').forEach(el=>{ el.onclick = ()=>markComplete(el.getAttribute('data-mark-complete')); });
    document.querySelectorAll('[data-charge]').forEach(el=>{ el.onclick = ()=>chargeAndReceipt(el.getAttribute('data-charge')); });
    document.querySelectorAll('[data-actual-hours]').forEach(el=>{
      el.oninput = ()=>{
        const id = el.getAttribute('data-actual-hours');
        const amtEl = document.querySelector(`[data-amount="${id}"]`);
        const hours = parseFloat(el.value);
        if(amtEl && !isNaN(hours)){
          amtEl.value = (Math.round(hours*500*100)/100).toFixed(2);
        }
      };
    });
    document.querySelectorAll('[data-skip-charge]').forEach(el=>{ el.onclick = ()=>skipCharge(el.getAttribute('data-skip-charge')); });
    document.querySelectorAll('[data-cancel-booking]').forEach(el=>{ el.onclick = ()=>cancelBooking(el.getAttribute('data-cancel-booking')); });
    document.querySelectorAll('[data-start-timer]').forEach(el=>{ el.onclick = ()=>startTimer(el.getAttribute('data-start-timer')); });
    document.querySelectorAll('[data-join-start]').forEach(el=>{
      el.onclick = ()=>{
        const id = el.getAttribute('data-join-start');
        const b = state.bookings.find(x=>x.id===id);
        if(b && b.meetLink) window.open(b.meetLink, '_blank');
        startTimer(id);
      };
    });
    document.querySelectorAll('[data-fetch-gemini]').forEach(el=>{
      el.onclick = async ()=>{
        const id = el.getAttribute('data-fetch-gemini');
        const msg = document.getElementById('gemini-msg-'+id);
        el.disabled = true; el.textContent = 'Fetching…';
        try{
          const res = await fetch('/api/fetch-gemini-notes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
            body: JSON.stringify({ bookingId: id })
          });
          const data = await res.json();
          if(data.error){
            if(msg){ msg.style.color = '#A5433A'; msg.textContent = data.error; }
            el.disabled = false; el.textContent = 'Fetch notes & duration';
            return;
          }
          await loadAdminState();
          render();
          const msg2 = document.getElementById('gemini-msg-'+id);
          if(msg2 && data.note){ msg2.style.color = data.foundDuration ? '#2E5B27' : '#6E6E6E'; msg2.textContent = data.note; }
        }catch(e){
          if(msg){ msg.style.color = '#A5433A'; msg.textContent = 'Something went wrong.'; }
          el.disabled = false; el.textContent = 'Fetch notes & duration';
        }
      };
    });
    document.querySelectorAll('[data-stop-timer]').forEach(el=>{ el.onclick = ()=>stopTimer(el.getAttribute('data-stop-timer')); });
    document.querySelectorAll('[data-meet]').forEach(el=>{ el.onchange = ()=>updateBooking(el.getAttribute('data-meet'), { meetLink: el.value }); });
    document.querySelectorAll('[data-summary]').forEach(el=>{ el.onchange = ()=>updateBooking(el.getAttribute('data-summary'), { summary: el.value }); });
    document.querySelectorAll('[data-clientsummary]').forEach(el=>{ el.onchange = ()=>updateBooking(el.getAttribute('data-clientsummary'), { clientSummary: el.value }); });
    document.querySelectorAll('[data-toggle-client]').forEach(el=>{ el.onclick = ()=>toggleExpandClient(el.getAttribute('data-toggle-client')); });
    document.querySelectorAll('[data-block-client]').forEach(el=>{ el.onclick = (e)=>{ e.stopPropagation(); setClientBlocked(el.getAttribute('data-block-client'), true); }; });
    document.querySelectorAll('[data-unblock-client]').forEach(el=>{ el.onclick = (e)=>{ e.stopPropagation(); setClientBlocked(el.getAttribute('data-unblock-client'), false); }; });
  }
}

loadState();
</script>
</body>
</html>
